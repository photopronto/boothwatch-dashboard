/* ---------- phone notifications ---------- */
let PUSH={kind:'checking'};
const isIos=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;
function b64ToBytes(b64){const pad='='.repeat((4-b64.length%4)%4);const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function saveSub(sub){const j=sub.toJSON();const {error}=await SB.from('planner_push_subs').upsert({owner_id:USER.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,label:navigator.userAgent.slice(0,120)},{onConflict:'endpoint'});if(error)throw error}
async function refreshPushState(){
  const can='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
  if(!can){PUSH={kind:isIos&&!isStandalone()?'ios-install':'unsupported'};renderSoon();return}
  if(Notification.permission==='denied'){PUSH={kind:'blocked'};renderSoon();return}
  try{
    const reg=await navigator.serviceWorker.register('sw.js',{scope:'./'});
    let sub=await reg.pushManager.getSubscription();
    if(Notification.permission==='granted'){
      if(!sub){try{sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(CONFIG.VAPID_PUBLIC_KEY)})}catch(e){console.error(e)}}
      if(sub){saveSub(sub).catch(console.error);PUSH={kind:'on'};renderSoon();return}
    }
  }catch(e){console.error(e);PUSH={kind:'unsupported'};renderSoon();return}
  PUSH={kind:'ask'};renderSoon();
}
A.enablePush=async()=>{
  try{
    const reg=await navigator.serviceWorker.register('sw.js',{scope:'./'});
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){PUSH={kind:perm==='denied'?'blocked':'ask'};render();return}
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(CONFIG.VAPID_PUBLIC_KEY)});
    await saveSub(sub);PUSH={kind:'on',note:'Turned on for this device.'};
  }catch(e){console.error(e);PUSH={kind:'error',note:e.message||'Could not turn on notifications.'}}
  render();
};
A.disablePush=async()=>{
  try{const reg=await navigator.serviceWorker.getRegistration('./');const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await SB.from('planner_push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}
    PUSH={kind:'ask',note:'Turned off for this device.'};
  }catch(e){PUSH={kind:'error',note:e.message}}
  render();
};
A.testPush=async d=>{
  const {data:{session}}=await SB.auth.getSession();
  try{const r=await fetch(CONFIG.SUPABASE_URL+'/functions/v1/planner-notify?test='+(d.k||'checkin'),{method:'POST',headers:{'Content-Type':'application/json',apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+session.access_token},body:'{}'});
    toast(r.ok?'Sent — it should arrive in a few seconds':'Test failed ('+r.status+')')}catch(e){toast('Test failed: '+e.message)}
};
function pushCard(){
  let body='';const k=PUSH.kind;
  if(k==='ios-install')body=`On iPhone, notifications only work from the home-screen app. In Safari tap <b>Share</b> → <b>Add to Home Screen</b>, open <b>Planner</b> from your home screen, then come back here.`;
  else if(k==='ask')body=`<div class="spread"><span>Notifications are off on this device.</span><button class="btn primary sm" data-a="enablePush">Turn on</button></div>`;
  else if(k==='on')body=`<div class="spread"><span>On for this device ✓</span><button class="btn sm" data-a="disablePush">Turn off</button></div><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px"><span class="small muted">Send a test:</span><button class="btn sm" data-a="testPush" data-k="morning">Morning</button><button class="btn sm" data-a="testPush" data-k="checkin">Check-in</button><button class="btn sm" data-a="testPush" data-k="week">Plan week</button></div>`;
  else if(k==='blocked')body=`Notifications are blocked for this site in your browser or phone settings. Allow them there, then reload.`;
  else if(k==='unsupported')body=`This browser can't receive notifications.`;
  else if(k==='error')body=`<span style="color:var(--warn)">${esc(PUSH.note||'Something went wrong')}</span> <button class="btn sm" data-a="enablePush">Try again</button>`;
  else body=`<span class="faint">Checking…</span>`;
  if(PUSH.note&&k!=='error')body+=`<p class="small muted">${esc(PUSH.note)}</p>`;
  return `<div class="card">${body}</div>`;
}

/* ---------- weekly plan ---------- */
function weekPlanPrompt(){
  const t=today(),d=dow(t),tw=weekStart(t),nw=addDays(tw,7);
  if((d===0||d===6||d===5)&&!weekPlanned(nw))return {ws:nw,title:'Where are you working next week?'};
  if(!weekPlanned(tw)&&d>=1&&d<=4)return {ws:tw,title:'Plan this week'};
  return null;
}
function weekRange(ws){const a=parseD(ws),b=parseD(addDays(ws,6));return `${a.getDate()} ${a.toLocaleDateString('en-GB',{month:'short'})} – ${b.getDate()} ${b.toLocaleDateString('en-GB',{month:'short'})}`}
function weekDraft(ws){const w=S.weeks[ws];const days={};for(let i=0;i<7;i++){const d=addDays(ws,i),k=String(dow(d));days[k]=(w&&w.days&&w.days[k])||S.settings.usual[k]||'off'}return days}
function weekPlannerHtml(){
  const {ws,days}=S.pwDraft;const opts=[...workplaces().map(c=>[c.id,c.name]),['free','Free'],['off','Off']];
  let h=`<h2>Where are you working?</h2><div class="spread" style="margin-bottom:8px"><span class="muted">${weekRange(ws)}</span><div class="row" style="gap:4px"><button class="btn sm" data-a="pwNav" data-n="-7">‹</button><button class="btn sm" data-a="pwNav" data-n="7">›</button></div></div>`;
  for(let i=0;i<7;i++){const d=addDays(ws,i),k=String(dow(d)),v=days[k],pd=parseD(d);
    h+=`<div class="pwrow" style="background:${typeTint(v)}"><div class="pwday"><b>${DAYNAMES[pd.getDay()]}</b><span>${pd.getDate()}</span></div><div class="pwopts">${opts.map(([o,n])=>`<button type="button" class="pwopt ${v===o?'on':''}" data-a="pwSet" data-k="${k}" data-v="${o}">${esc(n)}</button>`).join('')}</div></div>`}
  const free=Object.values(days).filter(v=>v==='free').length;
  h+=`<p class="small muted">${free?`${free} free day${free>1?'s':''} for big tasks.`:'No free days — big tasks will wait for the next one.'} Evenings take quick tasks.</p>
  <div class="actions"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="saveWeek">Save week</button></div>`;
  return h;
}
A.planWeek=d=>{S.pwDraft={ws:d.w,days:weekDraft(d.w)};openModal(weekPlannerHtml())};
A.pwNav=d=>{const ws=addDays(S.pwDraft.ws,Number(d.n));S.pwDraft={ws,days:weekDraft(ws)};$('#modal').innerHTML=weekPlannerHtml()};
A.pwSet=d=>{S.pwDraft.days[d.k]=d.v;$('#modal').innerHTML=weekPlannerHtml()};
A.saveWeek=()=>{const {ws,days}=S.pwDraft;put('weeks',ws,{days:{...days},savedAt:new Date().toISOString()});closeModal();setTimeout(()=>{plan('all');toast(`Week of ${weekRange(ws)} planned`)},0)};

/* ---------- calendar ---------- */
function vCalendar(){
  const t=today();if(!S.calMonth)S.calMonth=t.slice(0,7);
  const [y,m]=S.calMonth.split('-').map(Number);const first=`${S.calMonth}-01`;const gridStart=weekStart(first);
  const label=parseD(first).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const byDay={},dueDay={};
  for(const x of Object.values(S.tasks)){if(x.scheduled)(byDay[x.scheduled]=byDay[x.scheduled]||[]).push(x);const dl=effDeadline(x);if(dl&&x.status!=='done')(dueDay[dl]=dueDay[dl]||0,dueDay[dl]++)}
  let h=`<div class="spread"><h2>${label}</h2><div class="row" style="gap:4px"><button class="btn sm" data-a="calNav" data-n="-1">‹</button><button class="btn sm" data-a="calNav" data-n="0">Today</button><button class="btn sm" data-a="calNav" data-n="1">›</button></div></div>
  <div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="chead">${d}</div>`).join('')}`;
  for(let i=0;i<42;i++){
    const d=addDays(gridStart,i);if(i>=35&&d.slice(0,7)!==S.calMonth)break;
    const v=dayType(d),ts=byDay[d]||[],open=ts.filter(x=>x.status!=='done').length,done=ts.length-open;
    const cls=['cday',d.slice(0,7)!==S.calMonth?'out':'',d===t?'today':'',d<t?'past':'',weekPlanned(d)?'':'guess'].join(' ');
    h+=`<button class="${cls}" style="background:${typeTint(v)}" data-a="calDay" data-d="${d}"><span class="n">${parseD(d).getDate()}</span><span class="l">${esc(v==='free'?'Free':v==='off'?'Off':clientName(v))}</span><span class="cfoot">${open?`<span class="c">${open}</span>`:done?`<span class="c done">✓${done}</span>`:''}${dueDay[d]?'<span class="due" title="Deadline">!</span>':''}</span></button>`;
  }
  h+=`</div><div class="legend">${[...workplaces().map(c=>[c.id,c.name]),['free','Free day'],['off','Off']].map(([k,n])=>`<span><i style="background:${typeTint(k)}"></i>${esc(n)}</span>`).join('')}<span><i class="guessi"></i>Usual pattern (not planned yet)</span><span><b class="due">!</b> Deadline</span></div>
  <p class="small muted" style="padding:0 4px">Tap a day to see its tasks or change what kind of day it is.</p>`;
  return h;
}
function calDayHtml(d){
  const v=dayType(d),pd=parseD(d);const {slots,other}=assignDay(d);
  const dues=Object.values(S.tasks).filter(x=>x.status!=='done'&&effDeadline(x)===d);
  const opts=[...workplaces().map(c=>[c.id,c.name]),['free','Free'],['off','Off']];
  let h=`<div class="spread"><div><div class="muted">${pd.toLocaleDateString('en-GB',{weekday:'long'})}</div><div class="bigdate" style="font-size:64px">${pd.getDate()} ${MON(d)}</div></div></div>
  <label class="f">This day is</label><div class="pwopts" style="margin-bottom:8px">${opts.map(([o,n])=>`<button type="button" class="pwopt ${v===o?'on':''}" data-a="setDay" data-d="${d}" data-v="${o}">${esc(n)}</button>`).join('')}</div>`;
  h+=`<div class="stack" style="margin-top:12px">${slots.map(slotCard).join('')}${other.length?slotCard({label:'Other',tint:GREY_TINT,tasks:other,mins:0,used:0}):''}</div>`;
  if(!slots.length&&!other.length)h+=`<div class="empty">Day off — nothing planned.</div>`;
  if(dues.length)h+=`<h3>Due this day</h3>${dues.map(x=>taskRow(x,{showDate:true,showArea:true})).join('')}`;
  return h+`<div class="actions"><button class="btn" data-a="close">Close</button></div>`;
}
A.calNav=d=>{const n=Number(d.n);if(!n){S.calMonth=today().slice(0,7)}else{const [y,m]=S.calMonth.split('-').map(Number);const dt=new Date(y,m-1+n,1);S.calMonth=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}`}render()};
A.calDay=d=>openModal(calDayHtml(d.d));
A.setDay=d=>{const ws=weekStart(d.d);const days=weekDraft(ws);days[String(dow(d.d))]=d.v;put('weeks',ws,{days,savedAt:new Date().toISOString()});plan('all');setTimeout(()=>{$('#modal').innerHTML=calDayHtml(d.d)},30)};

/* ---------- quick add + task actions ---------- */
async function quickAdd(text){
  const btn=$('#quickBtn'),inp=$('#quickInput');if(btn){btn.disabled=true;btn.textContent='…'}
  let list=[];
  try{list=await parseEmail(text,true)}catch(e){console.error(e)}
  if(!list.length)list=[{title:text,estimate:30,size:'quick',area:'home'}];
  const ids=list.map(t=>newTask(t));
  plan('new');
  const where=ids.map(id=>{const x=S.tasks[id];return x?`${x.title} → ${x.scheduled?relDay(x.scheduled):'no slot yet'}`:''}).filter(Boolean);
  toast('Added: '+where.join(' · '));
  if(inp)inp.value='';if(btn){btn.disabled=false;btn.textContent='Add'}
}
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form!=='quick')return;e.preventDefault();e.stopImmediatePropagation();const q=(new FormData(f).get('q')||'').trim();if(q)quickAdd(q)},true);
A.taskAction=d=>{const t=S.tasks[d.id];if(!t||!t.action)return;
  if(t.action.type==='invoice'){S.invDraft={...newInvoiceDraft(),clientId:t.action.client,month:t.action.month};openModal(invoiceEditor())}
  else if(t.action.type==='chase'&&S.invoices[t.action.invoice])openModal(invoiceView(S.invoices[t.action.invoice]));
  else toast('That invoice no longer exists');
};
/* ---------- sync with the database ---------- */
async function loadAll(){
  const rows=[];let from=0;
  for(;;){const {data,error}=await SB.from('planner_docs').select('col,id,data').range(from,from+999);if(error)throw error;rows.push(...data);if(data.length<1000)break;from+=1000}
  for(const c of COLS)S[c]={};settingsExists=false;let st=null;
  for(const r of rows){if(r.col==='config'&&r.id==='settings'){st=r.data;settingsExists=true}else if(S[r.col])S[r.col][r.id]={...r.data,id:r.id}}
  S.settings=mergeSettings(st);
}
let planT;
function applyRemote(p){
  const r=(p.new&&p.new.col)?p.new:p.old;if(!r||!r.col)return;
  if(PENDING[r.col+'/'+r.id]>0)return;
  if(p.eventType==='DELETE'){if(S[r.col])delete S[r.col][r.id]}
  else if(r.col==='config'&&r.id==='settings'){S.settings=mergeSettings(r.data);settingsExists=true}
  else if(S[r.col]){S[r.col][r.id]={...r.data,id:r.id};if(r.col==='tasks'&&!r.data.scheduled&&r.data.status!=='done'){clearTimeout(planT);planT=setTimeout(()=>plan('new'),800)}}
  renderSoon();
}
function subscribeRealtime(){
  SB.channel('planner-'+USER.id).on('postgres_changes',{event:'*',schema:'public',table:'planner_docs',filter:'owner_id=eq.'+USER.id},applyRemote).subscribe();
}
async function resync(){
  if(Object.values(PENDING).some(n=>n>0))return;
  try{await loadAll();plan('new');renderSoon()}catch(e){console.error(e)}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.ready)resync()});
function openCheckinFromLink(){
  const h=location.hash;if(h!=='#checkin'&&h!=='#plan-week')return;
  history.replaceState(null,'',location.pathname+location.search);S.view='today';render();
  if(h==='#checkin')openModal(checkinHtml());else A.planWeek({w:(weekPlanPrompt()||{}).ws||addDays(weekStart(today()),7)});
}
window.addEventListener('hashchange',()=>{if(S.ready)openCheckinFromLink()});
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{
  const d=e.data||{};if(d.type!=='open')return;
  resync().then(()=>{const u=String(d.url||'');if(u.includes('#checkin')){S.view='today';render();openModal(checkinHtml())}else if(u.includes('#plan-week')){A.planWeek({w:(weekPlanPrompt()||{}).ws||addDays(weekStart(today()),7)})}});
});

/* ---------- sign in ---------- */
function renderLogin(msg,mfa){
  $('#nav').innerHTML='';setStatus('');
  $('#view').innerHTML=`<div class="login-wrap"><form class="login-card" id="loginForm">
    <div class="bigdate">${pad(new Date().getDate())}.${pad(new Date().getMonth()+1)}</div>
    ${mfa?`<p class="small muted">Enter the 6-digit code from your authenticator app.</p><input type="text" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code" style="text-align:center;letter-spacing:6px">`
      :`<p class="small muted">Sign in with your Photo Pronto dashboard login.</p><input type="email" id="email" placeholder="Email" autocomplete="username"><input type="password" id="password" placeholder="Password" autocomplete="current-password">`}
    <button class="btn primary">${mfa?'Continue':'Sign in'}</button><div class="err">${esc(msg||'')}</div></form></div>`;
  $('#loginForm').onsubmit=async e=>{
    e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;
    try{
      if(mfa){
        const {data:f}=await SB.auth.mfa.listFactors();const factor=(f&&f.totp||[])[0];
        const {error}=await SB.auth.mfa.challengeAndVerify({factorId:factor.id,code:$('#code').value.replace(/\D/g,'')});
        if(error){renderLogin(error.message,true);return}
        await start();
      }else{
        const {data,error}=await SB.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});
        if(error){renderLogin(error.message);return}
        USER=data.user;await afterSignIn();
      }
    }catch(err){renderLogin(err.message||'Could not sign in.',mfa)}
  };
}
async function afterSignIn(){
  try{const {data}=await SB.auth.mfa.getAuthenticatorAssuranceLevel();if(data&&data.nextLevel==='aal2'&&data.currentLevel!=='aal2'){renderLogin('',true);return}}catch(e){}
  await start();
}
async function start(){
  S.note='Loading your planner…';S.ready=false;render();
  try{await loadAll()}catch(e){S.note="Couldn't load your data: "+(e.message||e);render();return}
  SAMPLE=true;S.ready=true;setStatus('Saved');applySettings();S.view=S.settings.ui.startTab||'today';S.showDone=!!S.settings.ui.showDone;
  if(!settingsExists||!S.settings.worklogFrom)saveSettings({worklogFrom:S.settings.worklogFrom||today()});
  subscribeRealtime();plan('new');render();openCheckinFromLink();
  refreshPushState();loadInbox();
  setInterval(()=>{if(S.ready)renderSoon()},60000);
}
async function boot(){
  render();
  if(!window.supabase){S.note="Couldn't load — check your connection and reload.";render();return}
  SB=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const {data:{session}}=await SB.auth.getSession();
  if(!session){renderLogin();return}
  USER=session.user;await afterSignIn();
}
boot();
</script>
