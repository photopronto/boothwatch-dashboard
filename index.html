<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');

  /* Layout: white page, light-grey rounded tiles, one blue hero tile, black only for "needs attention". */
  :root{
    --accent: #0078FF;
    --accent-soft: #E5F0FF;
    --ink: #0A0A0B;
    --muted: #6B7078;
    --clock: #9AA0AA;
    --bg: #FFFFFF;
    --tile: #F2F3F5;
    --inner: #FFFFFF;
    --line: #E1E3E8;
    --track: #DDE0E6;
    --display: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family: var(--display); font-weight:600; font-size: 14px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select{ font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  header{
    display:flex; align-items:center; justify-content:space-between; gap:16px 24px; flex-wrap:wrap;
    padding: 24px clamp(16px, 4vw, 48px) 8px; max-width: 1280px; margin: 0 auto;
  }
  .logo{ height: 54px; width:auto; display:block; }
  .head-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pair{ display:flex; gap:8px; }
  .pair input{
    width: 150px; padding: 10px 16px; border-radius: 999px; border:1px solid var(--line); background: var(--tile);
    font-family: var(--mono); font-weight:500; font-size:13px; letter-spacing: 2px; color: var(--ink);
  }
  .pair input::placeholder{ letter-spacing: 0; color: var(--muted); }

  .btn, header button, .controls button, .releases button, .shot-close{
    background: var(--inner); color: var(--ink); border:1px solid var(--line); border-radius: 999px;
    font-weight:600; font-size: 13px; padding: 9px 16px; cursor:pointer;
  }
  .btn:hover, header button:hover, .controls button:hover, .releases button:hover, .shot-close:hover{ border-color: var(--accent); color: var(--accent); }
  #pair-btn{ background: var(--ink); color:#fff; border-color: var(--ink); }
  #pair-btn:hover{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .controls button:disabled{ opacity:.5; cursor:default; color: var(--muted); border-color: var(--line); }
  .controls button.danger:hover{ border-color: var(--ink); background: var(--ink); color:#fff; }

  /* ── notifications bell ── */
  .bell-wrap{ position:relative; }
  .bell{ position:relative; width:42px; height:42px; padding:0 !important; display:inline-flex; align-items:center; justify-content:center; border-radius:50% !important; }
  .bell svg{ width:20px; height:20px; }
  .bell-count{ position:absolute; top:-4px; right:-4px; min-width:20px; height:20px; padding:0 5px; border-radius:999px; background: var(--accent); color:#fff;
    font-family: var(--mono); font-weight:600; font-size:11px; line-height:20px; text-align:center; }
  .notif-panel{ position:absolute; right:0; top: calc(100% + 10px); width: min(420px, calc(100vw - 32px)); max-height: min(560px, calc(100vh - 120px)); overflow:auto;
    background: var(--bg); border:1px solid var(--line); border-radius: 24px; box-shadow: 0 18px 50px rgba(10,10,11,.14); z-index: 20; padding: 8px; }
  .np-head{ display:flex; justify-content:space-between; align-items:center; padding: 12px 12px 8px; font-weight:700; font-size:18px; }
  .np-head button{ font-size:12px !important; padding: 5px 12px !important; }
  .np-push{ margin: 4px; padding: 12px 14px; background: var(--tile); border-radius: 18px; font-size:12px; font-weight:500; line-height:1.5; display:flex; flex-direction:column; gap:10px; }
  .np-push .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .np-push button{ background: var(--inner); border:1px solid var(--line); border-radius:999px; padding: 6px 14px; font-weight:600; font-size:12px; cursor:pointer; }
  .np-push button.primary{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .np-push button:hover{ border-color: var(--ink); }
  .np-list{ display:flex; flex-direction:column; padding: 4px 0; }
  .np-item{ display:flex; gap:12px; padding: 12px; border-radius: 16px; cursor:pointer; }
  .np-item:hover{ background: var(--tile); }
  .np-dot{ flex:none; width:10px; height:10px; border-radius:50%; margin-top:5px; border:1.5px solid var(--track); }
  .np-item.unread .np-dot{ border:none; background: var(--ink); }
  .np-item.unread.info .np-dot{ background: var(--accent); }
  .np-title{ font-weight:600; font-size:14px; line-height:1.3; color: var(--muted); }
  .np-item.unread .np-title{ font-weight:700; color: var(--ink); }
  .np-body{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); margin-top:3px; line-height:1.45; overflow-wrap:anywhere; white-space:pre-line}
  .np-time{ font-family: var(--mono); font-weight:500; font-size:11px; color: var(--muted); margin-top:4px; }
  .np-empty{ padding: 28px 16px; text-align:center; color: var(--muted); font-weight:500; }
  .frame.flash{ outline: 3px solid var(--accent); outline-offset: 2px; transition: outline-color .6s; }

  main{ padding: 8px clamp(16px, 4vw, 48px) 64px; max-width:1280px; margin:0 auto; }

  .nowbar{ display:flex; align-items:center; justify-content:space-between; gap:16px 32px; flex-wrap:wrap; padding: 22px 0 22px; }
  .fleet-checkin{ display:flex; gap: 12px 36px; flex-wrap:wrap; }
  .fleet-checkin .k{ display:block; font-weight:600; font-size:12px; color: var(--muted); margin-bottom:4px; }
  .fleet-checkin b{ font-family: var(--mono); font-weight:600; font-size:15px; font-variant-numeric: tabular-nums; }
  .clockbox{ display:flex; align-items:center; gap:14px; }
  .clock-text{ text-align:right; }
  .title-sub{ font-weight:600; font-size:12px; color: var(--muted); font-family: var(--display); }
  .clock-time{ font-family: var(--mono); font-weight:600; font-size:15px; line-height:1.2; font-variant-numeric: tabular-nums; margin-top:4px; }
  .clock-svg{ width:44px; height:44px; flex:none; }
  .clock-svg .face{ fill:none; stroke: var(--clock); stroke-width:1; }
  .clock-svg .tick{ stroke: var(--clock); stroke-width:1; stroke-linecap:round; }
  .clock-svg .hand, .clock-svg .sec{ stroke: var(--clock); stroke-linecap:round; }
  .clock-svg .pin{ fill: var(--clock); }

  /* ── login ── */
  .login-wrap{ display:flex; justify-content:center; padding: 12vh 16px 0; }
  .login-card{ background: var(--tile); border-radius: 28px; padding: 36px; width: min(380px, 100%); }
  .login-card .logo{ height: 60px; margin-bottom: 28px; display:block; }
  .login-card h2{ font-weight:700; font-size: 26px; margin:0 0 4px; letter-spacing:-.01em; }
  .login-card p{ color: var(--muted); font-size: 14px; margin: 0 0 24px; font-weight:500; }
  .login-card input{
    width:100%; padding: 13px 16px; margin-bottom: 10px; border-radius: 14px; border:1px solid var(--line);
    background: var(--inner); color: var(--ink); font-size:14px; font-weight:500;
  }
  .login-card button{
    width:100%; padding: 14px; margin-top: 6px; border-radius: 999px; border:none;
    background: var(--accent); color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  }
  .login-card button:hover{ background: var(--ink); }
  .error{ color: var(--ink); font-size:13px; margin-top:12px; min-height: 1em; font-weight:600; }

  /* ── summary tiles ── */
  .summary{ display:grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .tile{ background: var(--tile); border-radius: 24px; padding: 20px 22px 18px; min-width:0; }
  .tile .tile-label{ font-weight:600; font-size:14px; color: var(--muted); }
  .tile .tile-num{ font-weight:700; font-size: clamp(40px, 5vw, 56px); line-height:1; margin: 18px 0 10px; letter-spacing:-.02em; font-variant-numeric: tabular-nums; }
  .tile .tile-sub{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); }
  .tile.hero{ background: var(--accent); color:#fff; }
  .tile.hero .tile-label, .tile.hero .tile-sub{ color: rgba(255,255,255,.82); }
  .tile.dark{ background: var(--ink); color:#fff; }
  .tile.dark .tile-label, .tile.dark .tile-sub{ color: rgba(255,255,255,.72); }

  /* ── agent versions ── */
  .releases{ margin: 6px 0 28px; }
  .releases summary{ cursor:pointer; padding: 8px 0; font-weight:600; color: var(--muted); }
  .releases summary:hover{ color: var(--accent); }
  .releases .rel-body{ background: var(--tile); border-radius: 24px; padding: 20px; margin-top: 6px; display:flex; flex-direction:column; gap:12px; max-width: 580px; }
  .releases .rel-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .releases b{ font-weight:700; }
  #rel-status{ font-family: var(--mono); font-weight:500; font-size:12px; line-height:1.6; }
  .releases input[type=file]{ font-family: var(--mono); font-size:12px; max-width:100%; color: var(--muted); }
  .rel-help{ font-size:12px; line-height:1.5; color: var(--muted); font-weight:500; }

  /* ── booth cards ── */
  .frames{ display:grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; align-items:start; }
  .frames.cols{ display:flex; align-items:flex-start; gap:14px; }
  .frame-col{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:14px; }
  .frame{ background: var(--tile); border-radius: 28px; padding: 22px; min-width:0; display:flex; flex-direction:column; gap: 14px; }
  .frame-body{ display:flex; flex-direction:column; gap:14px; }
  .frame-mini, .chev{ display:none; }

  .frame-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .frame-top > div:first-child{ flex:1; min-width:0; }
  .frame-top .right{ display:flex; align-items:center; gap:10px; flex:none; }
  .frame-name{ font-weight:700; font-size: 24px; line-height:1.1; letter-spacing:-.01em; overflow-wrap:anywhere; }
  .frame-name.editable{ cursor:pointer; }
  .frame-name.editable:hover{ color: var(--accent); }
  .frame-loc{ color: var(--muted); font-size:13px; margin-top:4px; font-weight:500; }
  .checkin{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); margin-top:6px; line-height:1.6; font-variant-numeric: tabular-nums; }
  .checkin b{ color: var(--ink); font-weight:600; }

  .pill{ flex:none; display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding: 6px 12px; font-size:12px; font-weight:700; white-space:nowrap; }
  .pill::before{ content:""; width:7px; height:7px; border-radius:50%; background: currentColor; }
  .pill.ok{ background: var(--accent); color:#fff; }
  .pill.alert{ background: var(--ink); color:#fff; }
  .pill.off{ background: var(--inner); color: var(--muted); border:1px solid var(--line); }
  .badge-closed{ display:inline-block; vertical-align:middle; margin-left:8px; font-size:11px; font-weight:700; letter-spacing:.04em;
    text-transform:uppercase; color: var(--accent); background: var(--accent-soft); border-radius:999px; padding: 3px 9px; }

  .frame-metrics{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric{ background: var(--inner); border-radius: 18px; padding: 14px 16px; }
  .metric .num{ font-weight:700; font-size: 36px; line-height:1; letter-spacing:-.02em; font-variant-numeric: tabular-nums; }
  .metric .label{ color: var(--muted); font-size:12px; margin-top:6px; font-weight:600; }

  .roll-bar{ height: 10px; background: var(--track); border-radius: 999px; overflow:hidden; }
  .roll-fill{ height:100%; background: var(--accent); border-radius: 999px; }
  .roll-fill.warn, .roll-fill.alert{ background: var(--ink); }
  .roll-label{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:-4px; }
  .roll-label button{ background:none; border:none; color: var(--accent); font-family: var(--display); font-weight:600; font-size:12px; cursor:pointer; padding:0; text-decoration: underline; }

  .programs{ background: var(--inner); border-radius: 18px; padding: 6px 16px; }
  .program{ display:flex; align-items:flex-start; gap:12px; padding: 12px 0; border-bottom:1px solid var(--line); }
  .program:last-child{ border-bottom:none; }
  .program .dot{ width:10px; height:10px; border-radius:50%; margin-top:4px; flex:none; background: var(--accent); }
  .program .dot.alert{ background: var(--ink); }
  .program.stale .dot{ background: var(--track); }
  .program.stale{ color: var(--muted); }
  .program-main{ flex:1; min-width:0; }
  .program-head{ display:flex; justify-content:space-between; gap:10px; font-weight:700; font-size:15px; }
  .program .state{ font-family: var(--mono); font-weight:500; color: var(--muted); font-size:12px; flex:none; padding-top:2px; }
  .program .title{ font-family: var(--mono); font-weight:500; color: var(--muted); font-size:11px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .program .detail{ font-family: var(--mono); font-weight:500; color: var(--muted); font-size:12px; margin-top:4px; line-height:1.4; overflow-wrap:anywhere; }
  .program .detail b{ color: var(--ink); font-weight:600; margin-right:6px; }
  .program .detail.screen{ font-family: var(--display); font-weight:700; color: var(--accent); font-size:18px; margin-top:4px; text-transform: capitalize; }
  .program .detail.screen b{ font-family: var(--mono); font-weight:500; font-size:11px; color: var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-right:8px; }
  .program .note{ display:block; font-size:13px; margin-top:4px; color: var(--ink); font-weight:700; }
  .prog-btn{ margin-top:8px; font-size:11px; font-weight:600; padding: 4px 12px; border-radius:999px; background: var(--tile); border:1px solid var(--line); color: var(--ink); cursor:pointer; }
  .prog-btn:hover{ border-color: var(--accent); color: var(--accent); }
  .prog-btn:disabled{ opacity:.5; cursor:default; color: var(--muted); }

  .controls{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .controls label{ display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; cursor:pointer; margin-right:6px; }
  .controls input[type=checkbox]{ accent-color: var(--accent); width:16px; height:16px; }
  .controls select{ background: var(--inner); color: var(--ink); border:1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size:12px; font-weight:600; }

  .cmd-line{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); line-height:1.5; overflow-wrap:anywhere; }
  .cmd-line.bad{ color: var(--ink); font-weight:600; }
  .warn-line{ font-family: var(--mono); font-weight:500; font-size:12px; line-height:1.5; background: var(--inner); border-radius: 12px; padding: 9px 12px; }
  .agent-info{ font-family: var(--mono); font-weight:500; font-size:11px; color: var(--muted); }

  .shot-overlay{ position:fixed; inset:0; background:rgba(10,10,11,.86); z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px; }
  .shot-overlay img{ max-width:100%; max-height:80vh; border-radius: 12px; background:#000; }
  .shot-overlay .shot-meta{ color:#fff; font-family: var(--mono); font-size:12px; }

  .empty{ color: var(--muted); text-align:center; padding: 60px 20px; font-size:14px; background: var(--tile); border-radius: 28px; font-weight:500; }

  @media (max-width: 700px){
    .logo{ height: 46px; margin-right:auto; }
    header{ row-gap:12px; }
    .head-actions{ display:contents; }
    .bell-wrap{ order:1; }
    .pair, #signout{ order:2; }
    .nowbar{ padding: 14px 0 16px; }
    .clockbox{ display:none; }
    .summary{ grid-template-columns: 1fr 1fr; gap:10px; }
    .tile{ padding: 14px 16px; border-radius: 20px; }
    .tile .tile-num{ margin: 10px 0 6px; font-size: 34px; }
    .frames{ gap:10px; }
    .frame{ padding: 16px 18px; border-radius: 24px; gap: 0; }
    .frame-name{ font-size: 19px; }
    .pill{ font-size:11px; padding:5px 10px; }
    .pair input{ width: 130px; }
    .frame-top{ cursor:pointer; align-items:center; }
    .frame-mini{ display:block; font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); margin-top:6px; }
    .chev{ display:block; flex:none; width:22px; height:22px; transition: transform .15s; color: var(--muted); }
    .frame.open .chev{ transform: rotate(180deg); }
    .frame:not(.open) .frame-body{ display:none; }
    .frame.open .frame-mini{ display:none; }
    .frame.open .frame-body{ margin-top: 14px; }
    .frame-top .right{ display:flex; align-items:center; gap:10px; }
    /* name and figures get the full width; the status pill and arrow sit on their own row above */
    .frame-top{ flex-wrap:wrap; row-gap:12px; }
    .frame-top > div:first-child{ flex:1 1 100%; }
    .frame-top .right{ flex:1 1 100%; justify-content:space-between; order:-1; }
    .notif-panel{ position:fixed; left:16px; right:16px; width:auto; top: var(--np-top, 120px); max-height: calc(100vh - var(--np-top, 120px) - 16px); }
  }
  @media (prefers-reduced-motion: reduce){ .chev{ transition:none; } }


  /* ── company overview ── */
  .overview{ display:grid; grid-template-columns: 1.3fr repeat(4, 1fr); gap:14px; background: var(--tile); border-radius:20px; padding:20px 22px; margin-bottom:22px; }
  .ov{ min-width:0; }
  .ov .k{ color: var(--muted); font-size:12.5px; font-weight:500; }
  .ov .v{ font-weight:800; font-size:26px; letter-spacing:-.02em; line-height:1.15; margin:6px 0 2px; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .ov-main .v{ font-size:34px; color: var(--accent); }
  .sect-title{ font-size:15px; font-weight:800; margin:6px 0 12px; }
  @media (max-width:700px){
    .overview{ grid-template-columns: 1fr 1fr; gap:16px 12px; padding:16px; border-radius:18px; margin-bottom:18px; }
    .ov-main{ grid-column: 1 / -1; padding-bottom:14px; border-bottom:1px solid var(--line); }
    .ov .v{ font-size:21px; } .ov-main .v{ font-size:30px; }
  }

  /* ── sales strip on booth cards (sales first, like a machines list) ── */
  .frame .sales{ display:grid; grid-template-columns: 1.15fr 1fr 1fr; gap:6px; margin-top:2px; }
  .sale{ min-width:0; }
  .sale b, .stat b.money{ display:block; font-weight:800; font-size:22px; line-height:1.1; letter-spacing:-.02em; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .frame .sales .sale:first-child b{ font-size:26px; }
  .sale .k{ display:block; color: var(--muted); font-size:11.5px; font-weight:500; margin:0 0 4px; }
  .sub{ all:unset; display:block; cursor:pointer; margin-top:6px; font-family: var(--mono); font-weight:500; font-size:11.5px; color: var(--muted); font-variant-numeric: tabular-nums; border-bottom:1px dotted transparent; width:max-content; max-width:100%; }
  .sub:hover, .sub:focus-visible{ color: var(--ink); border-bottom-color: currentColor; }
  .stat .sub{ margin-top:4px; }
  .stats .stat b{ font-size:18px; white-space:nowrap; }
  .stats .stat .k, .stat .k{ display:block; color: var(--muted); font-size:11.5px; font-weight:500; margin:0 0 3px; }
  .tile-toggle{ cursor:pointer; }

<body>

<div id="app"></div>
<div id="fatal" style="color:#C05B45;padding:20px;font-family:sans-serif"></div>

<script>
window.addEventListener('error', e => { document.getElementById('fatal').textContent = 'Error: ' + e.message; });
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }   // stays signed in on this browser
});

const app = document.getElementById('app');
let currentUser = null;
let pollTimer = null;

function fmtAgo(iso){
  if(!iso) return "never";
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if(s < 60) return s + "s ago";
  if(s < 3600) return Math.floor(s/60) + "m ago";
  return Math.floor(s/3600) + "h ago";
}

function isOnline(booth){
  if(!booth.last_heartbeat_at) return false;
  return (Date.now() - new Date(booth.last_heartbeat_at).getTime()) < 3 * 60 * 1000; // >3 missed heartbeats = offline
}

function renderLogin(errorMsg){
  app.innerHTML = `
    <div class="login-wrap">
      <form class="login-card" id="login-form">
        <img class="logo" src="logo.png" alt="Photo Pronto" />
        <input id="email" type="email" placeholder="Email" autocomplete="username" aria-label="Email" />
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" />
        <button id="signin" type="submit">Sign in</button>
        <div class="error">${esc(errorMsg || "")}</div>
      </form>
    </div>`;
  document.getElementById('login-form').onsubmit = async e => {
    e.preventDefault();
    const btn = document.getElementById('signin');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    btn.disabled = true;
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error){ renderLogin(error.message); return; }
      currentUser = data.user;
      await continueAfterSignIn();
    } catch(err){ renderLogin(err.message || 'Could not sign in.'); }
  };
}

// Two-step sign-in: if this account has an authenticator app set up, ask for its 6-digit code before showing anything.
async function continueAfterSignIn(){
  let needCode = false;
  try {
    const { data } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    needCode = !!data && data.nextLevel === 'aal2' && data.currentLevel !== 'aal2';
  } catch(e){ needCode = false; }
  if(needCode) renderCodePrompt(); else renderApp();
}

async function renderCodePrompt(errorMsg){
  app.innerHTML = `
    <div class="login-wrap">
      <form class="login-card" id="code-form">
        <img class="logo" src="logo.png" alt="Photo Pronto" />
        <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code" aria-label="6-digit code from your authenticator app" style="text-align:center;letter-spacing:6px;font-family:var(--mono)" />
        <button id="verify" type="submit">Continue</button>
        <div class="error">${esc(errorMsg || '')}</div>
        <button id="code-out" type="button" class="btn-sm" style="margin-top:6px;width:100%">Sign out</button>
      </form>
    </div>`;
  const input = document.getElementById('code'); input.focus();
  document.getElementById('code-out').onclick = async () => { await sb.auth.signOut(); renderLogin(); };
  const submit = async () => {
    const code = input.value.replace(/\D/g, '');
    if(code.length !== 6) return;
    document.getElementById('verify').disabled = true; input.disabled = true;
    try {
      const { data: f, error: fe } = await sb.auth.mfa.listFactors();
      if(fe) throw fe;
      const factor = (f.totp || []).find(x => x.status === 'verified');
      if(!factor) throw new Error('No authenticator is set up on this account.');
      const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: factor.id, code });
      if(error) throw error;
      renderApp();
    } catch(err){ renderCodePrompt(/invalid|expired|code/i.test(err.message || '') ? 'That code did not work. Try the newest one.' : (err.message || 'Could not check the code.')); }
  };
  document.getElementById('code-form').onsubmit = e => { e.preventDefault(); submit(); };
  input.oninput = () => { input.value = input.value.replace(/\D/g, '').slice(0, 6); if(input.value.length === 6) submit(); };
}

async function loadBooths(){
  const { data, error } = await sb
    .from('booths')
    .select('*')
    .order('name');
  if(error){ console.error(error); return []; }
  const ord = b => { const o = b.config && b.config.order; return Number.isFinite(Number(o)) && o !== null ? Number(o) : 1e9; };
  return data.slice().sort((a, b) => ord(a) - ord(b) || String(a.name).localeCompare(String(b.name)));
}

// Text from agents is shown on this page, so always escape it.
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function programList(b){
  return Array.isArray(b.programs) ? b.programs : [];
}

function rollRemaining(b){
  return Math.max(b.roll_capacity - b.prints_since_roll, 0);
}

function needsAttention(b){
  const hrs = b.config && b.config.hours;
  if(hrs && ['auto_close', 'pause_alerts'].includes(hrs.mode) && !inOpeningHours(hrs)) return false;   // not meant to be on right now
  if(!isOnline(b)) return true;
  if(programList(b).some(p => !p.ok)) return true;
  return rollRemaining(b) < b.roll_capacity * 0.15;
}

// ── notifications bell and phone push ──
let notifs = [];
let notifPanelOpen = false;
let pushState = { kind: 'checking' };

async function loadNotifications(){
  const { data, error } = await sb.from('notifications')
    .select('id, booth_id, kind, title, body, severity, created_at, read_at')
    .order('id', { ascending: false }).limit(40);
  if(error){ console.error(error); return notifs; }
  return data;
}

function urlBase64ToUint8Array(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

async function detectPush(){
  if(!CONFIG.VAPID_PUBLIC_KEY){ return { kind: 'off' }; }
  const canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  if(!canPush){
    return isIos && !isStandalone() ? { kind: 'ios-install' } : { kind: 'unsupported' };
  }
  if(Notification.permission === 'denied') return { kind: 'blocked' };
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    let sub = await reg.pushManager.getSubscription();
    if(Notification.permission === 'granted'){
      // Permission is still on but the phone dropped (or the server removed) the
      // subscription: quietly make a new one so the user never has to re-enable.
      if(!sub){
        try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(CONFIG.VAPID_PUBLIC_KEY) }); }
        catch(e){ console.error('resubscribe failed', e); }
      }
      if(sub){
        saveSubscription(sub).catch(console.error);   // always refresh the server's copy
        return { kind: 'on' };
      }
    }
  } catch(e){ console.error(e); return { kind: 'unsupported' }; }
  return { kind: 'ask' };
}

async function saveSubscription(sub){
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push_subscription', {
    p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_label: navigator.userAgent.slice(0, 120)
  });
  if(error) throw new Error(error.message);
}

async function enablePush(){
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ pushState = perm === 'denied' ? { kind: 'blocked' } : { kind: 'ask' }; renderNotifPanel(); return; }
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(CONFIG.VAPID_PUBLIC_KEY) });
    await saveSubscription(sub);
    pushState = { kind: 'on', note: 'Turned on for this device.' };
  } catch(e){
    console.error(e);
    pushState = { kind: 'error', note: e.message || 'Could not turn on notifications.' };
  }
  renderNotifPanel();
}

async function disablePush(){
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub){ await sb.rpc('remove_push_subscription', { p_endpoint: sub.endpoint }); await sub.unsubscribe(); }
    pushState = { kind: 'ask', note: 'Turned off for this device.' };
  } catch(e){ pushState = { kind: 'error', note: e.message }; }
  renderNotifPanel();
}

async function sendTest(){
  const { error } = await sb.rpc('send_test_notification');
  pushState = { kind: 'on', note: error ? error.message : 'Test sent. It should arrive in a few seconds.' };
  renderNotifPanel();
  setTimeout(refreshNotifs, 1500);
}

function pushBlockHtml(){
  const st = pushState, note = st.note ? `<div>${esc(st.note)}</div>` : '';
  switch(st.kind){
    case 'on': return `<div><b>Phone notifications are on</b> for this device.</div>${note}<div class="row"><button data-np="test">Send a test</button><button data-np="off">Turn off</button></div>`;
    case 'ask': return `<div>Get a notification on this device when a booth has a problem.</div>${note}<div class="row"><button class="primary" data-np="on">Turn on notifications</button></div>`;
    case 'ios-install': return `<div><b>On iPhone:</b> tap the Share button, choose <b>Add to Home Screen</b>, then open BoothWatch from your home screen and come back here to turn notifications on.</div>`;
    case 'blocked': return `<div>Notifications are blocked for this site. Allow them in your browser or phone settings, then reload.</div>`;
    case 'unsupported': return `<div>This browser can't receive phone notifications. Alerts still appear in this list.</div>`;
    case 'error': return `<div>${esc(st.note || 'Something went wrong.')}</div><div class="row"><button class="primary" data-np="on">Try again</button></div>`;
    default: return '';
  }
}

function renderBell(){
  const unread = notifs.filter(n => !n.read_at).length;
  const c = document.getElementById('bell-count');
  if(c){ c.hidden = unread === 0; c.textContent = unread > 99 ? '99+' : unread; }
  document.title = (unread ? `(${unread}) ` : '') + 'BoothWatch';
}

function renderNotifPanel(){
  const panel = document.getElementById('notif-panel');
  if(!panel) return;
  const unread = notifs.some(n => !n.read_at);
  const pb = pushBlockHtml();
  const items = notifs.map(n => `
    <div class="np-item ${n.read_at ? '' : 'unread'} ${n.severity === 'info' ? 'info' : ''}" data-notif="${n.id}" data-booth="${esc(n.booth_id || '')}" data-kind="${esc(n.kind || '')}" tabindex="0">
      <span class="np-dot"></span>
      <div style="min-width:0">
        <div class="np-title">${esc(n.title)}</div>
        ${n.body ? `<div class="np-body">${esc(n.body)}</div>` : ''}
        <div class="np-time">${hms(new Date(n.created_at))} · ${esc(fmtAgo(n.created_at))}</div>
      </div>
    </div>`).join('');
  panel.innerHTML = `
    <div class="np-head"><span>Notifications</span>${unread ? '<button data-np="read-all">Mark all read</button>' : ''}</div>

function checkInterval(b){

const pad2 = n => String(n).padStart(2, '0');
const hms = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
function secs(n){
  n = Math.max(0, Math.round(n));
  if(n < 60) return n + 's';
  if(n < 3600) return Math.floor(n/60) + 'm ' + pad2(n % 60) + 's';
  if(n < 86400) return Math.floor(n/3600) + 'h ' + pad2(Math.floor(n % 3600 / 60)) + 'm';
  return Math.floor(n/86400) + 'd ' + Math.floor(n % 86400 / 3600) + 'h';
}
let fleetBeats = [];   // [{t, iv}] of every booth, refreshed with the data
const isMobile = () => window.matchMedia('(max-width: 700px)').matches;

function tick(){
  const now = new Date();
  const t = document.getElementById('clock-time');
  if(t){
    t.textContent = hms(now);
    const sec = now.getSeconds() + now.getMilliseconds()/1000, min = now.getMinutes() + sec/60, hr = (now.getHours() % 12) + min/60;
    const set = (id, deg) => { const el = document.getElementById(id); if(el) el.setAttribute('transform', `rotate(${deg} 24 24)`); };
    set('hand-h', hr * 30); set('hand-m', min * 6); set('hand-s', Math.floor(now.getSeconds()) * 6);
  }

  const nowMs = now.getTime();
  const nextText = (lastMs, iv, online) => {
    if(!online) return 'waiting for booth';
    const left = (lastMs + iv*1000 - nowMs) / 1000;
    return left > 0 ? 'in ' + secs(left) : 'due now';
  };
  document.querySelectorAll('[data-hb]').forEach(el => {
    if(!el.dataset.hb){ el.textContent = 'No check-in yet'; return; }
    const last = new Date(el.dataset.hb), iv = Number(el.dataset.iv) || 60;
    el.innerHTML = '';
    for(const line of [`Last ${hms(last)} (${secs((nowMs - last)/1000)} ago)`, `Next ${nextText(last.getTime(), iv, el.dataset.online === '1')}`]){
      const d = document.createElement('div'); d.textContent = line; el.appendChild(d);
    }
  });
  const lastEl = document.getElementById('fleet-last'), nextEl = document.getElementById('fleet-next');
  if(lastEl && nextEl){
    if(!fleetBeats.length){ lastEl.textContent = '—'; nextEl.textContent = '—'; return; }
    const latest = Math.max(...fleetBeats.map(x => x.t));
    lastEl.textContent = `${hms(new Date(latest))} (${secs((nowMs - latest)/1000)} ago)`;
    const live = fleetBeats.filter(x => nowMs - x.t < 3*60*1000);
    const dues = live.map(x => x.t + x.iv*1000).filter(d => d > nowMs);
    nextEl.textContent = !live.length ? '—' : (dues.length ? 'in ' + secs((Math.min(...dues) - nowMs)/1000) : 'due now');
  }
}
// ── opening hours (mirror of the database's booth_in_hours) ──
const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const toMin = t => { const [h, m] = String(t).split(':'); return (+h) * 60 + (+m || 0); };
function parseStamp(s){ return new Date(String(s).trim().replace(' ', 'T').replace(/([+-]\d\d)$/, '$1:00')); }

function inOpeningHours(hours, d = new Date()){
  if(!hours || !['auto_close', 'pause_alerts'].includes(hours.mode)) return true;
  try { if(hours.open_until && parseStamp(hours.open_until) > d) return true; } catch(e){}
  const dow = (d.getDay() + 6) % 7, t = d.getHours() * 60 + d.getMinutes();
  const win = i => { const x = hours.days && hours.days[DAY_KEYS[(i + 7) % 7]]; return Array.isArray(x) && x.length === 2 ? [toMin(x[0]), toMin(x[1])] : null; };
  const today = win(dow);
  if(today){ const [o, c] = today; if(c > o){ if(t >= o && t < c) return true; } else if(t >= o) return true; }
  const prev = win(dow - 1);
  if(prev){ const [o, c] = prev; if(c <= o && t < c) return true; }
  return false;
}

// "Open until 18:00" / "Opens Tue 09:00", or null when the booth has no opening hours.
function hoursSummary(hours, now = new Date()){
  if(!hours || !['auto_close', 'pause_alerts'].includes(hours.mode)) return null;
  const open = inOpeningHours(hours, now);
  const base = Math.ceil(now.getTime() / 900000) * 900000;
  for(let i = 0; i <= 8 * 96; i++){
    const t = new Date(base + i * 900000);
    if(inOpeningHours(hours, t) !== open){
      const sameDay = t.toDateString() === now.toDateString();
      const label = (sameDay ? '' : t.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ') + t.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      return { open, at: t, text: (open ? 'Open until ' : 'Opens ') + label };
    }
  }
  return { open, at: null, text: open ? 'Open' : 'Closed' };
}

const OUTAGE_CAUSES = {
  power_loss: 'Power cut or hard switch-off', crash: 'The PC crashed', shutdown: 'The PC was shut down', restart: 'The PC restarted',
  windows_update: 'Windows restarted for an update', sleep: 'The PC went to sleep', agent_stopped: 'The BoothWatch agent was not running (the PC stayed on)',
  network: 'Lost its internet connection', unknown: 'Reason unknown',
};
function outageCause(o){
  const d = o.detail || {};
  let t = OUTAGE_CAUSES[o.cause] || OUTAGE_CAUSES.unknown;
  if(o.cause === 'network'){
    const k = { no_internet: 'the PC could not reach the internet', dns: 'the internet worked but names would not resolve', service_unreachable: 'the internet worked but BoothWatch could not be reached', intermittent: 'on and off' }[d.kind];
    if(k) t += ' (' + k + ')';
  } else if(o.cause === 'crash' && d.bugcheck){ t += ' (stop code ' + esc(d.bugcheck) + ')'; }
  return t;
}
function fmtDuration(mins){ mins = Math.max(1, Math.round(mins)); return mins >= 120 ? Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min' : mins + ' min'; }
function outageRows(list){
  if(!list || !list.length) return '';
  const rows = list.map(o => {
    const a = new Date(o.started_at), b = new Date(o.ended_at), mins = (b - a) / 60000;
    const day = a.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    const hm = d => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    return `<div class="outage"><b>${esc(day)} · ${hm(a)}–${hm(b)} · ${fmtDuration(mins)}</b><span>${outageCause(o)}</span></div>`;
  }).join('');
  return `<div class="outages"><div class="outages-h">Unplanned offline periods <em>last 30 days</em></div>${rows}</div>`;
}
async function loadOutages(ids){
  if(!ids.length) return {};

    const { data, error } = await sb.from('booth_outages').select('booth_id, started_at, ended_at, cause, detail').in('booth_id', ids).gte('started_at', since).order('started_at', { ascending: false }).limit(200);

let periodCache = null;
async function loadPeriodStats(booths){
  const [yf] = periodRange('year');
  const since = addDays(yf, -8);
  if(!periodCache || Date.now() - periodCache.at > 25000 || periodCache.since > since){
    try { periodCache = { at: Date.now(), since, rows: await loadStatsRows(since) }; }
    catch(e){ console.error(e); if(!periodCache) return {}; }
  }
  const out = {};
  for(const b of booths){
    out[b.id] = {};
    for(const k of ['today', 'yesterday', 'week', 'month', 'year']){
      out[b.id][k] = computeRange(periodCache.rows, [b], periodRange(k), 'day', []).per[b.id];
    }
  }

}

function boothParts(b){
  const online = isOnline(b);
  const programs = programList(b);
  const badPrograms = programs.filter(p => !p.ok);
  const remaining = rollRemaining(b);
  const pct = Math.max(0, Math.min(100, 100 * remaining / b.roll_capacity));
  const rollState = remaining === 0 ? 'alert' : (remaining < b.roll_capacity * 0.15 ? 'warn' : 'ok');
  const cfg = b.config || {};
  const st = (b.status && typeof b.status === 'object') ? b.status : {};
  const manualClosed = !!cfg.closed;
  const schedClosed = !manualClosed && !!st.closed_scheduled;
  const isClosed = manualClosed || schedClosed;
  const hrs = hoursSummary(cfg.hours);

  let overallDot = 'ok', overallLabel = 'Online';
  if(!online){ overallDot = 'alert'; overallLabel = 'Offline'; }
  else if(badPrograms.length){
    overallDot = 'alert';
    const badSoftware = badPrograms.filter(p => !p.device), badDevices = badPrograms.filter(p => p.device);
    overallLabel = badSoftware.length
      ? (badSoftware.some(p => !p.running) ? 'Software not running' : 'Software needs attention')
      : (badDevices.length === 1 ? badDevices[0].name + ' problem' : 'Hardware problem');
  }
  else if(rollState !== 'ok'){ overallDot = 'warn'; overallLabel = rollState === 'alert' ? 'Out of prints' : 'Low on prints'; }

  const detailRows = p => (p.details && typeof p.details === 'object')
    ? Object.entries(p.details).map(([k, v]) => `<div class="detail"><b>${esc(k)}</b>${esc(v)}</div>`).join('')
    : '';
  const screenState = p => p.minimized ? 'Minimised' : (p.fullscreen === true ? 'Full screen' : (p.fullscreen === false ? 'Windowed' : ''));
  const cmd = b.lastCommand;
  const busy = !!cmd && (cmd.status === 'pending' || cmd.status === 'running');

  // Compact status chips, always visible
  const chips = programs.map(p => `<span class="chip ${p.ok ? '' : 'bad'} ${online ? '' : 'stale'}"><i class="dot ${p.ok ? 'ok' : 'alert'}"></i>${esc(p.name)}${p.screen ? `<em>${esc(p.screen)}</em>` : ''}</span>`).join('');
  const firstBad = badPrograms[0];
  const badLine = online && firstBad ? `<div class="bad-line">${esc(firstBad.name)}: ${esc(firstBad.note || 'Problem')}${badPrograms.length > 1 ? ` (+${badPrograms.length - 1} more)` : ''}</div>` : '';

  // Full detail, behind "Details"
  const programRows = programs.map(p => `
        <div class="program ${online ? '' : 'stale'}">
          <span class="dot ${p.ok ? 'ok' : 'alert'}"></span>
          <span class="program-main">
            <span class="program-head"><span>${esc(p.name)}</span><span class="state">${esc(screenState(p))}</span></span>
            ${p.screen ? `<div class="detail screen"><b>Screen</b>${esc(p.screen)}</div>` : ''}
            ${p.title ? `<div class="title" title="${esc(p.title)}">${esc(p.title)}</div>` : ''}
            ${detailRows(p)}
            ${p.ok ? (p.note ? `<div class="detail"><b>Status</b>${esc(p.note)}</div>` : '') : `<span class="note">${esc(p.note || 'Problem')}</span>`}
            ${p.device ? '' : `<button class="prog-btn" data-restart-prog="${esc(p.name)}" data-booth="${esc(b.id)}" ${busy || !online ? 'disabled' : ''}>Restart</button>`}
          </span>
        </div>`).join('');

  const waiting = waitingShots.has(b.id);
  const cmdNames = { restart_pc: 'Restart PC', restart_program: c => 'Restart ' + ((c.args && c.args.program) || 'program'), read_paper: 'Read paper left' };
  let cmdLine = '';
  if(cmd){
    const label = typeof cmdNames[cmd.kind] === 'function' ? cmdNames[cmd.kind](cmd) : (cmdNames[cmd.kind] || cmd.kind);
    const word = { pending: 'waiting for the booth to pick it up…', running: 'in progress…', done: 'done', failed: 'failed', expired: 'expired (booth did not pick it up)' }[cmd.status] || cmd.status;
    cmdLine = `<div class="cmd-line ${cmd.status === 'failed' || cmd.status === 'expired' ? 'bad' : ''}">${esc(label)}: ${esc(word)} · ${esc(fmtAgo(cmd.completed_at || cmd.created_at))}${cmd.result ? '<br>' + esc(cmd.result) : ''}</div>`;
  }
  let warns = '';
  if(isClosed && online && st.closed_shown === false) warns += `<div class="warn-line">The closed screen is not showing yet${st.closed_error ? ': ' + esc(st.closed_error) : '.'}</div>`;
  if(online && st.folder_found === false) warns += `<div class="warn-line">Session counting: today's photo folder was not found on the booth (normal until the first session of the day).</div>`;
  if(online && !isClosed && st.counter_seen === false) warns += `<div class="warn-line">Print counter not readable from the booth software right now.</div>`;

  const freeBadge = (cfg.money && cfg.money.free === true) ? '<span class="tag acc" title="Free to use: sessions are counted, no sales">Free</span>' : '';
  const buildBadge = freeBadge + (cfg.stage === 'build' ? '<span class="tag acc" title="Left out of the Company figures">Build</span>' : '');
  const badge = buildBadge + (manualClosed ? '<span class="tag">Closed</span>'
    : schedClosed ? '<span class="tag">Closed by hours</span>'
    : (hrs && !hrs.open ? '<span class="tag">Outside hours</span>' : ''));
  const modeText = { none: '', pause_alerts: 'alerts pause outside hours', auto_close: 'closes itself outside hours' }[(cfg.hours && cfg.hours.mode) || 'none'];
  const paperLine = b.paper_left != null ? `<div class="agent-info">Last time you asked, the printer said ${b.paper_left} pages left (${esc(fmtAgo(b.paper_left_at))}). The count above ticks down from there.</div>` : '';
  const hoursLine = hrs ? `<div class="agent-info">${esc(hrs.text)} · ${esc(modeText)}</div>` : '';

  // One button that does the right thing for the booth's state
  let closeBtn;
  if(manualClosed) closeBtn = `<button data-closed="${esc(b.id)}" ${online ? '' : 'disabled'}>Reopen booth</button>`;
  else if(schedClosed) closeBtn = `<button data-open-now="${esc(b.id)}" ${online ? '' : 'disabled'}>Open now…</button>`;
  else closeBtn = `<button data-closed="${esc(b.id)}" ${online ? '' : 'disabled'}>Close booth…</button>`;

  return { online, programs, badPrograms, remaining, pct, rollState, cfg, st, manualClosed, schedClosed, isClosed, overallDot, overallLabel, chips, badLine, programRows, cmdLine, warns, badge, paperLine, hoursLine, closeBtn, busy, waiting, hrs };
}

// ── screenshots ──
const waitingShots = new Set();
const sleep = ms => new Promise(r => setTimeout(r, ms));

function showShot(data){
  const old = document.getElementById('shot-overlay');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'shot-overlay';
  el.id = 'shot-overlay';
  const taken = new Date(data.taken_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  el.innerHTML = `
    <img alt="Booth screen" src="data:image/jpeg;base64,${data.image_base64}" />
    <div class="shot-meta">${esc(data.booth_name)}, taken at ${esc(taken)}</div>
    <button class="shot-close">Close</button>`;
  el.onclick = e => { if(e.target === el || e.target.classList.contains('shot-close')) el.remove(); };
  document.body.appendChild(el);
}

async function requestScreenshot(booth, refresh){
  waitingShots.add(booth.id);
  refresh();
  try{
    const { data: before } = await sb.from('booth_screenshots').select('taken_at').eq('booth_id', booth.id).maybeSingle();
    const prevTaken = before ? before.taken_at : null;
    const { error } = await sb.rpc('request_screenshot', { p_booth_id: booth.id });
    if(error){ alert(error.message); return; }

    const deadline = Date.now() + 60000;
    while(Date.now() < deadline){
      await sleep(3000);
      const { data } = await sb.from('booth_screenshots').select('taken_at, image_base64').eq('booth_id', booth.id).maybeSingle();
      if(data && data.taken_at !== prevTaken){
        showShot({ ...data, booth_name: booth.name });
        return;
      }
    }
    alert('No screenshot arrived. The booth may be offline, or the agent may need updating.');
  } finally {
    waitingShots.delete(booth.id);
    refresh();
  }
}

function relDate(iso){

async function refreshReleases(){
  const el = document.getElementById('rel-status');

function wireReleases(){
  const file = document.getElementById('rel-file');

    if(!f){ alert('Choose agent.py first.'); return; }
    const code = await f.text();
    const m = code.match(/^VERSION\s*=\s*"([^"]+)"/m);
    if(!m){ alert('This does not look like agent.py (no VERSION line found).'); return; }
    if(!confirm(`Publish agent ${m[1]} to the TEST channel? Booths set to "test" will update within a few minutes.`)) return;
    const { error } = await sb.rpc('publish_agent', { p_channel: 'test', p_version: m[1], p_code: code });

async function loadTodayCounts(boothIds){
  if(boothIds.length === 0) return {};
  const today = new Date().toLocaleDateString('en-CA');   // YYYY-MM-DD in this computer's time zone
  const { data, error } = await sb
    .from('daily_stats')
    .select('booth_id, sessions, prints')
    .in('booth_id', boothIds)
    .eq('day', today);
  if(error){ console.error(error); return {}; }
  const out = {};
  for(const row of data){
    out[row.booth_id] = { prints_today: row.prints, sessions_today: row.sessions };
  }
  return out;
}

async function loadLastCommands(boothIds){
  if(boothIds.length === 0) return {};
  const { data, error } = await sb
    .from('booth_commands')
    .select('id, booth_id, kind, args, status, result, created_at, completed_at')
    .in('booth_id', boothIds)
    .order('id', { ascending: false })
    .limit(60);
  if(error){ console.error(error); return {}; }
  const out = {};
  for(const row of data){ if(!out[row.booth_id]) out[row.booth_id] = row; }
  return out;
}

function routeFromHash(){

// sliding highlight behind the active tab, and a header that stays put while scrolling
function placeTabInd(animate){
  const nav = document.querySelector('.tabs'), ind = nav && nav.querySelector('.tab-ind'), on = nav && nav.querySelector('a.on');
  if(!ind || !on) return;
  if(!animate || !ind.dataset.ready) ind.style.transition = 'none';
  ind.style.width = on.offsetWidth + 'px'; ind.style.height = on.offsetHeight + 'px';
  ind.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`;
  if(!ind.dataset.ready){ ind.dataset.ready = '1'; void ind.offsetWidth; }
  requestAnimationFrame(() => { ind.style.transition = ''; });
}
function fitHeader(){
  const h = document.querySelector('header'), t = document.querySelector('.tabs');

}

let swipeDir = 0;
(() => {
  let x0 = 0, y0 = 0, t0 = 0, ok = false;
  const blocked = el => !!(el && el.closest && el.closest('.seg, .tbl-wrap, .chart-box, input, select, textarea, .notif-panel, .shot-overlay, .stabs, [data-noswipe]'));
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    ok = e.touches.length === 1 && isMobile() && !!document.querySelector('.tabs') && t.clientX > 24 && t.clientX < window.innerWidth - 24 && !blocked(e.target);
    x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if(!ok) return; ok = false;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6 || Date.now() - t0 > 700) return;
    const i = PAGES.indexOf(view), n = i + (dx < 0 ? 1 : -1);  // booth pages are not in PAGES, so no swiping there
    if(i < 0 || n < 0 || n >= PAGES.length) return;
    swipeDir = dx < 0 ? 1 : -1;
    location.hash = '#/' + PAGES[n];
  }, { passive: true });
})();

function showPage(p){

  placeTabInd(true);
  const v = document.getElementById('view');
  if(v){ v.classList.remove('enter', 'from-r', 'from-l'); void v.offsetWidth; v.classList.add('enter'); if(swipeDir) v.classList.add(swipeDir > 0 ? 'from-r' : 'from-l'); swipeDir = 0; clearTimeout(window._enterT); window._enterT = setTimeout(() => v.classList.remove('enter', 'from-r', 'from-l'), 900); }

async function refreshBooths(){
  if(view !== 'booths') return;
  let booths = await loadBooths();
  if(view !== 'booths') return;
  boothCache = booths;
  const ids = booths.map(b => b.id);
  const [periods, lastCmds, outageMap] = await Promise.all([loadPeriodStats(booths), loadLastCommands(ids), loadOutages(ids)]);
  if(view !== 'booths') return;
  booths = booths.map(b => ({ ...b, periods: periods[b.id] || null, outages: outageMap[b.id] || [], lastCommand: lastCmds[b.id] || null }));

  const onlineCount = booths.filter(isOnline).length;
  const attentionCount = booths.filter(needsAttention).length;
  if(reorderMode && orderDraft.length){ const pos = id => { const i = orderDraft.indexOf(id); return i < 0 ? 1e6 : i; }; booths = booths.slice().sort((a, b) => pos(a.id) - pos(b.id)); }
  else orderDraft = booths.map(b => b.id);
  const isFree = b => !!(b.config && b.config.money && b.config.money.free === true);
  const counted = booths.filter(b => !(b.config && b.config.stage === 'build'));
  const todayOf = b => (b.periods && b.periods.today) || { sessions: 0, prints: 0, sales: 0 };
  const salesToday = counted.reduce((s,b) => s + todayOf(b).sales, 0);
  const freeLeftOut = countKind === 'sessions' && counted.some(isFree);
  const countToday = counted.reduce((s,b) => s + ((countKind === 'sessions' && isFree(b)) ? 0 : todayOf(b)[countKind]), 0);

  document.getElementById('summary').innerHTML = `
    <div class="tile hero"><div class="tile-label">Online</div><div class="tile-num">${onlineCount}/${booths.length}</div><div class="tile-sub">booths checking in</div></div>
    <div class="tile ${attentionCount ? 'dark' : ''}"><div class="tile-label">Need attention</div><div class="tile-num">${attentionCount}</div><div class="tile-sub">${attentionCount ? 'open the cards below' : 'all clear'}</div></div>
    <div class="tile"><div class="tile-label">Sales today</div><div class="tile-num">${money0(salesToday)}</div><div class="tile-sub">live booths</div></div>
    <div class="tile tile-toggle" data-count-toggle role="button" tabindex="0" title="Tap to switch between sessions and prints"><div class="tile-label">${countKind === 'prints' ? 'Prints' : 'Sessions'} today</div><div class="tile-num">${countToday}</div><div class="tile-sub">${freeLeftOut ? 'paid booths' : 'live booths'} · tap for ${countKind === 'prints' ? 'sessions' : 'prints'}</div></div>`;
  document.querySelectorAll('#summary [data-count-toggle]').forEach(el => { el.onclick = toggleCountKind; el.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleCountKind(); } }; });

  fleetBeats = booths.filter(b => b.last_heartbeat_at).map(b => ({ t: new Date(b.last_heartbeat_at).getTime(), iv: checkInterval(b) }));
  const framesEl = document.getElementById('frames');
  // Cards sit in independent columns (1st, 2nd, 3rd across, then the 4th under the 1st...), so opening one
  // card only moves the cards beneath it, never the ones in the next column.
  const colCount = booths.length ? Math.max(1, Math.min(booths.length, Math.floor((framesEl.clientWidth + 14) / (380 + 14)))) : 1;
  framesEl.classList.toggle('cols', colCount > 1);
  const bar = document.getElementById('reorder-bar');
  if(bar){
    bar.hidden = booths.length < 2;
    const barHtml = reorderMode ? `<span class="help">Use the arrows to move booths, then press Done.</span><button type="button" class="btn-primary" id="reorder-done">Done</button><button type="button" class="btn-sm" id="reorder-cancel">Cancel</button>` : `<button type="button" class="btn-sm" id="reorder-btn">Reorder booths</button>`;
    if(bar.dataset.html !== barHtml){ bar.dataset.html = barHtml; bar.innerHTML = barHtml; wireReorder(bar); }
  }
  const cards = booths.map((b, i) => boothFrame(b, i, booths.length));
  const html = booths.length
    ? (colCount > 1
        ? Array.from({ length: colCount }, (_, c) => `<div class="frame-col">${cards.filter((_, i) => i % colCount === c).join('')}</div>`).join('')

  if(html !== lastFramesHtml){

    wireBoothCards(framesEl, booths);
  }
  tick();
  if(pendingFocus){ const id = pendingFocus; pendingFocus = null; showBooth(id); }

async function loadBoothStats(id){
  let all = [], from = 0;
  for(;;){
    const { data, error } = await sb.from('daily_stats').select('booth_id, day, sessions, prints').eq('booth_id', id).order('day').range(from, from + 999);
    if(error) throw error;
    all = all.concat(data);
    if(data.length < 1000) break;
    from += 1000;
  }
  return all;
}
async function loadSessionTimes(id){
  const since = new Date(Date.now() - 90 * 86400000).toISOString();
  let all = [], from = 0;
  try {
    for(;;){
      const { data, error } = await sb.from('booth_events').select('at').eq('booth_id', id).eq('kind', 'session').gte('at', since).order('at').range(from, from + 999);
      if(error) return all;
      all = all.concat(data.map(r => r.at));
      if(data.length < 1000 || from > 20000) break;
      from += 1000;
    }
  } catch(e){}
  return all;
}
async function loadBoothHistory(id){
  const safe = async q => { try { const r = await q; return r.error ? [] : (r.data || []); } catch(e){ return []; } };
  const [alerts, outages, commands, reports, events] = await Promise.all([
    safe(sb.from('alerts').select('*').eq('booth_id', id).order('created_at', { ascending: false }).limit(200)),
    safe(sb.from('booth_outages').select('*').eq('booth_id', id).order('started_at', { ascending: false }).limit(100)),
    safe(sb.from('booth_commands').select('id, kind, args, status, result, created_at, completed_at').eq('booth_id', id).order('id', { ascending: false }).limit(100)),
    safe(sb.from('support_reports').select('id, created_at, issue, status, outcome').eq('booth_id', id).order('created_at', { ascending: false }).limit(50)),
    safe(sb.from('booth_events').select('at, kind, n, detail').eq('booth_id', id).order('at', { ascending: false }).limit(800)),
  ]);
  return { alerts, outages, commands, reports, events };
}

      (bpData && bpData.sess && Date.now() - bpData.sessAt < 60000) ? Promise.resolve(bpData.sess) : loadSessionTimes(id),
    ]);

const fmt1 = n => String(Math.round(n * 10) / 10);
const fmtInt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
function bpNumbers(b, rows){
  const today = ymd(new Date());
  const first = rows.length ? rows.reduce((m, r) => r.day < m ? r.day : m, rows[0].day) : today;
  const per = r => computeRange(rows, [b], r, 'day', []).per[b.id];
  const table = [['today', 'Today'], ['yesterday', 'Yesterday'], ['week', 'This week'], ['lastweek', 'Last week'], ['month', 'This month'], ['lastmonth', 'Last month'], ['year', 'This year']]
    .map(([k, n]) => ({ label: n, ...per(periodRange(k)) }));
  table.push({ label: 'All time', ...per([first, today]) });
  const byDay = new Map(rows.map(r => [r.day, r]));
  const window_ = (from, to) => {
    const f = from < first ? first : from, days = Math.max(1, spanDays(f, to));
    const t = per([f, to]);
    let trading = 0;
    for(let d = f; d <= to; d = addDays(d, 1)){ const r = byDay.get(d); if(r && r.sessions > 0) trading++; }
    return { days, sessions: t.sessions, prints: t.prints, sales: t.sales, trading };
  };
  const wins = [['Last 30 days', window_(addDays(today, -29), today)], ['Last 90 days', window_(addDays(today, -89), today)], ['This year', window_(periodRange('year')[0], today)], ['All time', window_(first, today)]];
  // average sessions for each weekday over the last 90 days
  const wd = Array.from({ length: 7 }, () => ({ s: 0, n: 0, sales: 0 }));
  const price = (b.config && b.config.money && b.config.money.free !== true && Number(b.config.money.price)) || 0;
  const from90 = addDays(today, -89);
  for(let d = from90 < first ? first : from90; d <= today; d = addDays(d, 1)){
    const i = (fromYmd(d).getDay() + 6) % 7, r = byDay.get(d);
    wd[i].n++; wd[i].s += r ? r.sessions : 0; wd[i].sales += (r ? r.sessions : 0) * price;
  }
  // best day
  let best = null;
  for(const r of rows){ if(!best || r.sessions > best.sessions) best = r; }
  return { table, wins, wd, best, first };
}

const fmtDT = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const CMD_NAMES = { restart_pc: 'Restart PC', restart_program: c => 'Restart ' + ((c.args && c.args.program) || 'program'), read_paper: 'Read paper now' };
function bpLogEntries(){
  const { b, history } = bpData, h = history || { alerts: [], outages: [], commands: [], reports: [], events: [] }, out = [];
  for(const a of h.alerts){
    const msg = a.message || a.title || a.kind;
    out.push({ t: new Date(a.created_at), type: 'alert', title: msg, detail: 'Alert raised', tone: 'bad' });
    if(a.resolved_at) out.push({ t: new Date(a.resolved_at), type: 'alert', title: msg, detail: 'Alert cleared · lasted ' + fmtDuration((new Date(a.resolved_at) - new Date(a.created_at)) / 60000), tone: 'ok' });
  }
  for(const o of h.outages){
    out.push({ t: new Date(o.ended_at), type: 'outage', title: 'Back online after ' + fmtDuration((new Date(o.ended_at) - new Date(o.started_at)) / 60000), detail: outageCause(o) + ' · offline from ' + fmtDT(new Date(o.started_at)), tone: 'bad' });
  }
  for(const c of h.commands){
    const label = typeof CMD_NAMES[c.kind] === 'function' ? CMD_NAMES[c.kind](c) : (CMD_NAMES[c.kind] || c.kind);
    const word = { pending: 'waiting for the booth', running: 'in progress', done: 'done', failed: 'failed', expired: 'expired (booth did not pick it up)' }[c.status] || c.status;
    out.push({ t: new Date(c.completed_at || c.created_at), type: 'button', title: label + ': ' + word, detail: (c.result || '') + (c.completed_at ? ' · requested ' + fmtDT(new Date(c.created_at)) : ''), tone: (c.status === 'failed' || c.status === 'expired') ? 'bad' : '' });
  }
  for(const r of h.reports){
    out.push({ t: new Date(r.created_at), type: 'support', title: 'Customer report: ' + r.issue, detail: r.status === 'resolved' ? 'Done' : (r.status === 'contacted' ? 'Customer contacted' : 'New'), tone: '' });
  }
  for(const e of (h.events || [])){
    const d = e.detail || {}, t = new Date(e.at);
    if(e.kind === 'session') out.push({ t, type: 'session', title: 'Session', detail: '', tone: '' });
    else if(e.kind === 'print') out.push({ t, type: 'session', title: e.n + ' print' + (e.n === 1 ? '' : 's'), detail: '', tone: '' });
    else if(e.kind === 'software' || e.kind === 'device') out.push({ t, type: 'pc', title: (d.name || e.kind) + (d.ok ? ' back to normal' : ' problem'), detail: d.note || '', tone: d.ok ? 'ok' : 'bad' });
    else if(e.kind === 'pc_boot') out.push({ t, type: 'pc', title: 'PC started', detail: '', tone: '' });
    else if(e.kind === 'agent_start') out.push({ t, type: 'pc', title: 'BoothWatch agent started', detail: d.version ? 'Version ' + d.version : '', tone: '' });
    else if(e.kind === 'agent_update') out.push({ t, type: 'pc', title: 'BoothWatch agent updated', detail: (d.from ? d.from + ' to ' : '') + (d.version || ''), tone: '' });
    else if(e.kind === 'closed') out.push({ t, type: 'pc', title: 'Booth closed', detail: 'Closed screen on', tone: '' });
    else if(e.kind === 'opened') out.push({ t, type: 'pc', title: 'Booth opened', detail: '', tone: '' });
  }
  if(b.created_at) out.push({ t: new Date(b.created_at), type: 'system', title: 'Booth added to BoothWatch', detail: '', tone: '' });
  return out.sort((x, y) => y.t - x.t);
}
const LOG_TYPES = [['all', 'Everything'], ['session', 'Sessions and prints'], ['pc', 'Software and PC'], ['alert', 'Alerts'], ['outage', 'Offline periods'], ['button', 'Button presses'], ['support', 'Customer reports']];
let bpLogMax = 250;
function bpLogsHtml(){
  const { b, history } = bpData, h = history || { alerts: [], outages: [] };
  const now = Date.now(), since = now - 30 * 86400000;
  const offAlerts = h.alerts.filter(a => a.kind === 'offline' && (new Date(a.resolved_at || now)) > since);
  const offMins = offAlerts.reduce((s, a) => s + (new Date(a.resolved_at || now) - Math.max(new Date(a.created_at), since)) / 60000, 0);
  const outs = h.outages.filter(o => new Date(o.started_at) > since);
  const outMins = outs.reduce((s, o) => s + (new Date(o.ended_at) - new Date(o.started_at)) / 60000, 0);
  const openCount = h.alerts.filter(a => !a.resolved_at).length;
  const ev = h.events || [], lastOf = k => { const e = ev.find(x => x.kind === k); return e ? e.at : null; };
  const lastSess = lastOf('session'), lastPrint = lastOf('print'), boot = lastOf('pc_boot');
  const startMs = Math.max(since, b.created_at ? new Date(b.created_at).getTime() : since), periodMin = Math.max(60, (now - startMs) / 60000);
  const downMin = outs.reduce((s2, o) => s2 + (o.open_minutes != null ? o.open_minutes : (new Date(o.ended_at) - new Date(o.started_at)) / 60000), 0);
  const uptimePct = h.outages.length || ev.length ? Math.max(0, 100 - 100 * downMin / periodMin) : null;
  const fact = (k, v) => `<div class="fact"><span>${k}</span><b>${v}</b></div>`;
  const all = bpLogEntries(), list = bpFilter === 'all' ? all : all.filter(e => e.type === bpFilter);
  const rows = list.slice(0, bpLogMax).map(e => `<div class="log ${e.tone}"><div class="log-t">${esc(fmtDT(e.t))}</div><div class="log-b"><b>${esc(e.title)}</b>${e.detail ? `<span>${esc(e.detail)}</span>` : ''}</div><span class="log-tag">${esc((LOG_TYPES.find(x => x[0] === e.type) || [0, e.type])[1])}</span></div>`).join('');
  return `
    <section class="panel">
      <h2>Health</h2>
      <div class="facts">
        ${fact('Last check-in', b.last_heartbeat_at ? esc(fmtAgo(b.last_heartbeat_at)) : 'never')}
        ${fact('Last session', lastSess ? esc(fmtDT(new Date(lastSess))) + ' · ' + esc(fmtAgo(lastSess)) : 'not recorded yet')}
        ${fact('Last print', lastPrint ? esc(fmtDT(new Date(lastPrint))) + ' · ' + esc(fmtAgo(lastPrint)) : 'not recorded yet')}
        ${fact('PC last started', boot ? esc(fmtDT(new Date(boot))) + ' · ' + esc(fmtAgo(boot)) : 'not recorded yet')}
        ${fact('Uptime, 30 days', uptimePct != null ? (Math.round(uptimePct * 10) / 10) + '%' : 'not enough data yet')}
        ${fact('Checks in every', checkInterval(b) + ' s')}
        ${fact('Offline alerts, 30 days', offAlerts.length ? `${offAlerts.length} · ${esc(fmtDuration(offMins))}` : 'none')}
        ${fact('Unplanned outages, 30 days', outs.length ? `${outs.length} · ${esc(fmtDuration(outMins))}` : 'none logged')}
        ${fact('Open alerts now', openCount)}
        ${fact('Agent', (b.agent_version ? esc(b.agent_version) : 'unknown') + ' · ' + esc(b.channel || 'live'))}
        ${fact('Added', b.created_at ? esc(new Date(b.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })) : '–')}
        ${fact('Paper reading', b.paper_left != null ? `${b.paper_left} pages · ${esc(fmtAgo(b.paper_left_at))}` : 'not read yet')}
      </div>
      <p class="help" style="margin:10px 0 0">Uptime is the share of the last 30 days without an unplanned outage (planned closures and time outside opening hours do not count against it). Offline alerts follow your alert delay and opening hours. Unplanned outages are logged by the booth when it comes back and say why (power, Windows restart, network and so on); planned closures are left out.</p>
    </section>
    <section class="panel">
      <div class="chart-head"><h2>Log</h2><div class="seg" role="group" aria-label="Filter the log">${LOG_TYPES.map(([k, n]) => `<button type="button" data-log-f="${k}" class="${bpFilter === k ? 'on' : ''}">${n}</button>`).join('')}</div></div>
      <div class="logs">${rows || '<div class="no-data">Nothing logged yet.</div>'}</div>
      ${list.length > bpLogMax ? `<div class="save-row"><button type="button" class="btn-sm" id="bp-more-log">Show more (${list.length - bpLogMax} older)</button></div>` : ''}
    </section>`;
}
function wireBpLogs(host){
  host.querySelectorAll('[data-log-f]').forEach(btn => btn.onclick = () => { bpFilter = btn.dataset.logF; bpLogMax = 250; bpHtml = {}; drawBoothBody(); });
  const mo = host.querySelector('#bp-more-log'); if(mo) mo.onclick = () => { bpLogMax += 250; bpHtml = {}; drawBoothBody(); };
}

  const $ = id => host.querySelector('#' + id);

  $('bs-copy-mon').onclick = () => {

    const hm = radios().find(x => x.checked).value, dd = {};

      dd[k] = open ? [from, to] : null;
    }
    if(hm !== 'none' && !Object.values(dd).some(Boolean)) throw new Error('Tick at least one open day, or choose "Always on".');
    await patchCfg({ hours: { mode: hm, days: dd } });
  });
}

function cfgAlert(cfg, kind){
  const a = (cfg.alerts && cfg.alerts[kind]) || {};

    on: typeof a.on === 'boolean' ? a.on : true,
    delay: Number.isFinite(Number(a.delay)) && a.delay != null ? Number(a.delay) : ALERT_DEFAULTS[kind],
    threshold: Number.isFinite(Number(a.threshold)) && a.threshold != null ? Number(a.threshold) : ALERT_DEFAULTS.low_prints,

}

// Two-step sign-in settings: turn on (scan a QR code, confirm one code) or turn off.
async function draw2fa(note){
  const box = document.getElementById('tfa-body'); if(!box) return;
  const say = (html) => { if(document.getElementById('tfa-body') === box) box.innerHTML = html; };
  let factors = [];
  try { const { data, error } = await sb.auth.mfa.listFactors(); if(error) throw error; factors = data.totp || []; }
  catch(e){ say(`<div class="help">Two-step sign-in is not available right now: ${esc(e.message || 'could not check')}. In Supabase, check Authentication, Multi-Factor, that authenticator apps (TOTP) are enabled.</div>`); return; }
  const verified = factors.find(f => f.status === 'verified');
  if(verified){
    say(`<div class="set-row"><div><div class="name">On</div><div class="desc">${note ? esc(note) : 'You are asked for a code each time you sign in.'}</div></div>
      <div class="set-ctl"><button class="btn-sm" id="tfa-off">Turn off</button></div></div><div class="save-row" style="margin-top:0"><span class="save-msg" id="tfa-msg"></span></div>`);
    document.getElementById('tfa-off').onclick = async () => {
      if(!confirm('Turn off two-step sign-in? Your password alone will be enough to sign in.')) return;
      const { error } = await sb.auth.mfa.unenroll({ factorId: verified.id });
      if(error){ document.getElementById('tfa-msg').textContent = error.message; return; }
      draw2fa('');
    };
    return;
  }
  say(`<div class="set-row"><div><div class="name">Off</div><div class="desc">${note ? esc(note) : 'Only your password is needed to sign in.'}</div></div>
    <div class="set-ctl"><button class="btn-primary" id="tfa-on">Turn on</button></div></div><div class="save-row" style="margin-top:0"><span class="save-msg" id="tfa-msg"></span></div>`);
  document.getElementById('tfa-on').onclick = async () => {
    const msg = document.getElementById('tfa-msg'); msg.textContent = '';
    try {
      for(const f of factors) await sb.auth.mfa.unenroll({ factorId: f.id });     // clear half-finished set-ups
      const { data, error } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'BoothWatch ' + new Date().toISOString().slice(0, 10) });
      if(error) throw error;
      say(`<ol class="steps">
          <li>Open your authenticator app and add an account by scanning this code.</li>
        </ol>
        <div style="background:#fff;border-radius:16px;padding:12px;display:inline-block;margin:4px 0 10px"><img src="${esc(data.totp.qr_code)}" alt="QR code to add BoothWatch to your authenticator app" width="180" height="180" style="display:block"/></div>
        <p class="help" style="margin-bottom:12px">Cannot scan it? Enter this key instead: <code style="font-family:var(--mono);font-weight:600;word-break:break-all">${esc(data.totp.secret)}</code></p>
        <ol class="steps" start="2"><li>Type the 6-digit code the app shows to finish.</li></ol>
        <div class="save-row" style="margin-top:0"><input type="text" id="tfa-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code" style="font-family:var(--mono);letter-spacing:3px;width:160px" aria-label="6-digit code"/>
        <button class="btn-primary" id="tfa-confirm">Turn on</button><button class="btn-sm" id="tfa-cancel">Cancel</button><span class="save-msg" id="tfa-msg"></span></div>`);
      const m2 = () => document.getElementById('tfa-msg');
      document.getElementById('tfa-cancel').onclick = async () => { await sb.auth.mfa.unenroll({ factorId: data.id }); draw2fa(''); };
      document.getElementById('tfa-confirm').onclick = async () => {
        const code = document.getElementById('tfa-code').value.replace(/\D/g, '');
        if(code.length !== 6){ m2().textContent = 'Enter the 6 digits from the app.'; return; }
        const { error: ve } = await sb.auth.mfa.challengeAndVerify({ factorId: data.id, code });
        if(ve){ m2().textContent = 'That code did not work. Try the newest one.'; return; }
        draw2fa('Turned on. You will be asked for a code next time you sign in.');
      };
    } catch(e){ msg.textContent = e.message || 'Could not start the set-up.'; }
  };
}

function wireSettings(booths, targets){
  const $ = id => document.getElementById(id);
  const msg = (id, text, bad) => { const m = $(id); if(m){ m.textContent = text; m.style.color = bad ? 'var(--ink)' : 'var(--accent)'; clearTimeout(m._t); if(text) m._t = setTimeout(() => { m.textContent = ''; }, 4000); } };
  const saveToAll = async (list, patchFor) => {
    for(const b of list){
      const { error } = await sb.rpc('update_booth_config', { p_booth_id: b.id, p_patch: patchFor(b) });
      if(error) throw error;
    }
  };
  const refreshCache = async () => { boothCache = await loadBooths(); };

  if($('scope')) $('scope').onchange = e => { settingsScope = e.target.value; drawSettings(); };
  draw2fa();
  document.querySelectorAll('[data-stab-btn]').forEach(b => b.onclick = () => {
    settingsTab = b.dataset.stabBtn;
    try { localStorage.setItem('bw-settings-tab', settingsTab); } catch(e){}
    applySettingsTab();
    window.scrollTo({ top: 0 });
  });
  applySettingsTab();

  // alerts
  document.querySelectorAll('[data-a-on]').forEach(box => {
    box.onchange = () => box.closest('.set-ctl').classList.toggle('off', !box.checked);
  });
  if($('save-alerts')) $('save-alerts').onclick = async () => {
    const alerts = {};
    for(const kind of ['offline', 'software', 'device', 'print_missing', 'low_prints', 'out_of_prints', 'command_failed']){
      const o = { on: document.querySelector(`[data-a-on="${kind}"]`).checked };
      const d = document.querySelector(`[data-a-delay="${kind}"]`);
      if(d && d.value !== '') o.delay = Number(d.value);
      if(kind === 'low_prints'){ const t = document.querySelector('[data-a-threshold]'); if(t && t.value !== '') o.threshold = Number(t.value); }
      alerts[kind] = o;
    }
    const patch = { alerts, alerts_muted: $('a-muted').checked };
    $('save-alerts').disabled = true;
    try { await saveToAll(targets(), () => patch); await refreshCache(); msg('msg-alerts', 'Saved'); }
    catch(e){ msg('msg-alerts', e.message, true); }
    $('save-alerts').disabled = false;
  };

  // hours

// ═══════════════ Company page ═══════════════
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = fromYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const spanDays = (a, b) => Math.round((fromYmd(b) - fromYmd(a)) / 864e5) + 1;
const monthDays = s => { const d = fromYmd(s); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const shiftYear = (s, n) => { const d = fromYmd(s); d.setFullYear(d.getFullYear() + n); return ymd(d); };
const monthStart = (s, n = 0) => { const d = fromYmd(s); return ymd(new Date(d.getFullYear(), d.getMonth() + n, 1)); };
const monthEnd = s => ymd(new Date(fromYmd(s).getFullYear(), fromYmd(s).getMonth() + 1, 0));
const fmtDay = s => fromYmd(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtShort = s => fromYmd(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmtMonth = s => fromYmd(s).toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
const fmtRange = ([a, b]) => a === b ? fromYmd(a).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
  : `${fmtShort(a)} – ${fromYmd(b).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}`;

const PERIODS = [
  ['today', 'Today'], ['yesterday', 'Yesterday'], ['week', 'This week'], ['lastweek', 'Last week'],
  ['month', 'This month'], ['lastmonth', 'Last month'], ['last30', 'Last 30 days'], ['year', 'This year'], ['lastyear', 'Last year'], ['custom', 'Custom dates…'],
];
function periodRange(key, custom){
  const today = ymd(new Date()), t = fromYmd(today);
  const monday = addDays(today, -((t.getDay() + 6) % 7));
  switch(key){
    case 'today': return [today, today];
    case 'yesterday': { const y = addDays(today, -1); return [y, y]; }
    case 'week': return [monday, today];
    case 'lastweek': return [addDays(monday, -7), addDays(monday, -1)];
    case 'month': return [monthStart(today), today];
    case 'lastmonth': { const s = monthStart(today, -1); return [s, monthEnd(s)]; }
    case 'last30': return [addDays(today, -29), today];
    case 'year': return [t.getFullYear() + '-01-01', today];
    case 'lastyear': return [(t.getFullYear() - 1) + '-01-01', (t.getFullYear() - 1) + '-12-31'];
    default: {
      const a = custom && custom[0] || today, b = custom && custom[1] || today;
      return a <= b ? [a, b] : [b, a];
    }
  }
}
function compareRange(mode, key, [f, t], custom){
  if(mode === 'none') return null;
  if(mode === 'custom'){ const a = custom && custom[0], b = custom && custom[1]; return a && b ? (a <= b ? [a, b] : [b, a]) : null; }
  if(mode === 'yoy') return [shiftYear(f, -1), shiftYear(t, -1)];
  const n = spanDays(f, t);
  if(key === 'month' || key === 'lastmonth'){ const ps = monthStart(f, -1); return [ps, addDays(ps, Math.min(n, monthDays(ps)) - 1)]; }
  if(key === 'year' || key === 'lastyear') return [shiftYear(f, -1), shiftYear(t, -1)];
  return [addDays(f, -n), addDays(f, -1)];
}

let companyState = (() => { try { return { period: 'month', compare: 'prev', metric: 'profit', customFrom: '', customTo: '', cmpFrom: '', cmpTo: '', ...JSON.parse(localStorage.getItem('bw-company') || '{}') }; } catch(e){ return { period: 'month', compare: 'prev', metric: 'profit', customFrom: '', customTo: '', cmpFrom: '', cmpTo: '' }; } })();

let statsCache = null;   // { at, since, rows, booths }
