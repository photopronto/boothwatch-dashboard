async function loadStatsRows(since){
  let all = [], from = 0;
  for(;;){
    const { data, error } = await sb.from('daily_stats').select('booth_id, day, sessions, prints').gte('day', since).order('day').order('booth_id').range(from, from + 999);
    if(error) throw error;
    all = all.concat(data);
    if(data.length < 1000) break;
    from += 1000;
  }
  return all;
}

// Sales, costs and profit for a date range. Prices and costs are each booth's current settings.
function computeRange(rows, booths, [f, t], bucket, refunds, excludeFree){
  const today = ymd(new Date());
  const end = t > today ? today : t;
  const byKey = new Map(rows.map(r => [r.booth_id + '|' + r.day, r]));
  const per = {}, buckets = new Map();
  const zero = () => ({ sessions: 0, prints: 0, sales: 0, printCost: 0, fees: 0, running: 0, costs: 0, refunds: 0, refundCount: 0, profit: 0 });
  const add = (o, x) => { for(const k in x) o[k] += x[k]; };
  let missing = false;
  for(const b of booths){
    const m = (b.config && b.config.money) || {};
    const price = m.free === true ? 0 : (Number(m.price) || 0), cpp = Number(m.cost_per_print) || 0, monthly = Number(m.monthly_cost) || 0, fee = Number(m.card_fee_pct) || 0;
    if(!price && m.free !== true) missing = true;
    const startDay = b.created_at ? ymd(new Date(b.created_at)) : '0000-00-00';
    per[b.id] = zero();
    for(let d = f; d <= end; d = addDays(d, 1)){
      const r = byKey.get(b.id + '|' + d);
      const sessions = r ? r.sessions : 0, prints = r ? r.prints : 0;
      const sales = sessions * price, printCost = prints * cpp, fees = sales * fee / 100;
      const running = (d >= startDay || r) ? monthly / monthDays(d) : 0;
      const x = { sessions, prints, sales, printCost, fees, running, costs: printCost + fees + running, profit: sales - (printCost + fees + running) };
      add(per[b.id], x);
      if(excludeFree && m.free === true) x.sessions = 0;   // free booths keep their own figures but are left out of the totals
      const key = bucket === 'month' ? d.slice(0, 7) : d;
      if(!buckets.has(key)) buckets.set(key, { key, day: d, ...zero() });
      add(buckets.get(key), x);
    }
  }
  // make sure days with no data still appear (a booth list that is empty gives no buckets)
  for(let d = f; d <= end; d = addDays(d, 1)){
    const key = bucket === 'month' ? d.slice(0, 7) : d;
    if(!buckets.has(key)) buckets.set(key, { key, day: d, ...zero() });
  }
  // Refunds you have recorded on Support reports, counted on the day the customer used the booth
  for(const r of (refunds || [])){
    const d = ymd(new Date(r.used_at));
    if(!per[r.booth_id] || d < f || d > end) continue;
    const amt = Number(r.refund_amount) || 0;
    const key = bucket === 'month' ? d.slice(0, 7) : d;
    const bk = buckets.get(key);
    for(const o of [per[r.booth_id], bk]){ if(o){ o.refunds += amt; o.refundCount += 1; o.profit -= amt; } }
  }
  const totals = zero();
  booths.forEach(b => { const p = per[b.id]; add(totals, (excludeFree && b.config && b.config.money && b.config.money.free === true) ? { ...p, sessions: 0 } : p); });
  return { per, totals, buckets: [...buckets.values()].sort((a, b) => a.key < b.key ? -1 : 1), missing };
}

const METRICS = { sales: 'Sales', costs: 'Costs', refunds: 'Refunds', profit: 'Profit', sessions: 'Sessions', prints: 'Prints', avg: 'Sessions per day' };
const isMoneyMetric = m => ['sales', 'costs', 'refunds', 'profit'].includes(m);
const fmtMetric = (m, v) => m === 'avg' ? String(Math.round(v * 10) / 10) : isMoneyMetric(m) ? money(v) : String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

function deltaText(metric, cur, prev, label){
  if(prev == null) return '';
  const diff = cur - prev;
  const pct = prev !== 0 ? Math.round(100 * diff / Math.abs(prev)) : null;
  const arrow = diff > 0 ? '▲' : (diff < 0 ? '▼' : '=');
  const amount = isMoneyMetric(metric) ? money(Math.abs(diff)) : fmtMetric(metric, Math.abs(diff));
  return `<div class="delta"><b>${arrow} ${diff === 0 ? 'no change' : amount}${pct != null && diff !== 0 ? ` (${pct > 0 ? '+' : ''}${pct}%)` : ''}</b> vs ${esc(label)}</div>`;
}

async function renderCompanyPage(){

    <p class="page-sub">Sales are sessions × price per session, before costs and refunds. Set prices and costs in Settings.</p>
    <div id="company-body"><div class="empty">Loading…</div></div>`;
  try {
    const booths = await loadBooths();
    if(view !== 'company') return;
    const since = addDays(monthStart(ymd(new Date()), -25), 0);

        const r = await sb.from('support_reports').select('booth_id, used_at, refund_amount').in('outcome', ['refunded', 'partial_refund']).gte('used_at', since + 'T00:00:00').limit(5000);
        if(!r.error && r.data) refunds = r.data;

    document.getElementById('company-body').innerHTML = `<div class="empty">Could not load the figures: ${esc(e.message || e)}</div>`;
  }
}

function drawCompany(){
  const allBooths = boothCache, rows = statsCache.rows, S = companyState;
  const booths = allBooths.filter(b => !(b.config && b.config.stage === 'build'));
  const buildCount = allBooths.length - booths.length;
  const body = document.getElementById('company-body');
  if(!booths.length){ body.innerHTML = `<div class="empty">${allBooths.length ? 'Every booth is in build mode, so there is nothing to total up. Switch a booth to live in Settings.' : 'No booths yet. Add one in Settings.'}</div>`; return; }

  const cur = periodRange(S.period, [S.customFrom, S.customTo]);
  const cmp = compareRange(S.compare, S.period, cur, [S.cmpFrom, S.cmpTo]);
  const longRange = spanDays(cur[0], cur[1]) > 62;
  const bucket = longRange ? 'month' : 'day';
  const RF = statsCache.refunds || [];
  const A = computeRange(rows, booths, cur, bucket, RF, true);
  const B = cmp ? computeRange(rows, booths, cmp, bucket, RF, true) : null;
  const cmpLabel = cmp ? (cmp[0] === cmp[1] ? fmtShort(cmp[0]) : fmtShort(cmp[0]) + ' – ' + fmtShort(cmp[1])) : '';
  const T = A.totals, TB = B && B.totals;
  const price0 = booths.filter(b => !(b.config && b.config.money && (b.config.money.free === true || Number(b.config.money.price) > 0)));

  const tile = (metric, cls, sub) => `<div class="tile ${cls || ''}"><div class="tile-label">${METRICS[metric]}</div><div class="tile-num co">${isMoneyMetric(metric) ? money0(T[metric]) : fmtMetric(metric, T[metric])}</div>${sub ? `<div class="tile-sub">${sub}</div>` : ''}${deltaText(metric, T[metric], TB && TB[metric], cmpLabel)}</div>`;
  const perSession = T.sessions ? T.profit / T.sessions : 0;

  const perRows = booths.map(b => {
    const p = A.per[b.id], q = B && B.per[b.id];
    const d = q ? p.profit - q.profit : null;
    return `<tr><td>${esc(b.name)}</td><td class="num">${p.sessions}</td><td class="num">${p.prints}</td><td class="num">${money(p.sales)}</td><td class="num">${money(p.costs)}</td><td class="num">${money(p.refunds)}</td><td class="num">${money(p.profit)}</td>${B ? `<td class="num">${d == null ? '' : (d > 0 ? '▲ ' : d < 0 ? '▼ ' : '') + money(Math.abs(d))}</td>` : ''}</tr>`;
  }).join('');
  const dTotal = TB ? T.profit - TB.profit : null;

// One chart: current period in blue, comparison in grey, hover tooltip, and a table view.
function drawBarChart(host, o){
  const n = o.cur.length;
  const hasCmp = !!(o.cmp && o.cmp.length);
  const all = o.cur.concat(hasCmp ? o.cmp : []);
  const fmt = v => fmtMetric(o.metric, v);
  if(!n || all.every(v => !v)){
    host.innerHTML = '<div class="no-data">No figures for this period yet.</div>'; return;
  }
  if(o.table){
    const rows = o.cur.map((v, i) => `<tr><td>${esc(o.curLabels[i])}</td><td class="num">${fmt(v)}</td>${hasCmp ? `<td>${esc(o.cmpLabels[i] || '')}</td><td class="num">${o.cmp[i] != null ? fmt(o.cmp[i]) : ''}</td>` : ''}</tr>`).join('');
    host.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${esc(o.curName)}</th><th class="num">${METRICS[o.metric]}</th>${hasCmp ? `<th>${esc(o.cmpName)}</th><th class="num">${METRICS[o.metric]}</th>` : ''}</tr></thead><tbody>${rows}</tbody></table></div>`;
    return;
  }
  host.innerHTML = `
    <div class="legend"><span><i style="background:var(--accent)"></i>${esc(o.curName)}</span>${hasCmp ? `<span><i style="background:#C3C7CF"></i>${esc(o.cmpName)}</span>` : ''}</div>
    <div class="chart-box"><svg role="img" aria-label="${esc(METRICS[o.metric])} chart"></svg><div class="chart-tip" hidden></div></div>`;
  const box = host.querySelector('.chart-box'), svg = box.querySelector('svg'), tip = box.querySelector('.chart-tip');
  const W = Math.max(280, box.clientWidth || 600), H = W < 520 ? 220 : 260;
  const m = { l: isMoneyMetric(o.metric) ? 56 : 40, r: 6, t: 8, b: 26 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  if(hi === lo) hi = lo + 1;
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const y = v => m.t + ph * (1 - (v - lo) / (hi - lo));
  const y0 = y(0);
  const band = pw / Math.max(n, hasCmp ? o.cmp.length : 0, 1), bw = Math.max(2, Math.min(18, band * (hasCmp ? 0.36 : 0.6)));
  const tickFmt = v => o.metric === 'avg' ? String(Math.round(v * 10) / 10) : isMoneyMetric(o.metric) ? (Math.abs(v) >= 1000 ? '£' + (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : '£' + Math.round(v)) : String(Math.round(v));
  let g = '';
  for(let v = lo; v <= hi + step / 2; v += step){
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? '#9AA0AA' : '#E1E3E8'}" stroke-width="1"/>`;
    g += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${tickFmt(v)}</text>`;
  }
  const bar = (x, v, fill) => {
    if(!v) return '';
    const yy = y(v), h = Math.abs(yy - y0), r = Math.min(4, h, bw / 2);
    if(h < 0.5) return '';
    return v > 0
      ? `<path d="M${x},${y0} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${y0} Z" fill="${fill}"/>`
      : `<path d="M${x},${y0} V${yy - r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy - r} V${y0} Z" fill="${fill}"/>`;
  };
  const every = Math.max(1, Math.ceil(n / Math.floor(pw / 56)));
  let marks = '', hits = '', labels = '';
  for(let i = 0; i < n; i++){
    const cx = m.l + band * i + band / 2;
    if(hasCmp){
      marks += bar(cx - bw - 1, o.cmp[i], '#C3C7CF') + bar(cx + 1, o.cur[i], '#0078FF');
    } else marks += bar(cx - bw / 2, o.cur[i], '#0078FF');
    if(i % every === 0) labels += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(o.xLabels[i])}</text>`;
    hits += `<rect class="hit" data-i="${i}" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ph}" fill="transparent"/>`;
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
  svg.innerHTML = `${g}<rect id="hl" x="0" y="${m.t}" width="${band}" height="${ph}" fill="#0A0A0B" opacity="0" />${marks}${labels}${hits}`;
  const hl = svg.querySelector('#hl');
  const show = i => {
    hl.setAttribute('x', m.l + band * i); hl.setAttribute('opacity', '0.05');
    const d = hasCmp && o.cmp[i] != null ? o.cur[i] - o.cmp[i] : null;
    tip.innerHTML = `<div>${esc(o.curLabels[i])}: ${fmt(o.cur[i])}</div>`
      + (hasCmp && o.cmpLabels[i] ? `<div class="k">${esc(o.cmpLabels[i])}: ${o.cmp[i] != null ? fmt(o.cmp[i]) : '—'}</div>` : '')
      + (d != null && d !== 0 ? `<div class="k">${d > 0 ? '▲' : '▼'} ${fmt(Math.abs(d))}</div>` : '')
      + (o.extra && o.extra[i] ? `<div class="k">${esc(o.extra[i])}</div>` : '');
    tip.hidden = false;
    const cx = m.l + band * i + band / 2, tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, cx - tw / 2)) + 'px';
    tip.style.top = Math.max(0, y(Math.max(o.cur[i], hasCmp && o.cmp[i] != null ? o.cmp[i] : o.cur[i])) - tip.offsetHeight - 8) + 'px';
  };
  svg.querySelectorAll('.hit').forEach(r => {
    r.addEventListener('pointerenter', () => show(+r.dataset.i));
    r.addEventListener('pointerdown', () => show(+r.dataset.i));
  });
  svg.addEventListener('pointerleave', () => { tip.hidden = true; hl.setAttribute('opacity', '0'); });
}
function niceStep(raw){
  if(!(raw > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}

async function renderSupportPage(){
  mainEl().innerHTML = `

async function loadSupport(force){
  if(view !== 'support') return;
  const list = document.getElementById('support-list');
  if(!list) return;
  if(!force && list.contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;   // do not redraw while typing
  const [{ data, error }, booths] = await Promise.all([
    sb.from('support_reports').select('*').order('created_at', { ascending: false }).limit(300),
    loadBooths()]);
  if(view !== 'support') return;
  if(error){ list.innerHTML = `<div class="empty">Could not load reports: ${esc(error.message)}</div>`; return; }
  boothCache = booths;
  try { const r2 = await sb.from('support_settings').select('*').maybeSingle(); if(!r2.error && r2.data) supportForm = r2.data; } catch(e){}
  const rows = data || [];
  setSupportBadge(rows.filter(r => r.status === 'new').length);
  const json = JSON.stringify([rows, supportFilter]);
  if(!force && json === lastSupportJson) return;
  lastSupportJson = json;
  mainEl().querySelectorAll('[data-sf]').forEach(b => b.classList.toggle('on', b.dataset.sf === supportFilter));
  const names = Object.fromEntries(booths.map(b => [b.id, b.name]));
  const shown = rows.filter(r => supportFilter === 'all' || (supportFilter === 'open' ? r.status !== 'resolved' : r.status === 'resolved'));
  if(!shown.length){
    list.innerHTML = `<div class="empty">${rows.length ? 'Nothing here.' : 'No reports yet. Print the QR codes from Settings → Support QR codes and put one in each booth.'}</div>`;
    return;
  }
  const byId = Object.fromEntries(booths.map(b => [b.id, b]));
  list.innerHTML = shown.map(r => supportCard(r, names[r.booth_id] || 'Unknown booth', byId[r.booth_id])).join('');
  wireSupport(list, rows);
}

const dayTime = iso => new Date(iso).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function supportContext(r){
  const c = r.context || {};
  const hhmm = iso => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const lines = [];
  const near = Array.isArray(c.alerts_around_time_used) ? c.alerts_around_time_used : [];
  if(near.length) near.forEach(a => lines.push(`<div><b>${esc(a.key || a.kind)}</b>: ${esc(a.message)} (from ${hhmm(a.since)}, ${a.resolved ? 'cleared ' + hhmm(a.resolved) : 'still open when reported'})</div>`));
  else lines.push('<div><b>No BoothWatch alerts</b> around the time they used the booth. The booth may have looked healthy.</div>');
  const bad = (Array.isArray(c.programs_now) ? c.programs_now : []).filter(p => p.ok === false);
  if(bad.length) lines.push(`<div>At the time of the report: ${bad.map(p => esc(p.name) + (p.note ? ' (' + esc(p.note) + ')' : '')).join(', ')} not OK.</div>`);
  lines.push(`<div>Booth was ${c.online_now ? 'online' : 'offline'} when the report arrived${c.last_heartbeat_at ? ' (last check-in ' + esc(fmtAgo(c.last_heartbeat_at)) + ' before reading this)' : ''}.</div>`);
  const day = c.that_day || {};
  if(day.sessions != null) lines.push(`<div>That day: ${day.sessions} sessions, ${day.prints} prints.</div>`);
  if(c.paper_left != null) lines.push(`<div>Printer paper left at the time: about ${c.paper_left} pages.</div>`);
  return lines.join('');
}

function emailSettings(){ return { ...EMAIL_DEFAULTS, ...((supportForm && supportForm.email) || {}) }; }
function fillEmail(tpl, r, booth){
  const d = new Date(r.used_at);
  const vals = { booth: booth ? booth.name : 'the photobooth', location: (booth && booth.location) || '', issue: r.issue || '', when: dayTime(r.used_at),
    date: d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }), time: d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }), details: r.details || '' };
  return String(tpl || '').replace(/\{(booth|location|issue|when|date|time|details)\}/g, (_, k) => vals[k]);
}
function replyLink(r, booth){
  const E = emailSettings(), su = encodeURIComponent(fillEmail(E.subject, r, booth)), bo = encodeURIComponent(fillEmail(E.body, r, booth)), to = encodeURIComponent(r.email);
  if(E.client === 'gmail') return `https://mail.google.com/mail/?view=cm&fs=1${E.from ? '&authuser=' + encodeURIComponent(E.from) : ''}&to=${to}&su=${su}&body=${bo}`;
  if(E.client === 'outlook') return `https://outlook.office.com/mail/deeplink/compose?to=${to}&subject=${su}&body=${bo}`;
  return `mailto:${r.email}?subject=${su}&body=${bo}`;

      <label>Refund<select data-f="refundtype">${SUPPORT_REFUNDS.map(([v, n]) => `<option value="${v}" ${(r.outcome || '') === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>

      <label>Outcome<select data-f="resolution">${SUPPORT_RESOLUTIONS.map(([v, n]) => `<option value="${v}" ${(r.resolution || '') === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="wide">Notes<textarea data-f="notes" placeholder="What you did, what you said">${esc(r.notes || '')}</textarea></label>
    </div>
    <div class="actions"><button class="btn-primary save">Save</button><button class="del" style="margin-left:auto">Delete</button></div>
  </article>`;
}

function wireSupport(list, rows){
  list.querySelectorAll('.report').forEach(card => {
    const id = Number(card.dataset.rid);
    const f = k => card.querySelector(`[data-f="${k}"]`);
    f('refundtype').onchange = () => { card.querySelector('[data-refund]').hidden = !['refunded', 'partial_refund'].includes(f('refundtype').value); };
    card.querySelector('.save').onclick = async e => {
      const btn = e.target; btn.disabled = true;
      const refund = f('refund').value === '' ? null : Number(f('refund').value);
      const { error } = await sb.rpc('update_support_report', { p_id: id, p_status: f('status').value, p_refund_type: f('refundtype').value, p_refund: refund, p_notes: f('notes').value, p_resolution: f('resolution').value });
      btn.disabled = false;
      if(error){ alert(error.message); return; }
      toast('Saved'); lastSupportJson = null; loadSupport(true);
    };
    card.querySelector('.del').onclick = async () => {
      if(!confirm('Delete this report for good?')) return;
      const { error } = await sb.rpc('delete_support_report', { p_id: id });
      if(error){ alert(error.message); return; }
      lastSupportJson = null; loadSupport(true);
    };
  });
}

// ═══════════════ QR codes for the booths ═══════════════
function pageBase(){ return location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, ''); }
function reportLink(boothId){ return (CONFIG.SUPPORT_URL ? CONFIG.SUPPORT_URL.replace(/\/?$/, '/') : pageBase() + 'report.html') + (boothId ? '?b=' + encodeURIComponent(boothId) : ''); }

function loadQrLib(){
  if(window.qrcode) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload = res; s.onerror = () => rej(new Error('Could not load the QR code library. Check your internet connection.'));
    document.head.appendChild(s);
  });
}
function qrSvg(text){
  const q = window.qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = '';
  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) d += `M${c},${r}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
// One 110 x 50 mm "Report a fault" card per booth, made in the browser as a vector PDF or SVG.
// The text is converted to outlines, so the file looks the same on any computer and in any print shop.
// Positions are in points (the card is 311.811 x 141.732 pt) and follow the approved design.
const CARD_W = 311.811, CARD_H = 141.732, CARD_INK = [0.1373, 0.1216, 0.1255];
const FONT_BASE = 'https://cdn.jsdelivr.net/npm/';
const CARD_FONT_URLS = {
  head: FONT_BASE + '@fontsource/inter@5.0.8/files/inter-latin-800-normal.woff',
  body: FONT_BASE + '@fontsource/inter@5.0.8/files/inter-latin-400-normal.woff',
  mono: FONT_BASE + '@fontsource/ibm-plex-mono@5.0.8/files/ibm-plex-mono-latin-400-normal.woff',
  copy: FONT_BASE + '@fontsource/inter@5.0.8/files/inter-latin-700-normal.woff',
};
let cardFontsPromise = null;
function loadScriptOnce(src, test){
  if(test()) return Promise.resolve();
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.onload = res; el.onerror = () => rej(new Error('Could not load a helper library. Check your internet connection.'));
    document.head.appendChild(el);
  });
}
function loadCardTools(){
  if(!cardFontsPromise){
    cardFontsPromise = (async () => {
      await loadQrLib();
      await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js', () => window.opentype);
      const out = {};
      for(const k of Object.keys(CARD_FONT_URLS)){
        const r = await fetch(CARD_FONT_URLS[k]);
        if(!r.ok) throw new Error('Could not load the card fonts. Check your internet connection.');
        out[k] = window.opentype.parse(await r.arrayBuffer());
      }
      return out;
    })();
    cardFontsPromise.catch(() => { cardFontsPromise = null; });
  }
  return cardFontsPromise;
}
// Everything the card is made of: QR squares and outlined text, in card points (y down from the top).
function cardParts(b, fonts){
  const q = window.qrcode(0, 'M'); q.addData(reportLink(b.id)); q.make();
  const n = q.getModuleCount(), x0 = 191.941, y0 = 22.344, mod = 96.582 / n, rects = [];
  for(let r = 0; r < n; r++){
    for(let c = 0; c < n; c++){
      if(!q.isDark(r, c)) continue;
      let e = c; while(e < n && q.isDark(r, e)) e++;
      rects.push([x0 + c * mod - .01, y0 + r * mod - .01, (e - c) * mod + .02, mod + .02]);   // a hair of overlap: no seams
      c = e;
    }
  }
  const T = (txt, k, size, x, y) => fonts[k].getPath(txt, x, y, size, { kerning: true });
  const L = 22.834;
  const texts = [
    T('Report a fault', 'head', 22.1, L, 37.025),
    T('For refunds and to report', 'body', 10.16, L, 77.184),
    T('a fault with the photobooth', 'body', 10.16, L, 90.16),
    T('please scan the QR code.', 'body', 10.16, L, 103.135),
    T('Location: ' + b.name, 'mono', 6.78, L, 118.83),
    T('©PhotoPronto 2026', 'copy', 4.04, 290.719 - fonts.copy.getAdvanceWidth('©PhotoPronto 2026', 4.04, { kerning: true }), 127.571),   // bold, right edge where it always was
  ];
  return { rects, texts };
}
function cardSvgFile(parts, name){
  const f = v => v.toFixed(3);
  const qr = parts.rects.map(([x, y, w, h]) => `M${f(x)} ${f(y)}h${f(w)}v${f(h)}h${f(-w)}z`).join('');
  const ink = 'rgb(' + CARD_INK.map(v => Math.round(v * 255)).join(',') + ')';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="110mm" height="50mm" viewBox="0 0 ${CARD_W} ${CARD_H}"><title>Report a fault card, ${esc(name)}</title>`
    + `<rect x="187.23" y="17.762" width="106.004" height="105.875" fill="#fff"/><path d="${qr}" fill="#000"/>`
    + `<path d="${parts.texts.map(p => p.toPathData(3)).join(' ')}" fill="${ink}"/></svg>`;
}
function cardPdfStream(parts){
  const f = v => v.toFixed(3), Y = y => f(CARD_H - y);
  let o = `1 1 1 rg 187.230 ${f(CARD_H - 17.762 - 105.875)} 106.004 105.875 re f\n0 0 0 rg\n`;
  o += parts.rects.map(([x, y, w, h]) => `${f(x)} ${f(CARD_H - y - h)} ${f(w)} ${f(h)} re`).join('\n') + '\nf\n';
  o += CARD_INK.map(v => v.toFixed(4)).join(' ') + ' rg\n';
  for(const p of parts.texts){
    let cx = 0, cy = 0;
    for(const c of p.commands){
      if(c.type === 'M'){ o += `${f(c.x)} ${Y(c.y)} m\n`; cx = c.x; cy = c.y; }
      else if(c.type === 'L'){ o += `${f(c.x)} ${Y(c.y)} l\n`; cx = c.x; cy = c.y; }
      else if(c.type === 'C'){ o += `${f(c.x1)} ${Y(c.y1)} ${f(c.x2)} ${Y(c.y2)} ${f(c.x)} ${Y(c.y)} c\n`; cx = c.x; cy = c.y; }
      else if(c.type === 'Q'){
        o += `${f(cx + 2 / 3 * (c.x1 - cx))} ${Y(cy + 2 / 3 * (c.y1 - cy))} ${f(c.x + 2 / 3 * (c.x1 - c.x))} ${Y(c.y + 2 / 3 * (c.y1 - c.y))} ${f(c.x)} ${Y(c.y)} c\n`;
        cx = c.x; cy = c.y;
      }
      else if(c.type === 'Z') o += 'h\n';
    }
  }
  return o + 'f\n';
}
function buildPdf(streams){
  const objs = [];
  const n = streams.length;
  objs.push('<< /Type /Catalog /Pages 2 0 R >>');
  objs.push(`<< /Type /Pages /Kids [${streams.map((_, i) => `${3 + i * 2} 0 R`).join(' ')}] /Count ${n} >>`);
  streams.forEach((st, i) => {
    objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${CARD_W} ${CARD_H}] /Contents ${4 + i * 2} 0 R /Resources << >> >>`);
    objs.push(`<< /Length ${st.length} >>\nstream\n${st}endstream`);
  });
  let pdf = '%PDF-1.4\n'; const offs = [];
  objs.forEach((ob, i) => { offs.push(pdf.length); pdf += `${i + 1} 0 obj\n${ob}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(v => String(v).padStart(10, '0') + ' 00000 n \n').join('');
  pdf += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return new Blob([pdf], { type: 'application/pdf' });
}
function saveBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
const cardSlug = name => String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'booth';
async function downloadCards(list, kind){
  toast('Making your card' + (list.length === 1 ? '' : 's') + '…');
  try {
    const fonts = await loadCardTools();
    const parts = list.map(b => cardParts(b, fonts));
    if(kind === 'svg'){
      list.forEach((b, i) => saveBlob(new Blob([cardSvgFile(parts[i], b.name)], { type: 'image/svg+xml' }), `report-a-fault_${cardSlug(b.name)}.svg`));
    } else {
      saveBlob(buildPdf(parts.map(cardPdfStream)), list.length === 1 ? `report-a-fault_${cardSlug(list[0].name)}.pdf` : 'report-a-fault_all-booths.pdf');
    }
  } catch(e){ alert(e.message || 'Could not make the card.'); }
}

// Pull down from the top of any page to refresh (the Home Screen app has no address bar or refresh button).
(function(){
  if(!('ontouchstart' in window)) return;
  const el = document.createElement('div');
  el.id = 'ptr'; el.setAttribute('aria-hidden', 'true');
  el.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>';
  document.body.appendChild(el);
  const TRIGGER = 70;
  let startY = null, dist = 0, busy = false;
  const atTop = () => (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
  const place = d => { el.style.opacity = Math.min(1, d / 40); el.style.transform = `translateY(${Math.min(d, 90) - 50}px) rotate(${d * 4}deg)`; };
  document.addEventListener('touchstart', e => {
    if(busy || e.touches.length !== 1 || !atTop() || e.target.closest('input, textarea, select, .notif-panel, [data-no-ptr]')) { startY = null; return; }
    startY = e.touches[0].clientY; dist = 0;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if(startY == null || busy) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0 || !atTop()){ if(dist){ dist = 0; el.style.transition = 'none'; place(0); } return; }
    dist = dy * 0.5;
    el.style.transition = 'none'; place(dist);
    if(e.cancelable) e.preventDefault();
  }, { passive: false });
  const end = () => {
    if(startY == null) return;
    startY = null;
    el.style.transition = 'transform .2s, opacity .2s';
    if(dist >= TRIGGER && !busy){
      busy = true; el.classList.add('spin'); el.style.opacity = 1; el.style.transform = 'translateY(24px)';
      setTimeout(() => location.reload(), 250);
    } else { place(0); }
    dist = 0;
  };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', end, { passive: true });
})();

  let user = null;
  try { const { data } = await sb.auth.getSession(); user = data && data.session ? data.session.user : null; } catch(e){}
