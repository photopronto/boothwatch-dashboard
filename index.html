<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@500;700;800&display=swap');

  /* Layout: white page, light-grey rounded tiles, one blue hero tile, black only for "needs attention". */
  :root{
    --accent: #0078FF;
    --accent-soft: #E5F0FF;
    --ink: #0A0A0B;
    --muted: #6B7078;
    --clock: #9AA0AA;
    --bg: #FFFFFF;
    --tile: #F2F3F5;
    --inner: #FFFFFF;
    --line: #E1E3E8;
    --track: #DDE0E6;
    --display: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family: var(--display); font-weight: 700; font-size: 14px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select{ font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  header{
    display:flex; align-items:center; justify-content:space-between; gap:16px 24px; flex-wrap:wrap;
    padding: 24px clamp(16px, 4vw, 48px) 8px; max-width: 1280px; margin: 0 auto;
  }
  .logo{ height: 54px; width:auto; display:block; }
  .head-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pair{ display:flex; gap:8px; }
  .pair input{
    width: 150px; padding: 10px 16px; border-radius: 999px; border:1px solid var(--line); background: var(--tile);
    font-family: var(--mono); font-weight:500; font-size:13px; letter-spacing: 2px; color: var(--ink);
  }
  .pair input::placeholder{ letter-spacing: 0; color: var(--muted); }

  .btn, header button, .controls button, .releases button, .shot-close{
    background: var(--inner); color: var(--ink); border:1px solid var(--line); border-radius: 999px;
    font-weight: 700; font-size: 13px; padding: 9px 16px; cursor:pointer;
  }
  .btn:hover, header button:hover, .controls button:hover, .releases button:hover, .shot-close:hover{ border-color: var(--accent); color: var(--accent); }
  #pair-btn{ background: var(--ink); color:#fff; border-color: var(--ink); }
  #pair-btn:hover{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .controls button:disabled{ opacity:.5; cursor:default; color: var(--muted); border-color: var(--line); }
  .controls button.danger:hover{ border-color: var(--ink); background: var(--ink); color:#fff; }

  main{ padding: 8px clamp(16px, 4vw, 48px) 64px; max-width:1280px; margin:0 auto; }

  .nowbar{ display:flex; align-items:center; justify-content:space-between; gap:16px 32px; flex-wrap:wrap; padding: 22px 0 22px; }
  .fleet-checkin{ display:flex; gap: 12px 36px; flex-wrap:wrap; }
  .fleet-checkin .k{ display:block; font-weight:700; font-size:12px; color: var(--muted); margin-bottom:4px; }
  .fleet-checkin b{ font-family: var(--mono); font-weight:600; font-size:15px; font-variant-numeric: tabular-nums; }
  .clockbox{ display:flex; align-items:center; gap:14px; }
  .clock-text{ text-align:right; }
  .title-sub{ font-weight:700; font-size:12px; color: var(--muted); font-family: var(--display); }
  .clock-time{ font-family: var(--mono); font-weight:600; font-size:15px; line-height:1.2; font-variant-numeric: tabular-nums; margin-top:4px; }
  .clock-svg{ width:44px; height:44px; flex:none; }
  .clock-svg .face{ fill:none; stroke: var(--clock); stroke-width:1; }
  .clock-svg .tick{ stroke: var(--clock); stroke-width:1; stroke-linecap:round; }
  .clock-svg .hand, .clock-svg .sec{ stroke: var(--clock); stroke-linecap:round; }
  .clock-svg .pin{ fill: var(--clock); }

  /* ── login ── */
  .login-wrap{ display:flex; justify-content:center; padding: 12vh 16px 0; }
  .login-card{ background: var(--tile); border-radius: 28px; padding: 36px; width: min(380px, 100%); }
  .login-card .logo{ height: 60px; margin-bottom: 28px; }
  .login-card h2{ font-weight:800; font-size: 26px; margin:0 0 4px; letter-spacing:-.01em; }

  .login-card input{
    width:100%; padding: 13px 16px; margin-bottom: 10px; border-radius: 14px; border:1px solid var(--line);

  .login-card button:hover{ background: var(--ink); }
  .error{ color: var(--ink); font-size:13px; margin-top:12px; min-height: 1em; font-weight:700; }

  /* ── summary tiles ── */

  .tile.dark{ background: var(--ink); color:#fff; }
  .tile.dark .tile-label, .tile.dark .tile-sub{ color: rgba(255,255,255,.72); }

  /* ── agent versions ── */
  .releases{ margin: 6px 0 28px; }
  .releases summary{ cursor:pointer; padding: 8px 0; font-weight:700; color: var(--muted); }
  .releases summary:hover{ color: var(--accent); }
  .releases .rel-body{ background: var(--tile); border-radius: 24px; padding: 20px; margin-top: 6px; display:flex; flex-direction:column; gap:12px; max-width: 580px; }
  .releases .rel-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  #rel-status{ font-family: var(--mono); font-weight:500; font-size:12px; line-height:1.6; }

  .frame-loc{ color: var(--muted); font-size:13px; margin-top:4px; font-weight:500; }
  .checkin{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); margin-top:6px; line-height:1.6; font-variant-numeric: tabular-nums; }
  .checkin b{ color: var(--ink); font-weight:600; }

  .pill{ flex:none; display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding: 6px 12px; font-size:12px; font-weight:800; white-space:nowrap; }
  .pill::before{ content:""; width:7px; height:7px; border-radius:50%; background: currentColor; }
  .pill.ok{ background: var(--accent); color:#fff; }
  .pill.alert{ background: var(--ink); color:#fff; }
  .pill.off{ background: var(--inner); color: var(--muted); border:1px solid var(--line); }
  .badge-closed{ display:inline-block; vertical-align:middle; margin-left:8px; font-size:11px; font-weight:800; letter-spacing:.04em;
    text-transform:uppercase; color: var(--accent); background: var(--accent-soft); border-radius:999px; padding: 3px 9px; }

  .frame-metrics{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric{ background: var(--inner); border-radius: 18px; padding: 14px 16px; }
  .metric .num{ font-weight:800; font-size: 36px; line-height:1; letter-spacing:-.02em; font-variant-numeric: tabular-nums; }
  .metric .label{ color: var(--muted); font-size:12px; margin-top:6px; font-weight:700; }

  .roll-bar{ height: 10px; background: var(--track); border-radius: 999px; overflow:hidden; }
  .roll-fill{ height:100%; background: var(--accent); border-radius: 999px; }
  .roll-fill.warn, .roll-fill.alert{ background: var(--ink); }
  .roll-label{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:-4px; }
  .roll-label button{ background:none; border:none; color: var(--accent); font-family: var(--display); font-weight:700; font-size:12px; cursor:pointer; padding:0; text-decoration: underline; }

  .programs{ background: var(--inner); border-radius: 18px; padding: 6px 16px; }
  .program{ display:flex; align-items:flex-start; gap:12px; padding: 12px 0; border-bottom:1px solid var(--line); }

  .program-main{ flex:1; min-width:0; }
  .program-head{ display:flex; justify-content:space-between; gap:10px; font-weight:800; font-size:15px; }
  .program .state{ font-family: var(--mono); font-weight:500; color: var(--muted); font-size:12px; flex:none; padding-top:2px; }
  .program .title{ font-family: var(--mono); font-weight:500; color: var(--muted); font-size:11px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .program .detail{ font-family: var(--mono); font-weight:500; color: var(--muted); font-size:12px; margin-top:4px; line-height:1.4; overflow-wrap:anywhere; }

  .program .note{ display:block; font-size:13px; margin-top:4px; color: var(--ink); font-weight:800; }
  .prog-btn{ margin-top:8px; font-size:11px; font-weight:700; padding: 4px 12px; border-radius:999px; background: var(--tile); border:1px solid var(--line); color: var(--ink); cursor:pointer; }

  .controls input[type=checkbox]{ accent-color: var(--accent); width:16px; height:16px; }
  .controls select{ background: var(--inner); color: var(--ink); border:1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size:12px; font-weight:700; }

  .cmd-line{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); line-height:1.5; overflow-wrap:anywhere; }
  .cmd-line.bad{ color: var(--ink); font-weight:600; }
  .warn-line{ font-family: var(--mono); font-weight:500; font-size:12px; line-height:1.5; background: var(--inner); border-radius: 12px; padding: 9px 12px; }
  .agent-info{ font-family: var(--mono); font-weight:500; font-size:11px; color: var(--muted); }

  .shot-overlay{ position:fixed; inset:0; background:rgba(10,10,11,.86); z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px; }
  .shot-overlay img{ max-width:100%; max-height:80vh; border-radius: 12px; background:#000; }
  .shot-overlay .shot-meta{ color:#fff; font-family: var(--mono); font-size:12px; }

  @media (max-width: 700px){
    .logo{ height: 46px; }
    .nowbar{ padding: 14px 0 16px; }
    .summary{ grid-template-columns: 1fr 1fr; gap:10px; }

    .tile .tile-num{ margin: 10px 0 6px; font-size: 34px; }
    .frames{ gap:10px; }
    .frame{ padding: 16px 18px; border-radius: 24px; gap: 0; }
    .frame-name{ font-size: 19px; }
    .pill{ font-size:11px; padding:5px 10px; }
    .pair input{ width: 130px; }
    .frame-top{ cursor:pointer; align-items:center; }
    .frame-mini{ display:block; font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); margin-top:6px; }
    .chev{ display:block; flex:none; width:22px; height:22px; transition: transform .15s; color: var(--muted); }

    .frame-top .right{ display:flex; align-items:center; gap:10px; }
  }
  @media (prefers-reduced-motion: reduce){ .chev{ transition:none; } }
</style>

<body>

<div id="app"></div>
<div id="fatal" style="color:#C05B45;padding:20px;font-family:sans-serif"></div>

<script>
window.addEventListener('error', e => { document.getElementById('fatal').textContent = 'Error: ' + e.message; });
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }   // stays signed in on this browser
});

const app = document.getElementById('app');
let currentUser = null;
let pollTimer = null;

function fmtAgo(iso){
  if(!iso) return "never";
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if(s < 60) return s + "s ago";
  if(s < 3600) return Math.floor(s/60) + "m ago";
  return Math.floor(s/3600) + "h ago";
}

function isOnline(booth){
  if(!booth.last_heartbeat_at) return false;
  return (Date.now() - new Date(booth.last_heartbeat_at).getTime()) < 3 * 60 * 1000; // >3 missed heartbeats = offline
}

function renderLogin(errorMsg){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <img class="logo" src="logo.png" alt="Photo Pronto" />
        <h2>BoothWatch</h2>
        <p>Sign in to see your booths.</p>
        <input id="email" type="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />
        <button id="signin">Sign in</button>
        <div class="error">${errorMsg || ""}</div>
      </div>
    </div>`;
  document.getElementById('signin').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ renderLogin(error.message); return; }
    currentUser = data.user;
    renderDashboard();
  };
}

async function loadBooths(){
  const { data, error } = await sb
    .from('booths')
    .select('*')
    .order('name');
  if(error){ console.error(error); return []; }
  return data;
}

// Text from agents is shown on this page, so always escape it.
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function programList(b){
  return Array.isArray(b.programs) ? b.programs : [];
}

function rollRemaining(b){
  return Math.max(b.roll_capacity - b.prints_since_roll, 0);
}

function needsAttention(b){
  if(!isOnline(b)) return true;
  if(programList(b).some(p => !p.ok)) return true;
  return rollRemaining(b) < b.roll_capacity * 0.15;
}

// ── check-in timing, clock, mobile tabs ──
function checkInterval(b){
  const iv = b.config && Number(b.config.interval_seconds);
  return iv >= 15 ? iv : 60;
}
const pad2 = n => String(n).padStart(2, '0');
const hms = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
function secs(n){ n = Math.max(0, Math.round(n)); return n < 60 ? n + 's' : Math.floor(n/60) + 'm ' + pad2(n % 60) + 's'; }
let fleetBeats = [];   // [{t, iv}] of every booth, refreshed with the data
const isMobile = () => window.matchMedia('(max-width: 700px)').matches;
const openBooths = new Set((() => { try { return JSON.parse(localStorage.getItem('bw-open') || '[]'); } catch(e){ return []; } })());
function saveOpen(){ try { localStorage.setItem('bw-open', JSON.stringify([...openBooths])); } catch(e){} }

function tick(){
  const now = new Date();
  const t = document.getElementById('clock-time');
  if(!t) return;
  t.textContent = hms(now);
  const sec = now.getSeconds() + now.getMilliseconds()/1000, min = now.getMinutes() + sec/60, hr = (now.getHours() % 12) + min/60;
  const set = (id, deg) => { const el = document.getElementById(id); if(el) el.setAttribute('transform', `rotate(${deg} 24 24)`); };
  set('hand-h', hr * 30); set('hand-m', min * 6); set('hand-s', Math.floor(now.getSeconds()) * 6);

  const nowMs = now.getTime();
  const nextText = (lastMs, iv, online) => {
    if(!online) return 'waiting for booth';
    const left = (lastMs + iv*1000 - nowMs) / 1000;
    return left > 0 ? 'in ' + secs(left) : 'due now';
  };
  document.querySelectorAll('[data-hb]').forEach(el => {
    if(!el.dataset.hb){ el.textContent = 'No check-in yet'; return; }
    const last = new Date(el.dataset.hb), iv = Number(el.dataset.iv) || 60;
    el.innerHTML = '';
    for(const line of [`Last ${hms(last)} (${secs((nowMs - last)/1000)} ago)`, `Next ${nextText(last.getTime(), iv, el.dataset.online === '1')}`]){
      const d = document.createElement('div'); d.textContent = line; el.appendChild(d);
    }
  });
  const lastEl = document.getElementById('fleet-last'), nextEl = document.getElementById('fleet-next');
  if(lastEl && nextEl){
    if(!fleetBeats.length){ lastEl.textContent = '—'; nextEl.textContent = '—'; return; }
    const latest = Math.max(...fleetBeats.map(x => x.t));
    lastEl.textContent = `${hms(new Date(latest))} (${secs((nowMs - latest)/1000)} ago)`;
    const live = fleetBeats.filter(x => nowMs - x.t < 3*60*1000);
    const dues = live.map(x => x.t + x.iv*1000).filter(d => d > nowMs);
    nextEl.textContent = !live.length ? '—' : (dues.length ? 'in ' + secs((Math.min(...dues) - nowMs)/1000) : 'due now');
  }
}

function boothFrame(b){
  const online = isOnline(b);
  const programs = programList(b);
  const badPrograms = programs.filter(p => !p.ok);
  const remaining = rollRemaining(b);
  const pct = Math.max(0, Math.min(100, 100 * remaining / b.roll_capacity));
  const rollState = remaining === 0 ? 'alert' : (remaining < b.roll_capacity * 0.15 ? 'warn' : 'ok');

  let overallDot = 'ok', overallLabel = 'Online';
  if(!online){ overallDot = 'alert'; overallLabel = 'Offline'; }
  else if(badPrograms.length){ overallDot = 'alert'; overallLabel = badPrograms.some(p => !p.running) ? 'Software not running' : 'Software needs attention'; }
  else if(rollState !== 'ok'){ overallDot = 'warn'; overallLabel = rollState === 'alert' ? 'Out of prints' : 'Low on prints'; }

  // While the booth is offline the program list is the last thing it reported, so grey it out.
  const detailRows = p => (p.details && typeof p.details === 'object')
    ? Object.entries(p.details).map(([k, v]) => `<div class="detail"><b>${esc(k)}</b>${esc(v)}</div>`).join('')
    : '';
  const screenState = p => p.minimized ? 'Minimised' : (p.fullscreen === true ? 'Full screen' : (p.fullscreen === false ? 'Windowed' : ''));
  const cmd = b.lastCommand;
  const busy = !!cmd && (cmd.status === 'pending' || cmd.status === 'running');
  const programRows = programs.map(p => `
        <div class="program ${online ? '' : 'stale'}">
          <span class="dot ${p.ok ? 'ok' : 'alert'}"></span>
          <span class="program-main">
            <span class="program-head"><span>${esc(p.name)}</span><span class="state">${esc(screenState(p))}</span></span>
            ${p.screen ? `<div class="detail screen"><b>Screen</b>${esc(p.screen)}</div>` : ''}
            ${p.title ? `<div class="title" title="${esc(p.title)}">${esc(p.title)}</div>` : ''}
            ${detailRows(p)}
            ${p.ok ? '' : `<span class="note">${esc(p.note || 'Problem')}</span>`}
            <button class="prog-btn" data-restart-prog="${esc(p.name)}" data-booth="${esc(b.id)}" ${busy || !online ? 'disabled' : ''}>Restart</button>
          </span>
        </div>`).join('');

  const autoRestart = !!(b.config && b.config.auto_restart);
  const waiting = waitingShots.has(b.id);
  const isClosed = !!(b.config && b.config.closed);
  const st = (b.status && typeof b.status === 'object') ? b.status : {};
  const cmdNames = { restart_pc: 'Restart PC', restart_program: c => 'Restart ' + ((c.args && c.args.program) || 'program') };
  let cmdLine = '';
  if(cmd){
    const label = typeof cmdNames[cmd.kind] === 'function' ? cmdNames[cmd.kind](cmd) : (cmdNames[cmd.kind] || cmd.kind);
    const word = { pending: 'waiting for the booth to pick it up…', running: 'in progress…', done: 'done', failed: 'failed', expired: 'expired (booth did not pick it up)' }[cmd.status] || cmd.status;
    cmdLine = `<div class="cmd-line ${cmd.status === 'failed' || cmd.status === 'expired' ? 'bad' : ''}">${esc(label)}: ${esc(word)} · ${esc(fmtAgo(cmd.completed_at || cmd.created_at))}${cmd.result && cmd.status !== 'done' ? '<br>' + esc(cmd.result) : (cmd.result ? '<br>' + esc(cmd.result) : '')}</div>`;
  }
  let closedWarn = '';
  if(isClosed && online && st.closed_shown === false) closedWarn += `<div class="warn-line">The closed screen is not showing yet${st.closed_error ? ': ' + esc(st.closed_error) : '.'}</div>`;
  if(online && st.folder_found === false) closedWarn += `<div class="warn-line">Session counting: today's photo folder was not found on the booth (normal until the first session of the day).</div>`;
  if(online && st.counter_seen === false) closedWarn += `<div class="warn-line">Print counter not readable from the booth software right now.</div>`;
  const controls = `
      <div class="controls">
        <label><input type="checkbox" data-autorestart="${esc(b.id)}" ${autoRestart ? 'checked' : ''}/> Auto-restart</label>
        <label>Updates
          <select data-channel="${esc(b.id)}">
            <option value="live" ${b.channel === 'live' ? 'selected' : ''}>live</option>
            <option value="test" ${b.channel === 'test' ? 'selected' : ''}>test</option>
          </select>
        </label>
        <button data-rename-btn="${esc(b.id)}">Rename</button>
        <button data-shot="${esc(b.id)}" ${waiting || !online ? 'disabled' : ''}>${waiting ? 'Waiting for booth…' : 'Screenshot'}</button>
        <button data-closed="${esc(b.id)}" ${online ? '' : 'disabled'}>${isClosed ? 'Reopen booth' : 'Close booth…'}</button>
        <button class="danger" data-restart-pc="${esc(b.id)}" ${busy || !online ? 'disabled' : ''}>Restart PC</button>
      </div>
      ${cmdLine}
      ${closedWarn}
      <div class="agent-info">${b.agent_version ? 'Agent ' + esc(b.agent_version) : 'Agent version unknown'}</div>`;

  return `
    <div class="frame ${openBooths.has(b.id) ? 'open' : ''}" data-frame="${esc(b.id)}">
      <div class="frame-top" data-toggle="${esc(b.id)}">
        <div>
          <div class="frame-name editable" data-rename="${esc(b.id)}" title="Click to rename">${esc(b.name)}${isClosed ? '<span class="badge-closed">Closed</span>' : ''}</div>
          <div class="frame-loc">${esc(b.location || "")}</div>
          <div class="frame-mini">${b.sessions_today ?? 0} sessions · ${b.prints_today ?? 0} prints today</div>
          <div class="checkin" data-hb="${esc(b.last_heartbeat_at || '')}" data-iv="${checkInterval(b)}" data-online="${online ? 1 : 0}"></div>
        </div>
        <div class="right">
          <span class="pill ${online ? (overallDot === 'ok' ? 'ok' : 'alert') : 'off'}">${overallLabel}</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="frame-body">
      ${programRows ? `<div class="programs">${programRows}</div>` : ''}

      <div class="frame-metrics">
        <div class="metric">
          <div class="num">${b.prints_today ?? 0}</div>
          <div class="label">prints today</div>
        </div>
        <div class="metric">
          <div class="num">${b.sessions_today ?? 0}</div>
          <div class="label">sessions today</div>
        </div>
      </div>

      <div class="roll-bar"><div class="roll-fill ${rollState}" style="width:${pct}%"></div></div>
      <div class="roll-label">
        <span>${remaining} prints left on roll</span>
        <button data-reset="${b.id}">roll changed</button>
      </div>
      ${controls}
      </div>
    </div>`;
}

// ── screenshots ──
const waitingShots = new Set();
const sleep = ms => new Promise(r => setTimeout(r, ms));

function showShot(data){
  const old = document.getElementById('shot-overlay');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'shot-overlay';
  el.id = 'shot-overlay';
  const taken = new Date(data.taken_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  el.innerHTML = `
    <img alt="Booth screen" src="data:image/jpeg;base64,${data.image_base64}" />
    <div class="shot-meta">${esc(data.booth_name)}, taken at ${esc(taken)}</div>
    <button class="shot-close">Close</button>`;
  el.onclick = e => { if(e.target === el || e.target.classList.contains('shot-close')) el.remove(); };
  document.body.appendChild(el);
}

async function requestScreenshot(booth, refresh){
  waitingShots.add(booth.id);
  refresh();
  try{
    const { data: before } = await sb.from('booth_screenshots').select('taken_at').eq('booth_id', booth.id).maybeSingle();
    const prevTaken = before ? before.taken_at : null;
    const { error } = await sb.rpc('request_screenshot', { p_booth_id: booth.id });
    if(error){ alert(error.message); return; }

    const deadline = Date.now() + 60000;
    while(Date.now() < deadline){
      await sleep(3000);
      const { data } = await sb.from('booth_screenshots').select('taken_at, image_base64').eq('booth_id', booth.id).maybeSingle();
      if(data && data.taken_at !== prevTaken){
        showShot({ ...data, booth_name: booth.name });
        return;
      }
    }
    alert('No screenshot arrived. The booth may be offline, or the agent may need updating.');
  } finally {
    waitingShots.delete(booth.id);
    refresh();
  }
}

// ── agent releases (publish a new agent.py, promote test to live) ──
function relDate(iso){
  return iso ? new Date(iso).toLocaleString([], { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
}

async function refreshReleases(){
  const el = document.getElementById('rel-status');
  if(!el) return;
  const { data, error } = await sb.rpc('agent_releases_info');
  if(error){ el.textContent = 'Could not load releases: ' + error.message; return; }
  const get = ch => (data || []).find(r => r.channel === ch);
  const line = (label, r) => `<div class="rel-row"><span>${label}</span> <b>${r ? esc(r.version) : 'nothing published'}</b> <span>${r ? esc(relDate(r.published_at)) : ''}</span></div>`;
  el.innerHTML = line('Test channel', get('test')) + line('Live channel', get('live'));
}

function wireReleases(){
  const file = document.getElementById('rel-file');
  document.getElementById('rel-publish').onclick = async () => {
    const f = file.files[0];
    if(!f){ alert('Choose agent.py first.'); return; }
    const code = await f.text();
    const m = code.match(/^VERSION\s*=\s*"([^"]+)"/m);
    if(!m){ alert('This does not look like agent.py (no VERSION line found).'); return; }
    if(!confirm(`Publish agent ${m[1]} to the TEST channel? Booths set to "test" will update within a few minutes.`)) return;
    const { error } = await sb.rpc('publish_agent', { p_channel: 'test', p_version: m[1], p_code: code });
    if(error){ alert(error.message); return; }
    file.value = '';
    refreshReleases();
  };
  document.getElementById('rel-promote').onclick = async () => {
    if(!confirm('Copy the test version to LIVE? Every booth on the live channel will update within a few minutes.')) return;
    const { error } = await sb.rpc('promote_agent');
    if(error){ alert(error.message); return; }
    refreshReleases();
  };
  refreshReleases();
}

async function loadTodayCounts(boothIds){
  if(boothIds.length === 0) return {};
  const today = new Date().toLocaleDateString('en-CA');   // YYYY-MM-DD in this computer's time zone
  const { data, error } = await sb
    .from('daily_stats')
    .select('booth_id, sessions, prints')
    .in('booth_id', boothIds)
    .eq('day', today);
  if(error){ console.error(error); return {}; }
  const out = {};
  for(const row of data){
    out[row.booth_id] = { prints_today: row.prints, sessions_today: row.sessions };
  }
  return out;
}

async function loadLastCommands(boothIds){
  if(boothIds.length === 0) return {};
  const { data, error } = await sb
    .from('booth_commands')
    .select('id, booth_id, kind, args, status, result, created_at, completed_at')
    .in('booth_id', boothIds)
    .order('id', { ascending: false })
    .limit(60);
  if(error){ console.error(error); return {}; }
  const out = {};
  for(const row of data){ if(!out[row.booth_id]) out[row.booth_id] = row; }
  return out;
}

async function renderDashboard(){
  app.innerHTML = `
    <header>
      <img class="logo" src="logo.png" alt="Photo Pronto" />
      <div class="head-actions">
        <div class="pair">
          <input id="pairing-code" placeholder="Pairing code" maxlength="6" aria-label="Pairing code from a new booth" />
          <button id="pair-btn">Add booth</button>
        </div>
        <button id="signout">Sign out</button>
      </div>
    </header>
    <main>
      <div class="nowbar">
        <div class="fleet-checkin">
          <div><span class="k">Last check-in</span><b id="fleet-last">—</b></div>
          <div><span class="k">Next check-in</span><b id="fleet-next">—</b></div>
        </div>
        <div class="clockbox">
          <div class="clock-text">
            <div class="title-sub" id="today-label"></div>
            <div class="clock-time" id="clock-time">00:00:00</div>
          </div>
          <svg class="clock-svg" viewBox="0 0 48 48" role="img" aria-label="Analogue clock">
            <circle class="face" cx="24" cy="24" r="21.5"/>
            <line class="tick" x1="24" y1="5" x2="24" y2="8.5"/><line class="tick" x1="43" y1="24" x2="39.5" y2="24"/>
            <line class="tick" x1="24" y1="43" x2="24" y2="39.5"/><line class="tick" x1="5" y1="24" x2="8.5" y2="24"/>
            <g id="hand-h"><line class="hand" x1="24" y1="24" x2="24" y2="14" stroke-width="1.4"/></g>
            <g id="hand-m"><line class="hand" x1="24" y1="24" x2="24" y2="9" stroke-width="1.1"/></g>
            <g id="hand-s"><line class="sec" x1="24" y1="26" x2="24" y2="7" stroke-width="0.7"/></g>
            <circle class="pin" cx="24" cy="24" r="1.4"/>
          </svg>
        </div>
      </div>
      <div class="summary" id="summary"></div>
      <details class="releases">
        <summary>Agent versions</summary>
        <div class="rel-body">
          <div id="rel-status">Loading…</div>
          <div class="rel-row">
            <input type="file" id="rel-file" accept=".py" />
            <button id="rel-publish">Publish to test</button>
          </div>
          <div class="rel-row"><button id="rel-promote">Promote test to live</button></div>
          <div class="rel-help">New versions go to the test channel first. Booths set to "test" update within a few minutes. Once it works, promote it so booths on "live" get it too.</div>
        </div>
      </details>
      <div class="frames" id="frames"></div>
    </main>`;
  document.getElementById('today-label').textContent = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  if(window.clockTimer) clearInterval(window.clockTimer);
  window.clockTimer = setInterval(tick, 1000);
  tick();
  wireReleases();

  document.getElementById('signout').onclick = async () => {
    await sb.auth.signOut();
    if(pollTimer) clearInterval(pollTimer);
    renderLogin();
  };

  document.getElementById('pair-btn').onclick = async () => {
    const code = document.getElementById('pairing-code').value.trim();
    if(code.length !== 6) return;
    const { error } = await sb.rpc('claim_booth', { p_code: code });
    if(error){ alert(error.message); return; }
    document.getElementById('pairing-code').value = '';
    refresh();
  };

  async function refresh(){
    let booths = await loadBooths();
    const ids = booths.map(b => b.id);
    const [counts, lastCmds] = await Promise.all([loadTodayCounts(ids), loadLastCommands(ids)]);
    booths = booths.map(b => ({ ...b, ...(counts[b.id] || { prints_today: 0, sessions_today: 0 }), lastCommand: lastCmds[b.id] || null }));

    const onlineCount = booths.filter(isOnline).length;
    const attentionCount = booths.filter(needsAttention).length;
    const printsToday = booths.reduce((s,b) => s + (b.prints_today||0), 0);
    const sessionsToday = booths.reduce((s,b) => s + (b.sessions_today||0), 0);

    document.getElementById('summary').innerHTML = `
      <div class="tile hero"><div class="tile-label">Online</div><div class="tile-num">${onlineCount}/${booths.length}</div><div class="tile-sub">booths checking in</div></div>
      <div class="tile ${attentionCount ? 'dark' : ''}"><div class="tile-label">Need attention</div><div class="tile-num">${attentionCount}</div><div class="tile-sub">${attentionCount ? 'open the cards below' : 'all clear'}</div></div>
      <div class="tile"><div class="tile-label">Sessions today</div><div class="tile-num">${sessionsToday}</div><div class="tile-sub">all booths</div></div>
      <div class="tile"><div class="tile-label">Prints today</div><div class="tile-num">${printsToday}</div><div class="tile-sub">all booths</div></div>`;

    fleetBeats = booths.filter(b => b.last_heartbeat_at).map(b => ({ t: new Date(b.last_heartbeat_at).getTime(), iv: checkInterval(b) }));
    const framesEl = document.getElementById('frames');
    framesEl.innerHTML = booths.length
      ? booths.map(boothFrame).join('')
      : `<div class="empty">No booths yet — enter a pairing code above once you've installed the agent on a booth PC.</div>`;

    tick();

    async function renameBooth(id){
      const booth = booths.find(x => x.id === id);
      const name = prompt('Booth name', booth.name);
      if(name === null) return;
      const location = prompt('Location (optional)', booth.location || '');
      if(location === null) return;
      const { error } = await sb.from('booths')
        .update({ name: name.trim() || booth.name, location: location.trim() || null })
        .eq('id', booth.id);
      if(error){ alert(error.message); return; }
      refresh();
    }
    framesEl.querySelectorAll('[data-rename]').forEach(el => {
      el.onclick = e => { if(isMobile()) return; e.stopPropagation(); renameBooth(el.dataset.rename); };   // on a phone the name just opens/closes the card
    });
    framesEl.querySelectorAll('[data-rename-btn]').forEach(el => {
      el.onclick = () => renameBooth(el.dataset.renameBtn);
    });
    framesEl.querySelectorAll('[data-toggle]').forEach(el => {
      el.onclick = () => {
        if(!isMobile()) return;
        const id = el.dataset.toggle;
        if(openBooths.has(id)) openBooths.delete(id); else openBooths.add(id);
        saveOpen();
        el.closest('.frame').classList.toggle('open', openBooths.has(id));
      };
    });

    framesEl.querySelectorAll('[data-autorestart]').forEach(box => {
      box.onchange = async () => {
        const booth = booths.find(x => x.id === box.dataset.autorestart);
        const { error } = await sb.rpc('update_booth_config', { p_booth_id: booth.id, p_patch: { auto_restart: box.checked } });
        if(error){ alert(error.message); }
        refresh();
      };
    });

    framesEl.querySelectorAll('[data-channel]').forEach(sel => {
      sel.onchange = async () => {
        const { error } = await sb.from('booths').update({ channel: sel.value }).eq('id', sel.dataset.channel);
        if(error){ alert(error.message); }
        refresh();
      };
    });

    framesEl.querySelectorAll('[data-shot]').forEach(btn => {
      btn.onclick = () => requestScreenshot(booths.find(x => x.id === btn.dataset.shot), refresh);
    });

    async function sendCommand(boothId, kind, args){
      const { error } = await sb.rpc('queue_command', { p_booth_id: boothId, p_kind: kind, p_args: args || {} });
      if(error){ alert(error.message); return; }
      refresh();
      setTimeout(refresh, 4000); setTimeout(refresh, 9000); setTimeout(refresh, 20000);   // see the result quickly
    }

    framesEl.querySelectorAll('[data-restart-prog]').forEach(btn => {
      btn.onclick = () => {
        const name = btn.dataset.restartProg;
        if(!confirm(`Restart ${name} on this booth? Anyone using the booth will be interrupted.`)) return;
        sendCommand(btn.dataset.booth, 'restart_program', { program: name });
      };
    });

    framesEl.querySelectorAll('[data-restart-pc]').forEach(btn => {
      btn.onclick = () => {
        const booth = booths.find(x => x.id === btn.dataset.restartPc);
        if(!confirm(`Restart the whole PC for "${booth.name}"? It will restart about 15 seconds after the booth receives this. Anyone using the booth will be interrupted.`)) return;
        sendCommand(booth.id, 'restart_pc', {});
      };
    });

    framesEl.querySelectorAll('[data-closed]').forEach(btn => {
      btn.onclick = async () => {
        const booth = booths.find(x => x.id === btn.dataset.closed);
        const isClosed = !!(booth.config && booth.config.closed);
        let patch;
        if(isClosed){
          patch = { closed: false };
        } else {
          const msg = prompt('Message to show on the booth screen:', (booth.config && booth.config.closed_message) || 'Sorry, this photo booth is closed right now.');
          if(msg === null) return;
          patch = { closed: true, closed_message: msg.trim() };
        }
        const { error } = await sb.rpc('update_booth_config', { p_booth_id: booth.id, p_patch: patch });
        if(error){ alert(error.message); return; }
        refresh();
        setTimeout(refresh, 12000);
      };
    });

    framesEl.querySelectorAll('[data-reset]').forEach(btn => {
      btn.onclick = async () => {
        await sb.rpc('reset_roll', { p_booth_id: btn.dataset.reset });
        refresh();
      };
    });
  }

  refresh();
  pollTimer = setInterval(refresh, 10000); // realtime channel is a nice later upgrade; polling is simple and reliable
}

(async () => {
  let user = null;
  try { const { data } = await sb.auth.getSession(); user = data && data.session ? data.session.user : null; } catch(e){}
  if(user){ currentUser = user; renderDashboard(); }
  else{ renderLogin(); }
})();
</script>
