// One chart: current period in blue, comparison in grey, hover tooltip, and a table view.
function drawBarChart(host, o){
  const n = o.cur.length;
  const hasCmp = !!(o.cmp && o.cmp.length);
  const all = o.cur.concat(hasCmp ? o.cmp : []);
  const fmt = v => fmtMetric(o.metric, v);
  if(!n || all.every(v => !v)){
    host.innerHTML = '<div class="no-data">No figures for this period yet.</div>'; return;
  }
  if(o.table){
    const rows = o.cur.map((v, i) => `<tr><td>${esc(o.curLabels[i])}</td><td class="num">${fmt(v)}</td>${hasCmp ? `<td>${esc(o.cmpLabels[i] || '')}</td><td class="num">${o.cmp[i] != null ? fmt(o.cmp[i]) : ''}</td>` : ''}</tr>`).join('');
    host.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${esc(o.curName)}</th><th class="num">${METRICS[o.metric]}</th>${hasCmp ? `<th>${esc(o.cmpName)}</th><th class="num">${METRICS[o.metric]}</th>` : ''}</tr></thead><tbody>${rows}</tbody></table></div>`;
    return;
  }
  host.innerHTML = `
    <div class="legend"><span><i style="background:var(--accent)"></i>${esc(o.curName)}</span>${hasCmp ? `<span><i style="background:#C3C7CF"></i>${esc(o.cmpName)}</span>` : ''}</div>
    <div class="chart-box"><svg role="img" aria-label="${esc(METRICS[o.metric])} chart"></svg><div class="chart-tip" hidden></div></div>`;
  const box = host.querySelector('.chart-box'), svg = box.querySelector('svg'), tip = box.querySelector('.chart-tip');
  const W = Math.max(280, box.clientWidth || 600), H = W < 520 ? 220 : 260;
  const m = { l: isMoneyMetric(o.metric) ? 56 : 40, r: 6, t: 8, b: 26 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  if(hi === lo) hi = lo + 1;
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const y = v => m.t + ph * (1 - (v - lo) / (hi - lo));
  const y0 = y(0);
  const band = pw / Math.max(n, hasCmp ? o.cmp.length : 0, 1), bw = Math.max(2, Math.min(18, band * (hasCmp ? 0.36 : 0.6)));
  const tickFmt = v => isMoneyMetric(o.metric) ? (Math.abs(v) >= 1000 ? '£' + (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : '£' + Math.round(v)) : String(Math.round(v));
  let g = '';
  for(let v = lo; v <= hi + step / 2; v += step){
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? '#9AA0AA' : '#E1E3E8'}" stroke-width="1"/>`;
    g += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${tickFmt(v)}</text>`;
  }
  const bar = (x, v, fill) => {
    if(!v) return '';
    const yy = y(v), h = Math.abs(yy - y0), r = Math.min(4, h, bw / 2);
    if(h < 0.5) return '';
    return v > 0
      ? `<path d="M${x},${y0} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${y0} Z" fill="${fill}"/>`
      : `<path d="M${x},${y0} V${yy - r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy - r} V${y0} Z" fill="${fill}"/>`;
  };
  const every = Math.max(1, Math.ceil(n / Math.floor(pw / 56)));
  let marks = '', hits = '', labels = '';
  for(let i = 0; i < n; i++){
    const cx = m.l + band * i + band / 2;
    if(hasCmp){
      marks += bar(cx - bw - 1, o.cmp[i], '#C3C7CF') + bar(cx + 1, o.cur[i], '#0078FF');
    } else marks += bar(cx - bw / 2, o.cur[i], '#0078FF');
    if(i % every === 0) labels += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(o.xLabels[i])}</text>`;
    hits += `<rect class="hit" data-i="${i}" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ph}" fill="transparent"/>`;
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
  svg.innerHTML = `${g}<rect id="hl" x="0" y="${m.t}" width="${band}" height="${ph}" fill="#0A0A0B" opacity="0" />${marks}${labels}${hits}`;
  const hl = svg.querySelector('#hl');
  const show = i => {
    hl.setAttribute('x', m.l + band * i); hl.setAttribute('opacity', '0.05');
    const d = hasCmp && o.cmp[i] != null ? o.cur[i] - o.cmp[i] : null;
    tip.innerHTML = `<div>${esc(o.curLabels[i])}: ${fmt(o.cur[i])}</div>`
      + (hasCmp && o.cmpLabels[i] ? `<div class="k">${esc(o.cmpLabels[i])}: ${o.cmp[i] != null ? fmt(o.cmp[i]) : '—'}</div>` : '')
      + (d != null && d !== 0 ? `<div class="k">${d > 0 ? '▲' : '▼'} ${fmt(Math.abs(d))}</div>` : '')
      + (o.extra && o.extra[i] ? `<div class="k">${esc(o.extra[i])}</div>` : '');
    tip.hidden = false;
    const cx = m.l + band * i + band / 2, tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, cx - tw / 2)) + 'px';
    tip.style.top = Math.max(0, y(Math.max(o.cur[i], hasCmp && o.cmp[i] != null ? o.cmp[i] : o.cur[i])) - tip.offsetHeight - 8) + 'px';
  };
  svg.querySelectorAll('.hit').forEach(r => {
    r.addEventListener('pointerenter', () => show(+r.dataset.i));
    r.addEventListener('pointerdown', () => show(+r.dataset.i));
  });
  svg.addEventListener('pointerleave', () => { tip.hidden = true; hl.setAttribute('opacity', '0'); });
}
function niceStep(raw){
  if(!(raw > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}
let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if(view === 'company' && statsCache && window.__redrawCharts) window.__redrawCharts(); }, 200); });


// ═══════════════ Support page (customer fault reports) ═══════════════
let supportFilter = 'open', lastSupportJson = null;
const SUPPORT_STATUS = [['new', 'New'], ['contacted', 'Contacted'], ['resolved', 'Done']];
const SUPPORT_REFUNDS = [['', 'Not decided yet'], ['refunded', 'Full refund'], ['partial_refund', 'Partial refund'], ['no_refund', 'No refund']];
const SUPPORT_RESOLUTIONS = [['', 'Not recorded yet'], ['fixed', 'Fixed'], ['no_fault', 'No fault found'], ['explained', 'Explained to customer'], ['other', 'Other']];

function setSupportBadge(n){
  const el = document.getElementById('support-count');
  if(!el) return;
  el.textContent = n > 99 ? '99+' : String(n); el.hidden = !(n > 0);
}
async function refreshSupportCount(){
  try {
    const { count, error } = await sb.from('support_reports').select('id', { count: 'exact', head: true }).eq('status', 'new');
    if(!error && typeof count === 'number') setSupportBadge(count);
  } catch(e){}
}

async function renderSupportPage(){
  mainEl().innerHTML = `
    <h1 class="page-title">Support</h1>
    <p class="page-sub">Reports from customers who scanned the QR code in a booth. A new report also sends a notification to your phone.</p>
    <div class="company-controls"><div class="seg" role="group" aria-label="Show">
      <button data-sf="open">Open</button><button data-sf="resolved">Done</button><button data-sf="all">All</button></div></div>
    <div id="support-list"><div class="empty">Loading…</div></div>`;
  mainEl().querySelectorAll('[data-sf]').forEach(b => b.onclick = () => { supportFilter = b.dataset.sf; lastSupportJson = null; loadSupport(true); });
  lastSupportJson = null;
  currentRefresh = () => loadSupport(false);
  loadSupport(true);
}

async function loadSupport(force){
  if(view !== 'support') return;
  const list = document.getElementById('support-list');
  if(!list) return;
  if(!force && list.contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;   // do not redraw while typing
  const [{ data, error }, booths] = await Promise.all([
    sb.from('support_reports').select('*').order('created_at', { ascending: false }).limit(300),
    loadBooths()]);
  if(view !== 'support') return;
  if(error){ list.innerHTML = `<div class="empty">Could not load reports: ${esc(error.message)}</div>`; return; }
  boothCache = booths;
  const rows = data || [];
  setSupportBadge(rows.filter(r => r.status === 'new').length);
  const json = JSON.stringify([rows, supportFilter]);
  if(!force && json === lastSupportJson) return;
  lastSupportJson = json;
  mainEl().querySelectorAll('[data-sf]').forEach(b => b.classList.toggle('on', b.dataset.sf === supportFilter));
  const names = Object.fromEntries(booths.map(b => [b.id, b.name]));
  const shown = rows.filter(r => supportFilter === 'all' || (supportFilter === 'open' ? r.status !== 'resolved' : r.status === 'resolved'));
  if(!shown.length){
    list.innerHTML = `<div class="empty">${rows.length ? 'Nothing here.' : 'No reports yet. Print the QR codes from Settings → Support QR codes and put one in each booth.'}</div>`;
    return;
  }
  list.innerHTML = shown.map(r => supportCard(r, names[r.booth_id] || 'Unknown booth')).join('');
  wireSupport(list, rows);
}

const dayTime = iso => new Date(iso).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function supportContext(r){
  const c = r.context || {};
  const hhmm = iso => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const lines = [];
  const near = Array.isArray(c.alerts_around_time_used) ? c.alerts_around_time_used : [];
  if(near.length) near.forEach(a => lines.push(`<div><b>${esc(a.key || a.kind)}</b>: ${esc(a.message)} (from ${hhmm(a.since)}, ${a.resolved ? 'cleared ' + hhmm(a.resolved) : 'still open when reported'})</div>`));
  else lines.push('<div><b>No BoothWatch alerts</b> around the time they used the booth. The booth may have looked healthy.</div>');
  const bad = (Array.isArray(c.programs_now) ? c.programs_now : []).filter(p => p.ok === false);
  if(bad.length) lines.push(`<div>At the time of the report: ${bad.map(p => esc(p.name) + (p.note ? ' (' + esc(p.note) + ')' : '')).join(', ')} not OK.</div>`);
  lines.push(`<div>Booth was ${c.online_now ? 'online' : 'offline'} when the report arrived${c.last_heartbeat_at ? ' (last check-in ' + esc(fmtAgo(c.last_heartbeat_at)) + ' before reading this)' : ''}.</div>`);
  const day = c.that_day || {};
  if(day.sessions != null) lines.push(`<div>That day: ${day.sessions} sessions, ${day.prints} prints.</div>`);
  if(c.paper_left != null) lines.push(`<div>Printer paper left at the time: about ${c.paper_left} pages.</div>`);
  return lines.join('');
}

function supportCard(r, boothName){
  const subject = encodeURIComponent('Your Photo Pronto photobooth report');
  const body = encodeURIComponent(`Hi,\n\nThanks for letting us know about "${r.issue}" at ${boothName} on ${dayTime(r.used_at)}.\n\n`);
  const showRefund = r.outcome === 'refunded' || r.outcome === 'partial_refund';
  return `
  <article class="report ${r.status}" data-rid="${r.id}">
    <div class="rep-head">
      <div style="min-width:0"><div class="rep-issue">${esc(r.issue)}</div>
        <div class="rep-meta">${esc(boothName)} · used ${esc(dayTime(r.used_at))} · reported ${esc(fmtAgo(r.created_at))}</div></div>
      <span class="pill ${r.status === 'new' ? 'alert' : (r.status === 'contacted' ? 'ok' : 'off')}">${esc((SUPPORT_STATUS.find(s => s[0] === r.status) || [0, r.status])[1])}</span>
    </div>
    ${r.details ? `<div class="rep-details">${esc(r.details)}</div>` : ''}
    <div class="rep-contact"><a class="btn-sm" href="mailto:${esc(r.email)}?subject=${subject}&body=${body}">Email ${esc(r.email)}</a></div>
    <details class="rep-ctx"><summary>What BoothWatch saw</summary><div class="ctx">${supportContext(r)}</div></details>
    <div class="rep-edit">
      <label>Status<select data-f="status">${SUPPORT_STATUS.map(([v, n]) => `<option value="${v}" ${r.status === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label>Refund<select data-f="refundtype">${SUPPORT_REFUNDS.map(([v, n]) => `<option value="${v}" ${(r.outcome || '') === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label data-refund ${showRefund ? '' : 'hidden'}>Refund amount<span class="money-in"><i>£</i><input type="number" min="0" step="0.01" data-f="refund" value="${r.refund_amount != null ? esc(r.refund_amount) : ''}"/></span></label>
      <label>Outcome<select data-f="resolution">${SUPPORT_RESOLUTIONS.map(([v, n]) => `<option value="${v}" ${(r.resolution || '') === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="wide">Notes<textarea data-f="notes" placeholder="What you did, what you said">${esc(r.notes || '')}</textarea></label>
    </div>
    <div class="actions"><button class="btn-primary save">Save</button><button class="del" style="margin-left:auto">Delete</button></div>
  </article>`;
}

function wireSupport(list, rows){
  list.querySelectorAll('.report').forEach(card => {
    const id = Number(card.dataset.rid);
    const f = k => card.querySelector(`[data-f="${k}"]`);
    f('refundtype').onchange = () => { card.querySelector('[data-refund]').hidden = !['refunded', 'partial_refund'].includes(f('refundtype').value); };
    card.querySelector('.save').onclick = async e => {
      const btn = e.target; btn.disabled = true;
      const refund = f('refund').value === '' ? null : Number(f('refund').value);
      const { error } = await sb.rpc('update_support_report', { p_id: id, p_status: f('status').value, p_refund_type: f('refundtype').value, p_refund: refund, p_notes: f('notes').value, p_resolution: f('resolution').value });
      btn.disabled = false;
      if(error){ alert(error.message); return; }
      toast('Saved'); lastSupportJson = null; loadSupport(true);
    };
    card.querySelector('.del').onclick = async () => {
      if(!confirm('Delete this report for good?')) return;
      const { error } = await sb.rpc('delete_support_report', { p_id: id });
      if(error){ alert(error.message); return; }
      lastSupportJson = null; loadSupport(true);
    };
  });
}

// ═══════════════ QR codes for the booths ═══════════════
function pageBase(){ return location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, ''); }
function reportLink(boothId){ return pageBase() + 'report.html' + (boothId ? '?b=' + encodeURIComponent(boothId) : ''); }

function loadQrLib(){
  if(window.qrcode) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload = res; s.onerror = () => rej(new Error('Could not load the QR code library. Check your internet connection.'));
    document.head.appendChild(s);
  });
}
function qrSvg(text){
  const q = window.qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = '';
  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) d += `M${c},${r}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
async function printQrSheets(list){
  const w = window.open('', '_blank');
  if(!w){ alert('Your browser blocked the new window. Allow pop-ups for this page and try again.'); return; }
  w.document.write('<p style="font-family:sans-serif">Making your QR codes…</p>');
  try { await loadQrLib(); } catch(e){ w.close(); alert(e.message); return; }
  const logo = pageBase() + 'logo.png';
  const sheets = list.map(b => `
    <section class="sheet">
      <img class="logo" src="${esc(logo)}" alt="Photo Pronto"/>
      <h1>Had a problem?</h1>
      <p>Scan this code and tell us what happened.<br>We'll put it right.</p>
      <div class="qr">${qrSvg(reportLink(b.id))}</div>
      <div class="name">${esc(b.name)}</div>
    </section>`).join('');
  w.document.open();
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Photo Pronto support QR codes</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;800&display=swap" rel="stylesheet">
    <style>
      @page{ size:A4; margin:0 }
      *{ box-sizing:border-box }
      body{ margin:0; font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif; color:#0A0A0B; }
      .sheet{ width:210mm; height:297mm; padding:24mm 20mm; display:flex; flex-direction:column; align-items:center; text-align:center; page-break-after:always; }
      .logo{ height:22mm; margin-bottom:22mm }
      h1{ font-size:30mm; line-height:1; margin:0 0 8mm; font-weight:800; letter-spacing:-.02em }
      p{ font-size:7mm; line-height:1.4; margin:0 0 14mm; font-weight:500 }
      .qr{ width:110mm; height:110mm } .qr svg{ width:100%; height:100% }
      .name{ margin-top:12mm; font-size:8mm; font-weight:800 }
      .bar{ position:fixed; top:10px; right:10px; font-family:sans-serif }
      .bar button{ background:#0078FF; color:#fff; border:0; border-radius:999px; padding:10px 20px; font-weight:700; font-size:14px; cursor:pointer }
      @media print{ .bar{ display:none } }
    </style></head><body><div class="bar"><button onclick="print()">Print</button></div>${sheets}</body></html>`);
  w.document.close();
}

(async () => {
  let user = null;
  try { const { data } = await sb.auth.getSession(); user = data && data.session ? data.session.user : null; } catch(e){}
  if(user){ currentUser = user; renderApp(); }
  else{ renderLogin(); }
})();
