<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');

  /* Layout: white page, light-grey rounded tiles, one blue hero tile, black only for "needs attention". */
  :root{
    --accent: #0078FF;
    --accent-soft: #E5F0FF;
    --ink: #0A0A0B;
    --muted: #6B7078;
    --clock: #9AA0AA;
    --bg: #FFFFFF;
    --tile: #F2F3F5;
    --inner: #FFFFFF;
    --line: #E1E3E8;
    --track: #DDE0E6;
    --display: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family: var(--display); font-weight:600; font-size: 14px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select{ font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  header{
    display:flex; align-items:center; justify-content:space-between; gap:16px 24px; flex-wrap:wrap;
    padding: 24px clamp(16px, 4vw, 48px) 8px; max-width: 1280px; margin: 0 auto;
  }
  .logo{ height: 54px; width:auto; display:block; }
  .head-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pair{ display:flex; gap:8px; }
  .pair input{
    width: 150px; padding: 10px 16px; border-radius: 999px; border:1px solid var(--line); background: var(--tile);
    font-family: var(--mono); font-weight:500; font-size:13px; letter-spacing: 2px; color: var(--ink);
  }
  .pair input::placeholder{ letter-spacing: 0; color: var(--muted); }

  .btn, header button, .controls button, .releases button, .shot-close{
    background: var(--inner); color: var(--ink); border:1px solid var(--line); border-radius: 999px;
    font-weight:600; font-size: 13px; padding: 9px 16px; cursor:pointer;
  }
  .btn:hover, header button:hover, .controls button:hover, .releases button:hover, .shot-close:hover{ border-color: var(--accent); color: var(--accent); }
  #pair-btn{ background: var(--ink); color:#fff; border-color: var(--ink); }
  #pair-btn:hover{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .controls button:disabled{ opacity:.5; cursor:default; color: var(--muted); border-color: var(--line); }
  .controls button.danger:hover{ border-color: var(--ink); background: var(--ink); color:#fff; }

  /* ── notifications bell ── */
  .bell-wrap{ position:relative; }
  .bell{ position:relative; width:42px; height:42px; padding:0 !important; display:inline-flex; align-items:center; justify-content:center; border-radius:50% !important; }
  .bell svg{ width:20px; height:20px; }
  .bell-count{ position:absolute; top:-4px; right:-4px; min-width:20px; height:20px; padding:0 5px; border-radius:999px; background: var(--accent); color:#fff;
    font-family: var(--mono); font-weight:600; font-size:11px; line-height:20px; text-align:center; }
  .notif-panel{ position:absolute; right:0; top: calc(100% + 10px); width: min(420px, calc(100vw - 32px)); max-height: min(560px, calc(100vh - 120px)); overflow:auto;
    background: var(--bg); border:1px solid var(--line); border-radius: 24px; box-shadow: 0 18px 50px rgba(10,10,11,.14); z-index: 20; padding: 8px; }
  .np-head{ display:flex; justify-content:space-between; align-items:center; padding: 12px 12px 8px; font-weight:700; font-size:18px; }
  .np-head button{ font-size:12px !important; padding: 5px 12px !important; }
  .np-push{ margin: 4px; padding: 12px 14px; background: var(--tile); border-radius: 18px; font-size:12px; font-weight:500; line-height:1.5; display:flex; flex-direction:column; gap:10px; }
  .np-push .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .np-push button{ background: var(--inner); border:1px solid var(--line); border-radius:999px; padding: 6px 14px; font-weight:600; font-size:12px; cursor:pointer; }
  .np-push button.primary{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .np-push button:hover{ border-color: var(--ink); }
  .np-list{ display:flex; flex-direction:column; padding: 4px 0; }
  .np-item{ display:flex; gap:12px; padding: 12px; border-radius: 16px; cursor:pointer; }
  .np-item:hover{ background: var(--tile); }
  .np-dot{ flex:none; width:10px; height:10px; border-radius:50%; margin-top:5px; border:1.5px solid var(--track); }
  .np-item.unread .np-dot{ border:none; background: var(--ink); }
  .np-item.unread.info .np-dot{ background: var(--accent); }
  .np-title{ font-weight:600; font-size:14px; line-height:1.3; color: var(--muted); }
  .np-item.unread .np-title{ font-weight:700; color: var(--ink); }
  .np-body{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); margin-top:3px; line-height:1.45; overflow-wrap:anywhere; white-space:pre-line}
  .np-time{ font-family: var(--mono); font-weight:500; font-size:11px; color: var(--muted); margin-top:4px; }
  .np-empty{ padding: 28px 16px; text-align:center; color: var(--muted); font-weight:500; }
  .frame.flash{ outline: 3px solid var(--accent); outline-offset: 2px; transition: outline-color .6s; }

  main{ padding: 8px clamp(16px, 4vw, 48px) 64px; max-width:1280px; margin:0 auto; }

  .nowbar{ display:flex; align-items:center; justify-content:space-between; gap:16px 32px; flex-wrap:wrap; padding: 22px 0 22px; }
  .fleet-checkin{ display:flex; gap: 12px 36px; flex-wrap:wrap; }
  .fleet-checkin .k{ display:block; font-weight:600; font-size:12px; color: var(--muted); margin-bottom:4px; }
  .fleet-checkin b{ font-family: var(--mono); font-weight:600; font-size:15px; font-variant-numeric: tabular-nums; }
  .clockbox{ display:flex; align-items:center; gap:14px; }
  .clock-text{ text-align:right; }
  .title-sub{ font-weight:600; font-size:12px; color: var(--muted); font-family: var(--display); }
  .clock-time{ font-family: var(--mono); font-weight:600; font-size:15px; line-height:1.2; font-variant-numeric: tabular-nums; margin-top:4px; }
  .clock-svg{ width:44px; height:44px; flex:none; }
  .clock-svg .face{ fill:none; stroke: var(--clock); stroke-width:1; }
  .clock-svg .tick{ stroke: var(--clock); stroke-width:1; stroke-linecap:round; }
  .clock-svg .hand, .clock-svg .sec{ stroke: var(--clock); stroke-linecap:round; }
  .clock-svg .pin{ fill: var(--clock); }

  /* ── login ── */
  .login-wrap{ display:flex; justify-content:center; padding: 12vh 16px 0; }
  .login-card{ background: var(--tile); border-radius: 28px; padding: 36px; width: min(380px, 100%); }
  .login-card .logo{ height: 60px; margin-bottom: 28px; }
  .login-card h2{ font-weight:700; font-size: 26px; margin:0 0 4px; letter-spacing:-.01em; }
  .login-card p{ color: var(--muted); font-size: 14px; margin: 0 0 24px; font-weight:500; }
  .login-card input{
    width:100%; padding: 13px 16px; margin-bottom: 10px; border-radius: 14px; border:1px solid var(--line);
    background: var(--inner); color: var(--ink); font-size:14px; font-weight:500;
  }
  .login-card button{
    width:100%; padding: 14px; margin-top: 6px; border-radius: 999px; border:none;
    background: var(--accent); color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  }
  .login-card button:hover{ background: var(--ink); }
  .error{ color: var(--ink); font-size:13px; margin-top:12px; min-height: 1em; font-weight:600; }

  /* ── summary tiles ── */
  .summary{ display:grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .tile{ background: var(--tile); border-radius: 24px; padding: 20px 22px 18px; min-width:0; }
  .tile .tile-label{ font-weight:600; font-size:14px; color: var(--muted); }
  .tile .tile-num{ font-weight:700; font-size: clamp(40px, 5vw, 56px); line-height:1; margin: 18px 0 10px; letter-spacing:-.02em; font-variant-numeric: tabular-nums; }
  .tile .tile-sub{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); }
  .tile.hero{ background: var(--accent); color:#fff; }
  .tile.hero .tile-label, .tile.hero .tile-sub{ color: rgba(255,255,255,.82); }
  .tile.dark{ background: var(--ink); color:#fff; }
  .tile.dark .tile-label, .tile.dark .tile-sub{ color: rgba(255,255,255,.72); }

  /* ── agent versions ── */
  .releases{ margin: 6px 0 28px; }
  .releases summary{ cursor:pointer; padding: 8px 0; font-weight:600; color: var(--muted); }
  .releases summary:hover{ color: var(--accent); }
  .releases .rel-body{ background: var(--tile); border-radius: 24px; padding: 20px; margin-top: 6px; display:flex; flex-direction:column; gap:12px; max-width: 580px; }
  .releases .rel-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .releases b{ font-weight:700; }
  #rel-status{ font-family: var(--mono); font-weight:500; font-size:12px; line-height:1.6; }
  .releases input[type=file]{ font-family: var(--mono); font-size:12px; max-width:100%; color: var(--muted); }
  .rel-help{ font-size:12px; line-height:1.5; color: var(--muted); font-weight:500; }

  /* ── booth cards ── */
  .frames{ display:grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; }
  .frame{ background: var(--tile); border-radius: 28px; padding: 22px; min-width:0; display:flex; flex-direction:column; gap: 14px; }
  .frame-body{ display:flex; flex-direction:column; gap:14px; }
  .frame-mini, .chev{ display:none; }

  .frame-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .frame-top > div:first-child{ flex:1; min-width:0; }
  .frame-top .right{ display:flex; align-items:center; gap:10px; flex:none; }
  .frame-name{ font-weight:700; font-size: 24px; line-height:1.1; letter-spacing:-.01em; overflow-wrap:anywhere; }
  .frame-name.editable{ cursor:pointer; }
  .frame-name.editable:hover{ color: var(--accent); }
  .frame-loc{ color: var(--muted); font-size:13px; margin-top:4px; font-weight:500; }
  .checkin{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); margin-top:6px; line-height:1.6; font-variant-numeric: tabular-nums; }
  .checkin b{ color: var(--ink); font-weight:600; }

  .pill{ flex:none; display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding: 6px 12px; font-size:12px; font-weight:700; white-space:nowrap; }
  .pill::before{ content:""; width:7px; height:7px; border-radius:50%; background: currentColor; }
  .pill.ok{ background: var(--accent); color:#fff; }
  .pill.alert{ background: var(--ink); color:#fff; }
  .pill.off{ background: var(--inner); color: var(--muted); border:1px solid var(--line); }
  .badge-closed{ display:inline-block; vertical-align:middle; margin-left:8px; font-size:11px; font-weight:700; letter-spacing:.04em;
    text-transform:uppercase; color: var(--accent); background: var(--accent-soft); border-radius:999px; padding: 3px 9px; }

  .frame-metrics{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric{ background: var(--inner); border-radius: 18px; padding: 14px 16px; }
  .metric .num{ font-weight:700; font-size: 36px; line-height:1; letter-spacing:-.02em; font-variant-numeric: tabular-nums; }
  .metric .label{ color: var(--muted); font-size:12px; margin-top:6px; font-weight:600; }

  .roll-bar{ height: 10px; background: var(--track); border-radius: 999px; overflow:hidden; }
  .roll-fill{ height:100%; background: var(--accent); border-radius: 999px; }
  .roll-fill.warn, .roll-fill.alert{ background: var(--ink); }
  .roll-label{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:-4px; }
  .roll-label button{ background:none; border:none; color: var(--accent); font-family: var(--display); font-weight:600; font-size:12px; cursor:pointer; padding:0; text-decoration: underline; }

  .programs{ background: var(--inner); border-radius: 18px; padding: 6px 16px; }
  .program{ display:flex; align-items:flex-start; gap:12px; padding: 12px 0; border-bottom:1px solid var(--line); }
  .program:last-child{ border-bottom:none; }
  .program .dot{ width:10px; height:10px; border-radius:50%; margin-top:4px; flex:none; background: var(--accent); }
  .program .dot.alert{ background: var(--ink); }
  .program.stale .dot{ background: var(--track); }
  .program.stale{ color: var(--muted); }
  .program-main{ flex:1; min-width:0; }
  .program-head{ display:flex; justify-content:space-between; gap:10px; font-weight:700; font-size:15px; }
  .program .state{ font-family: var(--mono); font-weight:500; color: var(--muted); font-size:12px; flex:none; padding-top:2px; }
  .program .title{ font-family: var(--mono); font-weight:500; color: var(--muted); font-size:11px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .program .detail{ font-family: var(--mono); font-weight:500; color: var(--muted); font-size:12px; margin-top:4px; line-height:1.4; overflow-wrap:anywhere; }
  .program .detail b{ color: var(--ink); font-weight:600; margin-right:6px; }
  .program .detail.screen{ font-family: var(--display); font-weight:700; color: var(--accent); font-size:18px; margin-top:4px; text-transform: capitalize; }
  .program .detail.screen b{ font-family: var(--mono); font-weight:500; font-size:11px; color: var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-right:8px; }
  .program .note{ display:block; font-size:13px; margin-top:4px; color: var(--ink); font-weight:700; }
  .prog-btn{ margin-top:8px; font-size:11px; font-weight:600; padding: 4px 12px; border-radius:999px; background: var(--tile); border:1px solid var(--line); color: var(--ink); cursor:pointer; }
  .prog-btn:hover{ border-color: var(--accent); color: var(--accent); }
  .prog-btn:disabled{ opacity:.5; cursor:default; color: var(--muted); }

  .controls{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .controls label{ display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; cursor:pointer; margin-right:6px; }
  .controls input[type=checkbox]{ accent-color: var(--accent); width:16px; height:16px; }
  .controls select{ background: var(--inner); color: var(--ink); border:1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size:12px; font-weight:600; }

  .cmd-line{ font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); line-height:1.5; overflow-wrap:anywhere; }
  .cmd-line.bad{ color: var(--ink); font-weight:600; }
  .warn-line{ font-family: var(--mono); font-weight:500; font-size:12px; line-height:1.5; background: var(--inner); border-radius: 12px; padding: 9px 12px; }
  .agent-info{ font-family: var(--mono); font-weight:500; font-size:11px; color: var(--muted); }

  .shot-overlay{ position:fixed; inset:0; background:rgba(10,10,11,.86); z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px; }
  .shot-overlay img{ max-width:100%; max-height:80vh; border-radius: 12px; background:#000; }
  .shot-overlay .shot-meta{ color:#fff; font-family: var(--mono); font-size:12px; }

  .empty{ color: var(--muted); text-align:center; padding: 60px 20px; font-size:14px; background: var(--tile); border-radius: 28px; font-weight:500; }

  @media (max-width: 700px){
    .logo{ height: 46px; margin-right:auto; }
    header{ row-gap:12px; }
    .head-actions{ display:contents; }
    .bell-wrap{ order:1; }
    .pair, #signout{ order:2; }
    .nowbar{ padding: 14px 0 16px; }
    .clockbox{ display:none; }
    .summary{ grid-template-columns: 1fr 1fr; gap:10px; }
    .tile{ padding: 14px 16px; border-radius: 20px; }
    .tile .tile-num{ margin: 10px 0 6px; font-size: 34px; }
    .frames{ gap:10px; }
    .frame{ padding: 16px 18px; border-radius: 24px; gap: 0; }
    .frame-name{ font-size: 19px; }
    .pill{ font-size:11px; padding:5px 10px; }
    .pair input{ width: 130px; }
    .frame-top{ cursor:pointer; align-items:center; }
    .frame-mini{ display:block; font-family: var(--mono); font-weight:500; font-size:12px; color: var(--muted); margin-top:6px; }
    .chev{ display:block; flex:none; width:22px; height:22px; transition: transform .15s; color: var(--muted); }
    .frame.open .chev{ transform: rotate(180deg); }
    .frame:not(.open) .frame-body{ display:none; }
    .frame.open .frame-mini{ display:none; }
    .frame.open .frame-body{ margin-top: 14px; }
    .frame-top .right{ display:flex; align-items:center; gap:10px; }
    .notif-panel{ position:fixed; left:16px; right:16px; width:auto; top: var(--np-top, 120px); max-height: calc(100vh - var(--np-top, 120px) - 16px); }
  }
  @media (prefers-reduced-motion: reduce){ .chev{ transition:none; } }

  /* ── navigation ── */
  .tabs{ display:flex; gap:4px; background: var(--tile); border-radius:999px; padding:4px; }
  .tabs a{ padding: 8px 18px; border-radius:999px; font-weight:700; font-size:14px; color: var(--muted); text-decoration:none; }
  .tabs a:hover{ color: var(--ink); }
  .tabs a.on{ background: var(--ink); color:#fff; }
  .page-title{ font-weight:700; font-size: 32px; letter-spacing:-.02em; margin: 18px 0 4px; }
  .page-sub{ color: var(--muted); font-weight:500; font-size:14px; margin: 0 0 20px; max-width: 640px; line-height:1.5; }

  /* ── compact booth cards ── */
  .stats{ display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .stat{ background: var(--inner); border-radius:16px; padding: 12px 14px; min-width:0; }
  .stat b{ display:block; font-weight:700; font-size:28px; line-height:1; letter-spacing:-.02em; font-variant-numeric: tabular-nums; }
  .stat span{ display:block; color: var(--muted); font-size:12px; margin-top:5px; font-weight:600; }
  .stat.warn b, .stat.alert b{ color: var(--ink); }
  .stat.alert{ background: var(--ink); } .stat.alert b, .stat.alert span{ color:#fff; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; background: var(--inner); border-radius:999px; padding: 5px 11px; font-size:12px; font-weight:600; }
  .chip em{ font-style:normal; color: var(--muted); font-weight:500; }
  .chip.bad{ background: var(--ink); color:#fff; } .chip.bad em{ color: rgba(255,255,255,.7); }
  .chip.stale{ opacity:.55; }
  .chip .dot{ width:8px; height:8px; border-radius:50%; background: var(--accent); display:inline-block; }
  .chip .dot.alert{ background:#fff; }
  .bad-line{ font-family: var(--mono); font-weight:600; font-size:12px; line-height:1.4; }
  .actions{ display:flex; flex-wrap:wrap; gap:8px; }
  .actions button, .controls button, .btn-sm{ background: var(--inner); color: var(--ink); border:1px solid var(--line); border-radius:999px; font-weight:600; font-size:12px; padding: 7px 14px; cursor:pointer; }
  .actions button:hover, .controls button:hover, .btn-sm:hover{ border-color: var(--accent); color: var(--accent); }
  .actions button:disabled, .controls button:disabled{ opacity:.5; cursor:default; color: var(--muted); border-color: var(--line); }
  .actions .more{ margin-left:auto; }
  .actions .more .caret{ display:inline-block; transition: transform .15s; }
  .actions .more.on .caret{ transform: rotate(180deg); }
  .details{ display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--line); padding-top:14px; }
  .details[hidden]{ display:none; }

<body>

<div id="app"></div>
<div id="fatal" style="color:#C05B45;padding:20px;font-family:sans-serif"></div>

<script>
window.addEventListener('error', e => { document.getElementById('fatal').textContent = 'Error: ' + e.message; });
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }   // stays signed in on this browser
});

const app = document.getElementById('app');
let currentUser = null;
let pollTimer = null;

function fmtAgo(iso){
  if(!iso) return "never";
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if(s < 60) return s + "s ago";
  if(s < 3600) return Math.floor(s/60) + "m ago";
  return Math.floor(s/3600) + "h ago";
}

function isOnline(booth){
  if(!booth.last_heartbeat_at) return false;
  return (Date.now() - new Date(booth.last_heartbeat_at).getTime()) < 3 * 60 * 1000; // >3 missed heartbeats = offline
}

function renderLogin(errorMsg){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <img class="logo" src="logo.png" alt="Photo Pronto" />
        <h2>BoothWatch</h2>
        <p>Sign in to see your booths.</p>
        <input id="email" type="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />
        <button id="signin">Sign in</button>
        <div class="error">${errorMsg || ""}</div>
      </div>
    </div>`;
  document.getElementById('signin').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ renderLogin(error.message); return; }
    currentUser = data.user;
    renderDashboard();
  };
}

async function loadBooths(){
  const { data, error } = await sb
    .from('booths')
    .select('*')
    .order('name');
  if(error){ console.error(error); return []; }
  return data;
}

// Text from agents is shown on this page, so always escape it.
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function programList(b){
  return Array.isArray(b.programs) ? b.programs : [];
}

function rollRemaining(b){
  return Math.max(b.roll_capacity - b.prints_since_roll, 0);
}

function needsAttention(b){
  const hrs = b.config && b.config.hours;
  if(hrs && ['auto_close', 'pause_alerts'].includes(hrs.mode) && !inOpeningHours(hrs)) return false;   // not meant to be on right now
  if(!isOnline(b)) return true;
  if(programList(b).some(p => !p.ok)) return true;
  return rollRemaining(b) < b.roll_capacity * 0.15;
}

// ── notifications bell and phone push ──
let notifs = [];
let notifPanelOpen = false;
let pushState = { kind: 'checking' };

async function loadNotifications(){
  const { data, error } = await sb.from('notifications')
    .select('id, booth_id, kind, title, body, severity, created_at, read_at')
    .order('id', { ascending: false }).limit(40);
  if(error){ console.error(error); return notifs; }
  return data;
}

function urlBase64ToUint8Array(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

async function detectPush(){
  if(!CONFIG.VAPID_PUBLIC_KEY){ return { kind: 'off' }; }
  const canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  if(!canPush){
    return isIos && !isStandalone() ? { kind: 'ios-install' } : { kind: 'unsupported' };
  }
  if(Notification.permission === 'denied') return { kind: 'blocked' };
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    let sub = await reg.pushManager.getSubscription();
    if(Notification.permission === 'granted'){
      // Permission is still on but the phone dropped (or the server removed) the
      // subscription: quietly make a new one so the user never has to re-enable.
      if(!sub){
        try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(CONFIG.VAPID_PUBLIC_KEY) }); }
        catch(e){ console.error('resubscribe failed', e); }
      }
      if(sub){
        saveSubscription(sub).catch(console.error);   // always refresh the server's copy
        return { kind: 'on' };
      }
    }
  } catch(e){ console.error(e); return { kind: 'unsupported' }; }
  return { kind: 'ask' };
}

async function saveSubscription(sub){
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push_subscription', {
    p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_label: navigator.userAgent.slice(0, 120)
  });
  if(error) throw new Error(error.message);
}

async function enablePush(){
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ pushState = perm === 'denied' ? { kind: 'blocked' } : { kind: 'ask' }; renderNotifPanel(); return; }
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(CONFIG.VAPID_PUBLIC_KEY) });
    await saveSubscription(sub);
    pushState = { kind: 'on', note: 'Turned on for this device.' };
  } catch(e){
    console.error(e);
    pushState = { kind: 'error', note: e.message || 'Could not turn on notifications.' };
  }
  renderNotifPanel();
}

async function disablePush(){
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub){ await sb.rpc('remove_push_subscription', { p_endpoint: sub.endpoint }); await sub.unsubscribe(); }
    pushState = { kind: 'ask', note: 'Turned off for this device.' };
  } catch(e){ pushState = { kind: 'error', note: e.message }; }
  renderNotifPanel();
}

async function sendTest(){
  const { error } = await sb.rpc('send_test_notification');
  pushState = { kind: 'on', note: error ? error.message : 'Test sent. It should arrive in a few seconds.' };
  renderNotifPanel();
  setTimeout(refreshNotifs, 1500);
}

function pushBlockHtml(){
  const st = pushState, note = st.note ? `<div>${esc(st.note)}</div>` : '';
  switch(st.kind){
    case 'on': return `<div><b>Phone notifications are on</b> for this device.</div>${note}<div class="row"><button data-np="test">Send a test</button><button data-np="off">Turn off</button></div>`;
    case 'ask': return `<div>Get a notification on this device when a booth has a problem.</div>${note}<div class="row"><button class="primary" data-np="on">Turn on notifications</button></div>`;
    case 'ios-install': return `<div><b>On iPhone:</b> tap the Share button, choose <b>Add to Home Screen</b>, then open BoothWatch from your home screen and come back here to turn notifications on.</div>`;
    case 'blocked': return `<div>Notifications are blocked for this site. Allow them in your browser or phone settings, then reload.</div>`;
    case 'unsupported': return `<div>This browser can't receive phone notifications. Alerts still appear in this list.</div>`;
    case 'error': return `<div>${esc(st.note || 'Something went wrong.')}</div><div class="row"><button class="primary" data-np="on">Try again</button></div>`;
    default: return '';
  }
}

function renderNotifPanel(){
  const panel = document.getElementById('notif-panel');

  const pb = pushBlockHtml();
  const items = notifs.map(n => `

      if(a === 'on') await enablePush();

// ── check-in timing, clock, mobile tabs ──
function checkInterval(b){
  const iv = b.config && Number(b.config.interval_seconds);
  return iv >= 15 ? iv : 60;
}
const pad2 = n => String(n).padStart(2, '0');
const hms = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
function secs(n){
  n = Math.max(0, Math.round(n));
  if(n < 60) return n + 's';
  if(n < 3600) return Math.floor(n/60) + 'm ' + pad2(n % 60) + 's';
  if(n < 86400) return Math.floor(n/3600) + 'h ' + pad2(Math.floor(n % 3600 / 60)) + 'm';
  return Math.floor(n/86400) + 'd ' + Math.floor(n % 86400 / 3600) + 'h';
}
let fleetBeats = [];   // [{t, iv}] of every booth, refreshed with the data
const isMobile = () => window.matchMedia('(max-width: 700px)').matches;
const openBooths = new Set((() => { try { return JSON.parse(localStorage.getItem('bw-open') || '[]'); } catch(e){ return []; } })());

function tick(){
  const now = new Date();
  const t = document.getElementById('clock-time');
  if(t){
    t.textContent = hms(now);
    const sec = now.getSeconds() + now.getMilliseconds()/1000, min = now.getMinutes() + sec/60, hr = (now.getHours() % 12) + min/60;
    const set = (id, deg) => { const el = document.getElementById(id); if(el) el.setAttribute('transform', `rotate(${deg} 24 24)`); };
    set('hand-h', hr * 30); set('hand-m', min * 6); set('hand-s', Math.floor(now.getSeconds()) * 6);
  }

  const nowMs = now.getTime();
  const nextText = (lastMs, iv, online) => {
    if(!online) return 'waiting for booth';
    const left = (lastMs + iv*1000 - nowMs) / 1000;
    return left > 0 ? 'in ' + secs(left) : 'due now';
  };
  document.querySelectorAll('[data-hb]').forEach(el => {
    if(!el.dataset.hb){ el.textContent = 'No check-in yet'; return; }
    const last = new Date(el.dataset.hb), iv = Number(el.dataset.iv) || 60;
    el.innerHTML = '';
    for(const line of [`Last ${hms(last)} (${secs((nowMs - last)/1000)} ago)`, `Next ${nextText(last.getTime(), iv, el.dataset.online === '1')}`]){
      const d = document.createElement('div'); d.textContent = line; el.appendChild(d);
    }
  });
  const lastEl = document.getElementById('fleet-last'), nextEl = document.getElementById('fleet-next');
  if(lastEl && nextEl){
    if(!fleetBeats.length){ lastEl.textContent = '—'; nextEl.textContent = '—'; return; }
    const latest = Math.max(...fleetBeats.map(x => x.t));
    lastEl.textContent = `${hms(new Date(latest))} (${secs((nowMs - latest)/1000)} ago)`;
    const live = fleetBeats.filter(x => nowMs - x.t < 3*60*1000);
    const dues = live.map(x => x.t + x.iv*1000).filter(d => d > nowMs);
    nextEl.textContent = !live.length ? '—' : (dues.length ? 'in ' + secs((Math.min(...dues) - nowMs)/1000) : 'due now');
  }
}
// ── opening hours (mirror of the database's booth_in_hours) ──
const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const toMin = t => { const [h, m] = String(t).split(':'); return (+h) * 60 + (+m || 0); };
function parseStamp(s){ return new Date(String(s).trim().replace(' ', 'T').replace(/([+-]\d\d)$/, '$1:00')); }

function inOpeningHours(hours, d = new Date()){
  if(!hours || !['auto_close', 'pause_alerts'].includes(hours.mode)) return true;
  try { if(hours.open_until && parseStamp(hours.open_until) > d) return true; } catch(e){}
  const dow = (d.getDay() + 6) % 7, t = d.getHours() * 60 + d.getMinutes();
  const win = i => { const x = hours.days && hours.days[DAY_KEYS[(i + 7) % 7]]; return Array.isArray(x) && x.length === 2 ? [toMin(x[0]), toMin(x[1])] : null; };
  const today = win(dow);
  if(today){ const [o, c] = today; if(c > o){ if(t >= o && t < c) return true; } else if(t >= o) return true; }
  const prev = win(dow - 1);
  if(prev){ const [o, c] = prev; if(c <= o && t < c) return true; }
  return false;
}

// "Open until 18:00" / "Opens Tue 09:00", or null when the booth has no opening hours.
function hoursSummary(hours, now = new Date()){
  if(!hours || !['auto_close', 'pause_alerts'].includes(hours.mode)) return null;
  const open = inOpeningHours(hours, now);
  const base = Math.ceil(now.getTime() / 900000) * 900000;
  for(let i = 0; i <= 8 * 96; i++){
    const t = new Date(base + i * 900000);
    if(inOpeningHours(hours, t) !== open){
      const sameDay = t.toDateString() === now.toDateString();
      const label = (sameDay ? '' : t.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ') + t.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      return { open, at: t, text: (open ? 'Open until ' : 'Opens ') + label };
    }
  }
  return { open, at: null, text: open ? 'Open' : 'Closed' };
}

// ── screenshots ──
const waitingShots = new Set();
const sleep = ms => new Promise(r => setTimeout(r, ms));

function showShot(data){
  const old = document.getElementById('shot-overlay');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'shot-overlay';
  el.id = 'shot-overlay';
  const taken = new Date(data.taken_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  el.innerHTML = `
    <img alt="Booth screen" src="data:image/jpeg;base64,${data.image_base64}" />
    <div class="shot-meta">${esc(data.booth_name)}, taken at ${esc(taken)}</div>
    <button class="shot-close">Close</button>`;
  el.onclick = e => { if(e.target === el || e.target.classList.contains('shot-close')) el.remove(); };
  document.body.appendChild(el);
}

async function requestScreenshot(booth, refresh){
  waitingShots.add(booth.id);
  refresh();
  try{
    const { data: before } = await sb.from('booth_screenshots').select('taken_at').eq('booth_id', booth.id).maybeSingle();
    const prevTaken = before ? before.taken_at : null;
    const { error } = await sb.rpc('request_screenshot', { p_booth_id: booth.id });
    if(error){ alert(error.message); return; }

    const deadline = Date.now() + 60000;
    while(Date.now() < deadline){
      await sleep(3000);
      const { data } = await sb.from('booth_screenshots').select('taken_at, image_base64').eq('booth_id', booth.id).maybeSingle();
      if(data && data.taken_at !== prevTaken){
        showShot({ ...data, booth_name: booth.name });
        return;
      }
    }
    alert('No screenshot arrived. The booth may be offline, or the agent may need updating.');
  } finally {
    waitingShots.delete(booth.id);
    refresh();
  }
}

function relDate(iso){
  return iso ? new Date(iso).toLocaleString([], { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
}

async function refreshReleases(){
  const el = document.getElementById('rel-status');
  if(!el) return;
  const { data, error } = await sb.rpc('agent_releases_info');
  if(error){ el.textContent = 'Could not load releases: ' + error.message; return; }
  const get = ch => (data || []).find(r => r.channel === ch);
  const line = (label, r) => `<div class="rel-row"><span>${label}</span> <b>${r ? esc(r.version) : 'nothing published'}</b> <span>${r ? esc(relDate(r.published_at)) : ''}</span></div>`;
  el.innerHTML = line('Test channel', get('test')) + line('Live channel', get('live'));

function wireReleases(){
  const file = document.getElementById('rel-file');
  document.getElementById('rel-publish').onclick = async () => {
    const f = file.files[0];
    if(!f){ alert('Choose agent.py first.'); return; }
    const code = await f.text();
    const m = code.match(/^VERSION\s*=\s*"([^"]+)"/m);
    if(!m){ alert('This does not look like agent.py (no VERSION line found).'); return; }
    if(!confirm(`Publish agent ${m[1]} to the TEST channel? Booths set to "test" will update within a few minutes.`)) return;
    const { error } = await sb.rpc('publish_agent', { p_channel: 'test', p_version: m[1], p_code: code });
    if(error){ alert(error.message); return; }
    file.value = '';
    refreshReleases();
  };

    const { error } = await sb.rpc('promote_agent');

    refreshReleases();
  };

}

async function loadTodayCounts(boothIds){
  if(boothIds.length === 0) return {};
  const today = new Date().toLocaleDateString('en-CA');   // YYYY-MM-DD in this computer's time zone
  const { data, error } = await sb
    .from('daily_stats')
    .select('booth_id, sessions, prints')
    .in('booth_id', boothIds)
    .eq('day', today);
  if(error){ console.error(error); return {}; }
  const out = {};
  for(const row of data){
    out[row.booth_id] = { prints_today: row.prints, sessions_today: row.sessions };
  }
  return out;
}

async function loadLastCommands(boothIds){
  if(boothIds.length === 0) return {};
  const { data, error } = await sb
    .from('booth_commands')
    .select('id, booth_id, kind, args, status, result, created_at, completed_at')
    .in('booth_id', boothIds)
    .order('id', { ascending: false })
    .limit(60);
  if(error){ console.error(error); return {}; }
  const out = {};
  for(const row of data){ if(!out[row.booth_id]) out[row.booth_id] = row; }
  return out;
}

async function sendCommand(boothId, kind, args){
  const { error } = await sb.rpc('queue_command', { p_booth_id: boothId, p_kind: kind, p_args: args || {} });
  if(error){ alert(error.message); return; }

function wireBoothCards(framesEl, booths){
  const find = id => booths.find(x => x.id === id);
  framesEl.querySelectorAll('[data-toggle]').forEach(el => {
    el.onclick = () => {
      if(!isMobile()) return;
      const id = el.dataset.toggle;
      if(openBooths.has(id)) openBooths.delete(id); else openBooths.add(id);
      saveOpen();
      el.closest('.frame').classList.toggle('open', openBooths.has(id));
    };
  });
  framesEl.querySelectorAll('[data-details]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.details;
      const box = btn.closest('.frame').querySelector('.details');
      const nowOpen = box.hidden;
      box.hidden = !nowOpen;
      btn.classList.toggle('on', nowOpen); btn.setAttribute('aria-expanded', String(nowOpen));
      if(openDetails.has(id)) openDetails.delete(id); else openDetails.add(id);
      saveDetails();
      lastFramesHtml = null;   // next refresh redraws with the new state
    };
  });
  framesEl.querySelectorAll('[data-shot]').forEach(btn => {
    btn.onclick = () => requestScreenshot(find(btn.dataset.shot), () => { lastFramesHtml = null; refreshBooths(); });
  });
  framesEl.querySelectorAll('[data-restart-prog]').forEach(btn => {
    btn.onclick = () => {
      const name = btn.dataset.restartProg;
      if(!confirm(`Restart ${name} on this booth? Anyone using the booth will be interrupted.`)) return;
      sendCommand(btn.dataset.booth, 'restart_program', { program: name });
    };
  });
  framesEl.querySelectorAll('[data-readpaper]').forEach(btn => {
    btn.onclick = () => { toast('Asking the booth to read the paper left…'); sendCommand(btn.dataset.readpaper, 'read_paper', {}); };
  });
  framesEl.querySelectorAll('[data-restart-pc]').forEach(btn => {
    btn.onclick = () => {
      const booth = find(btn.dataset.restartPc);
      if(!confirm(`Restart the whole PC for "${booth.name}"? It will restart about 15 seconds after the booth receives this. Anyone using the booth will be interrupted.`)) return;
      sendCommand(booth.id, 'restart_pc', {});
    };
  });
  framesEl.querySelectorAll('[data-closed]').forEach(btn => {
    btn.onclick = async () => {
      const booth = find(btn.dataset.closed);
      const isClosed = !!(booth.config && booth.config.closed);
      let patch;
      if(isClosed){
        patch = { closed: false };
      } else {
        const msg = prompt('Message to show on the booth screen:', (booth.config && booth.config.closed_message) || 'Sorry, this photo booth is closed right now.');
        if(msg === null) return;
        patch = { closed: true, closed_message: msg.trim() };
      }
      const { error } = await sb.rpc('update_booth_config', { p_booth_id: booth.id, p_patch: patch });
      if(error){ alert(error.message); return; }
      lastFramesHtml = null; refreshBooths();
      setTimeout(() => { lastFramesHtml = null; refreshBooths(); }, 12000);
    };
  });
  framesEl.querySelectorAll('[data-open-now]').forEach(btn => {
    btn.onclick = async () => {
      const booth = find(btn.dataset.openNow);
      const mid = new Date(); mid.setHours(24, 0, 0, 0);
      const mins = Math.max(15, Math.round((mid - new Date()) / 60000));
      const choice = await askChoice('Open this booth now', [
        { label: 'For 1 hour', value: 60 }, { label: 'For 3 hours', value: 180 },
        { label: 'Until midnight', value: mins }, { label: 'For 24 hours', value: 1440 }]);
      if(!choice) return;
      const until = new Date(Date.now() + choice * 60000).toISOString();
      const { error } = await sb.rpc('update_booth_config', { p_booth_id: booth.id, p_patch: { hours_open_until: until } });
      if(error){ alert(error.message); return; }
      toast('Opening ' + booth.name + '…');
      lastFramesHtml = null; refreshBooths();
      setTimeout(() => { lastFramesHtml = null; refreshBooths(); }, 12000);
    };
  });
  framesEl.querySelectorAll('[data-reset]').forEach(btn => {
    btn.onclick = async () => {
      if(!confirm('Mark the paper roll as replaced? The prints-left counter goes back to a full roll.')) return;
      await sb.rpc('reset_roll', { p_booth_id: btn.dataset.reset });
      lastFramesHtml = null; refreshBooths();
    };
  });
}

      <td data-label="Updates"><select data-bd-channel aria-label="Update channel"><option value="live" ${b.channel === 'live' ? 'selected' : ''}>live</option><option value="test" ${b.channel === 'test' ? 'selected' : ''}>test</option></select></td>
      <td data-label=""><label class="sw" style="display:flex;align-items:center;gap:6px"><input type="checkbox" data-bd-auto ${b.config && b.config.auto_restart ? 'checked' : ''}/> Auto-restart</label></td>
      <td data-label=""><button class="btn-sm" data-bd-save>Save</button></td>
    </tr>`).join('');

  el.innerHTML = `
    <h1 class="page-title">Settings</h1>
    <p class="page-sub">Choose which alerts each booth sends, when each booth is open, and what your sessions cost and earn. Changes reach the booths within a minute.</p>

    ${booths.length ? `
    <div class="scope"><span>Alerts and opening hours apply to</span>
      <select id="scope" aria-label="Which booth">
        <option value="all" ${settingsScope === 'all' ? 'selected' : ''}>All booths (${booths.length})</option>
        ${booths.map(b => `<option value="${esc(b.id)}" ${settingsScope === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
      </select>
      ${many ? `<span class="help" style="margin:0;font-weight:500;font-size:12px">Showing ${esc(first.name)}'s values. Saving sets them on every booth.</span>` : ''}
    </div>

    <section class="panel" id="p-alerts">
      <h2>Alerts and notifications</h2>
      <p class="help">Switch each kind of alert on or off and choose how long a problem must last before you are told. A longer wait means fewer false alarms from short blips.</p>
      ${alertRow('offline', 'Booth offline', 'The booth PC stops checking in (off, no internet, or the agent stopped).', delayCtl('offline'))}
      ${alertRow('software', 'Booth software problem', 'DSLR Remote Pro or MDB Payment is not running, not full screen, or shows an error.', delayCtl('software'))}
      ${alertRow('device', 'Camera or printer problem', 'Camera disconnected, printer off, door open, out of ribbon or paper, print stuck.', delayCtl('device'))}
      ${alertRow('low_prints', 'Low on prints', 'Warn when the roll is nearly used up.', `<span class="after">at <input type="number" min="1" max="90" step="1" data-a-threshold value="${A('low_prints').threshold}" aria-label="Percent of roll left"/> <span class="unit">% left</span></span>`)}
      ${alertRow('out_of_prints', 'Out of prints', 'The roll has run out.', '')}
      ${alertRow('command_failed', 'A button press fails', 'Restart, screenshot or paper read did not work on the booth.', '')}
      <div class="set-row">
        <div><div class="name">Mute everything</div><div class="desc">No alerts or phone notifications at all. Good for a test booth or one that is put away.</div></div>
        <div class="set-ctl"><label class="sw"><input type="checkbox" id="a-muted" ${cfg.alerts_muted ? 'checked' : ''}/> Muted</label></div>
      </div>
      <div class="save-row"><button class="btn-primary" id="save-alerts">Save alerts</button><span class="save-msg" id="msg-alerts"></span></div>
    </section>

    <section class="panel" id="p-hours">
      <h2>Opening hours</h2>
      <p class="help">Tell BoothWatch when each booth is meant to be on. Times are the booth's own clock (UK).</p>
      <label class="mode"><input type="radio" name="hmode" value="none" ${mode === 'none' ? 'checked' : ''}/><div><b>Always on</b><span>No schedule. Alerts any time of day.</span></div></label>
      <label class="mode"><input type="radio" name="hmode" value="pause_alerts" ${mode === 'pause_alerts' ? 'checked' : ''}/><div><b>Only pause alerts outside opening hours</b><span>The booth stays as it is, but you are not alerted about it when it is meant to be off.</span></div></label>
      <label class="mode"><input type="radio" name="hmode" value="auto_close" ${mode === 'auto_close' ? 'checked' : ''}/><div><b>Close and open by itself</b><span>Outside opening hours the closed screen shows and the card machine is switched off. It opens again at the next opening time.</span></div></label>
      <div id="week-wrap" ${mode === 'none' ? 'style="opacity:.4;pointer-events:none"' : ''}>
        <div class="week">${days}</div>
        <div class="save-row" style="margin-top:12px"><button class="btn-sm" id="copy-mon">Copy Monday to every day</button></div>
      </div>
      <div class="save-row"><button class="btn-primary" id="save-hours">Save opening hours</button><span class="save-msg" id="msg-hours"></span></div>
    </section>

    <section class="panel" id="p-money">
      <h2>Prices and costs</h2>
      <p class="help">Used by the Company page to work out sales and profit. Sales are sessions × price per session. Costs are prints × cost per print, plus card fees, plus the monthly running cost (spread evenly over each day). Changes apply to all dates, past and future.</p>
      <div class="tbl-wrap"><table class="tbl stack">
        <thead><tr><th>Booth</th><th>Price per session</th><th>Cost per print</th><th>Running cost per month</th><th>Card fee</th></tr></thead>
        <tbody>${moneyRows}</tbody></table></div>
      <div class="save-row"><button class="btn-primary" id="save-money">Save prices and costs</button>${booths.length > 1 ? '<button class="btn-sm" id="copy-money">Copy first booth to all</button>' : ''}<span class="save-msg" id="msg-money"></span></div>
    </section>

    <section class="panel" id="p-booths">
      <h2>Booth details</h2>
      <p class="help">Name, location, and whether a booth is <b>live</b> or in <b>build</b> (being set up or tested, so its sessions and prints are left out of the Company page). "Test" booths get new agent versions first. Auto-restart brings crashed booth software back by itself.</p>
      <div class="tbl-wrap"><table class="tbl stack"><tbody>${detailRows}</tbody></table></div>
    </section>

    <section class="panel" id="p-watch">
      <h2>What each booth watches</h2>
      <p class="help">Untick anything a booth does not have, or cannot be checked on, such as a thermal printer, a webcam or no card machine. BoothWatch then ignores it: no alerts and nothing shown on the card. Takes effect within a minute on agent 0.8.2 or newer.</p>
      <div class="tbl-wrap"><table class="tbl stack">
        <thead><tr><th>Booth</th><th>Printer</th><th>Camera</th><th>Payment software (MDB)</th></tr></thead>
        <tbody>${booths.map(b => { const w = (b.config && b.config.watch) || {}; const on = k => w[k] === false ? '' : 'checked'; return `<tr data-watch="${esc(b.id)}"><td>${esc(b.name)}</td>
          <td data-label="Printer"><input type="checkbox" data-w="printer" ${on('printer')} aria-label="Watch printer on ${esc(b.name)}"/></td>
          <td data-label="Camera"><input type="checkbox" data-w="camera" ${on('camera')} aria-label="Watch camera on ${esc(b.name)}"/></td>
          <td data-label="Payment software"><input type="checkbox" data-w="payment" ${on('payment')} aria-label="Watch payment software on ${esc(b.name)}"/></td></tr>`; }).join('')}</tbody></table></div>
      <div class="save-row"><button class="btn-primary" id="save-watch">Save</button><span class="save-msg" id="msg-watch"></span></div>
    </section>` : ''}

    <section class="panel" id="p-add">
      <h2>Add a booth</h2>
      <p class="help">Installing on a new booth PC takes one paste.</p>
      <ol class="steps">
        <li>On the booth PC, right-click the Start button and choose <b>Terminal (Admin)</b> or <b>Windows PowerShell (Admin)</b>.</li>
        <li>Paste this and press Enter. It installs everything and shows a 6-character pairing code.</li>
      </ol>
      <div class="cmd-box"><code id="inst-cmd">${esc(cmd)}</code><button class="btn-sm" id="copy-cmd">Copy</button></div>
      <p class="help" style="margin-bottom:14px">Prefer a file? <a href="${esc(installBase() + 'BoothWatch-Install.bat')}" download>Download the installer</a>, copy it to the booth PC and double-click it.</p>
      <ol class="steps" start="3"><li>Type the code here:</li></ol>
      <div class="save-row" style="margin-top:0">
        <input type="text" id="pairing-code" placeholder="Pairing code" maxlength="6" autocomplete="off" style="font-family:var(--mono);letter-spacing:2px;width:160px" aria-label="Pairing code from a new booth"/>
        <button class="btn-primary" id="pair-btn">Add booth</button><span class="save-msg" id="msg-pair"></span>
      </div>
    </section>

    <section class="panel" id="p-form">
      <h2>Support form</h2>
      <p class="help">The wording customers see after scanning a QR code. Changes go live as soon as you save. A choice called exactly <b>Other</b> opens a box where the customer describes the problem.</p>
      <label class="fld"><span>Text under the heading</span><textarea id="sf-intro" maxlength="600">${esc(supportForm.intro || DEFAULT_INTRO)}</textarea></label>
      <div class="fld"><span>"What happened?" choices</span><div id="issue-list"></div>
        <div class="save-row" style="margin-top:8px"><button class="btn-sm" id="issue-add">Add a choice</button><button class="btn-sm" id="issue-reset">Reset to the original list</button></div></div>
      <div class="set-row"><div><div class="name">Ask when they used the booth</div><div class="desc">Date and time questions. Helps match the report to what BoothWatch saw.</div></div><div class="set-ctl"><label class="sw"><input type="checkbox" id="sf-when" ${supportForm.ask_when === false ? '' : 'checked'}/> On</label></div></div>
      <div class="set-row"><div><div class="name">Show "Anything else we should know?"</div><div class="desc">An optional free-text box.</div></div><div class="set-ctl"><label class="sw"><input type="checkbox" id="sf-more" ${supportForm.ask_more === false ? '' : 'checked'}/> On</label></div></div>
      <p class="help" style="margin-top:6px">Always asked: which booth (set by the QR code) and the customer's email.</p>
      <div class="save-row"><button class="btn-primary" id="sf-save">Save form</button><a class="btn-sm" style="text-decoration:none" href="${esc(reportLink(''))}" target="_blank" rel="noopener">Preview form</a><span class="save-msg" id="msg-sf"></span></div>
    </section>

    ${booths.length ? `<section class="panel" id="p-qr">
      <h2>Support QR codes</h2>
      <p class="help">Customers scan the code in the booth and fill in a short form. You get the report on the Support tab and a notification on your phone. Each code is tied to one booth, so make sure the booth names here match the venue names customers will see.</p>
      <div class="tbl-wrap"><table class="tbl stack"><tbody>${booths.map(b => `<tr><td>${esc(b.name)}</td>
        <td data-label=""><button class="btn-sm" data-qr-print="${esc(b.id)}">Print QR code</button></td>
        <td data-label=""><a class="btn-sm" style="text-decoration:none;display:inline-block" href="${esc(reportLink(b.id))}" target="_blank" rel="noopener">Open form</a></td>
        <td data-label=""><button class="btn-sm" data-qr-copy="${esc(b.id)}">Copy link</button></td></tr>`).join('')}</tbody></table></div>
      <div class="save-row"><button class="btn-primary" id="qr-print-all">Print all QR codes</button><span class="save-msg" style="font-weight:500">Opens a print page, one A4 sheet per booth. Choose "Save as PDF" to keep a copy.</span></div>
    </section>` : ''}

    <section class="panel" id="p-agent">
      <h2>Agent versions</h2>
      <p class="help">New versions go to the test channel first. Booths set to "test" update within a few minutes. Once it works, promote it so booths on "live" get it too.</p>
      <div class="releases-in">
        <div id="rel-status">Loading…</div>
        <div class="rel-row"><input type="file" id="rel-file" accept=".py" /><button id="rel-publish">Publish to test</button></div>
        <div class="rel-row"><button id="rel-promote">Promote test to live</button></div>
      </div>
    </section>

    <section class="panel" id="p-morning">
      <h2>Morning check</h2>
      <p class="help">One notification each morning: whether every booth is online, any open alerts, and yesterday's sessions, prints and takings. If it ever doesn't arrive, phone notifications need turning back on.</p>
      <div class="set-row"><div><div class="name">Send the morning check</div><div class="desc">Booths marked "build" are left out.</div></div>
        <div class="set-ctl ${morningPrefs.enabled ? '' : 'off'}">
          <span class="after">at <select id="mc-hour" aria-label="Hour to send">${Array.from({length: 24}, (_, h) => `<option value="${h}" ${h === morningPrefs.hour ? 'selected' : ''}>${String(h).padStart(2, '0')}:00</option>`).join('')}</select> <span class="unit">UK time</span></span>
          <label class="sw"><input type="checkbox" id="mc-on" ${morningPrefs.enabled ? 'checked' : ''}/> On</label></div></div>
      <div class="save-row"><button class="btn-primary" id="mc-save">Save</button><span class="save-msg" id="msg-mc"></span></div>
    </section>

    <section class="panel" id="p-prefs">
      <h2>This dashboard</h2>
      <p class="help">Saved in this browser only, so your phone and computer can differ.</p>
      <div class="set-row"><div><div class="name">Page to open first</div></div><div class="set-ctl"><select id="pref-start"><option value="booths">Booths</option><option value="company">Company</option><option value="settings">Settings</option></select></div></div>
      <div class="set-row"><div><div class="name">Show the clock</div><div class="desc">The date and clock at the top of the Booths page.</div></div><div class="set-ctl"><label class="sw"><input type="checkbox" id="pref-clock" ${prefs.showClock ? 'checked' : ''}/> On</label></div></div>
      <div class="set-row"><div><div class="name">Open booth details by default</div><div class="desc">Show the full program list and extra buttons on every card.</div></div><div class="set-ctl"><label class="sw"><input type="checkbox" id="pref-details" ${prefs.openDetails ? 'checked' : ''}/> On</label></div></div>
      <div class="set-row"><div><div class="name">Refresh every</div><div class="desc">How often the Booths page asks for fresh data.</div></div><div class="set-ctl"><select id="pref-refresh"><option value="10">10 seconds</option><option value="30">30 seconds</option><option value="60">1 minute</option></select></div></div>
    </section>`;

  wireSettings(booths, targets);
  document.getElementById('pref-start').value = prefs.startPage;
  document.getElementById('pref-refresh').value = String(prefs.refreshSeconds || 10);
}

function wireSettings(booths, targets){
  const $ = id => document.getElementById(id);
  const msg = (id, text, bad) => { const m = $(id); if(m){ m.textContent = text; m.style.color = bad ? 'var(--ink)' : 'var(--accent)'; clearTimeout(m._t); if(text) m._t = setTimeout(() => { m.textContent = ''; }, 4000); } };
  const saveToAll = async (list, patchFor) => {
    for(const b of list){
      const { error } = await sb.rpc('update_booth_config', { p_booth_id: b.id, p_patch: patchFor(b) });
      if(error) throw error;
    }
  };
  const refreshCache = async () => { boothCache = await loadBooths(); };

  if($('scope')) $('scope').onchange = e => { settingsScope = e.target.value; drawSettings(); };

  // alerts
  document.querySelectorAll('[data-a-on]').forEach(box => {
    box.onchange = () => box.closest('.set-ctl').classList.toggle('off', !box.checked);
  });
  if($('save-alerts')) $('save-alerts').onclick = async () => {
    const alerts = {};
    for(const kind of ['offline', 'software', 'device', 'low_prints', 'out_of_prints', 'command_failed']){
      const o = { on: document.querySelector(`[data-a-on="${kind}"]`).checked };
      const d = document.querySelector(`[data-a-delay="${kind}"]`);
      if(d && d.value !== '') o.delay = Number(d.value);
      if(kind === 'low_prints'){ const t = document.querySelector('[data-a-threshold]'); if(t && t.value !== '') o.threshold = Number(t.value); }
      alerts[kind] = o;
    }
    const patch = { alerts, alerts_muted: $('a-muted').checked };
    $('save-alerts').disabled = true;
    try { await saveToAll(targets(), () => patch); await refreshCache(); msg('msg-alerts', 'Saved'); }
    catch(e){ msg('msg-alerts', e.message, true); }
    $('save-alerts').disabled = false;
  };

  // hours
  const radios = () => [...document.querySelectorAll('input[name=hmode]')];
  radios().forEach(r => r.onchange = () => {
    const none = radios().find(x => x.checked).value === 'none';
    $('week-wrap').style.opacity = none ? '.4' : ''; $('week-wrap').style.pointerEvents = none ? 'none' : '';
  });
  document.querySelectorAll('[data-h-open]').forEach(box => {
    box.onchange = () => document.querySelector(`[data-h-times="${box.dataset.hOpen}"]`).classList.toggle('off', !box.checked);
  });
  if($('copy-mon')) $('copy-mon').onclick = () => {
    const open = document.querySelector('[data-h-open="mon"]').checked;
    const from = document.querySelector('[data-h-from="mon"]').value, to = document.querySelector('[data-h-to="mon"]').value;
    DAY_KEYS.forEach(k => {
      const box = document.querySelector(`[data-h-open="${k}"]`);
      box.checked = open;
      document.querySelector(`[data-h-from="${k}"]`).value = from; document.querySelector(`[data-h-to="${k}"]`).value = to;
      document.querySelector(`[data-h-times="${k}"]`).classList.toggle('off', !open);
    });
  };
  if($('save-hours')) $('save-hours').onclick = async () => {
    const mode = radios().find(x => x.checked).value;
    const days = {};
    for(const k of DAY_KEYS){
      const open = document.querySelector(`[data-h-open="${k}"]`).checked;
      const from = document.querySelector(`[data-h-from="${k}"]`).value, to = document.querySelector(`[data-h-to="${k}"]`).value;
      if(open && (!from || !to)){ msg('msg-hours', 'Fill in the opening and closing time for ' + DAY_NAMES[DAY_KEYS.indexOf(k)], true); return; }
      days[k] = open ? [from, to] : null;
    }
    if(mode !== 'none' && !Object.values(days).some(Boolean)){ msg('msg-hours', 'Tick at least one open day, or choose "Always on".', true); return; }
    $('save-hours').disabled = true;
    try { await saveToAll(targets(), () => ({ hours: { mode, days } })); await refreshCache(); msg('msg-hours', 'Saved'); }
    catch(e){ msg('msg-hours', e.message, true); }
    $('save-hours').disabled = false;
  };

  // money
  const readMoney = tr => {
    const o = {};
    tr.querySelectorAll('[data-m]').forEach(i => { o[i.dataset.m] = i.value === '' ? 0 : Number(i.value); });
    return o;
  };
  if($('copy-money')) $('copy-money').onclick = () => {
    const rows = [...document.querySelectorAll('[data-money]')];
    rows.slice(1).forEach(tr => rows[0].querySelectorAll('[data-m]').forEach(i => { tr.querySelector(`[data-m="${i.dataset.m}"]`).value = i.value; }));
    msg('msg-money', 'Copied. Press Save to keep it.');
  };
  if($('save-money')) $('save-money').onclick = async () => {
    $('save-money').disabled = true;
    try {
      for(const tr of document.querySelectorAll('[data-money]')){
        const { error } = await sb.rpc('update_booth_config', { p_booth_id: tr.dataset.money, p_patch: { money: readMoney(tr) } });
        if(error) throw error;
      }
      await refreshCache(); msg('msg-money', 'Saved');
    } catch(e){ msg('msg-money', e.message, true); }
    $('save-money').disabled = false;
  };

  // booth details
  document.querySelectorAll('[data-bd]').forEach(tr => {
    tr.querySelector('[data-bd-save]').onclick = async e => {
      const id = tr.dataset.bd, btn = e.target, b = booths.find(x => x.id === id);
      btn.disabled = true;
      const name = tr.querySelector('[data-bd-name]').value.trim() || b.name;
      const location = tr.querySelector('[data-bd-loc]').value.trim() || null;
      const channel = tr.querySelector('[data-bd-channel]').value;
      const r1 = await sb.from('booths').update({ name, location, channel }).eq('id', id);
      const r2 = await sb.rpc('update_booth_config', { p_booth_id: id, p_patch: { auto_restart: tr.querySelector('[data-bd-auto]').checked, stage: tr.querySelector('[data-bd-stage]').value } });
      btn.disabled = false;
      if(r1.error || r2.error){ alert((r1.error || r2.error).message); return; }
      await refreshCache(); toast('Saved ' + name);
    };
  });

  // what to watch
  if($('save-watch')) $('save-watch').onclick = async () => {
    $('save-watch').disabled = true;
    try {
      for(const tr of document.querySelectorAll('[data-watch]')){
        const w = {}; tr.querySelectorAll('[data-w]').forEach(i => { w[i.dataset.w] = i.checked; });
        const { error } = await sb.rpc('update_booth_config', { p_booth_id: tr.dataset.watch, p_patch: { watch: w } });
        if(error) throw error;
      }
      await refreshCache(); msg('msg-watch', 'Saved');
    } catch(e){ msg('msg-watch', e.message, true); }
    $('save-watch').disabled = false;
  };

  // support form editor
  let issuesDraft = (Array.isArray(supportForm.issues) && supportForm.issues.length ? supportForm.issues : DEFAULT_ISSUES).slice();
  const drawIssues = () => {
    const box = $('issue-list'); if(!box) return;
    box.innerHTML = issuesDraft.map((t, i) => `<div class="issue-row"><input type="text" maxlength="120" value="${esc(t)}" data-i="${i}" aria-label="Choice ${i + 1}"/>
      <button class="btn-sm" data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button>
      <button class="btn-sm" data-down="${i}" ${i === issuesDraft.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button>
      <button class="btn-sm" data-rm="${i}">Remove</button></div>`).join('');
    box.querySelectorAll('input[data-i]').forEach(inp => inp.oninput = () => { issuesDraft[+inp.dataset.i] = inp.value; });
    box.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; [issuesDraft[i - 1], issuesDraft[i]] = [issuesDraft[i], issuesDraft[i - 1]]; drawIssues(); });
    box.querySelectorAll('[data-down]').forEach(b => b.onclick = () => { const i = +b.dataset.down; [issuesDraft[i + 1], issuesDraft[i]] = [issuesDraft[i], issuesDraft[i + 1]]; drawIssues(); });
    box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { issuesDraft.splice(+b.dataset.rm, 1); drawIssues(); });
  };
  drawIssues();
  if($('issue-add')) $('issue-add').onclick = () => { issuesDraft.push(''); drawIssues(); const ins = $('issue-list').querySelectorAll('input'); ins[ins.length - 1].focus(); };
  if($('issue-reset')) $('issue-reset').onclick = () => { issuesDraft = DEFAULT_ISSUES.slice(); $('sf-intro').value = DEFAULT_INTRO; drawIssues(); };
  if($('sf-save')) $('sf-save').onclick = async () => {
    const issues = issuesDraft.map(t => t.trim()).filter(Boolean);
    if(!issues.length){ msg('msg-sf', 'Add at least one choice.', true); return; }
    $('sf-save').disabled = true;
    const { error } = await sb.rpc('save_support_settings', { p_issues: issues, p_intro: $('sf-intro').value, p_ask_when: $('sf-when').checked, p_ask_more: $('sf-more').checked });
    $('sf-save').disabled = false;
    if(error){ msg('msg-sf', error.message, true); return; }
    issuesDraft = issues; drawIssues(); supportForm = { issues, intro: $('sf-intro').value, ask_when: $('sf-when').checked, ask_more: $('sf-more').checked };
    msg('msg-sf', 'Saved. The form is updated.');
  };

  // support QR codes
  document.querySelectorAll('[data-qr-print]').forEach(b => b.onclick = () => printQrSheets(booths.filter(x => x.id === b.dataset.qrPrint)));
  document.querySelectorAll('[data-qr-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(reportLink(b.dataset.qrCopy)); toast('Link copied'); } catch(e){ prompt('Copy this link', reportLink(b.dataset.qrCopy)); }
  });
  if($('qr-print-all')) $('qr-print-all').onclick = () => printQrSheets(booths);

  // add booth
  if($('copy-cmd')) $('copy-cmd').onclick = async () => {
    try { await navigator.clipboard.writeText($('inst-cmd').textContent); toast('Copied. Paste it on the booth PC.'); }

const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = fromYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const spanDays = (a, b) => Math.round((fromYmd(b) - fromYmd(a)) / 864e5) + 1;
const monthDays = s => { const d = fromYmd(s); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const shiftYear = (s, n) => { const d = fromYmd(s); d.setFullYear(d.getFullYear() + n); return ymd(d); };
const monthStart = (s, n = 0) => { const d = fromYmd(s); return ymd(new Date(d.getFullYear(), d.getMonth() + n, 1)); };
const monthEnd = s => ymd(new Date(fromYmd(s).getFullYear(), fromYmd(s).getMonth() + 1, 0));
const fmtDay = s => fromYmd(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtShort = s => fromYmd(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmtMonth = s => fromYmd(s).toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
const fmtRange = ([a, b]) => a === b ? fromYmd(a).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
  : `${fmtShort(a)} – ${fromYmd(b).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}`;

const PERIODS = [
  ['today', 'Today'], ['yesterday', 'Yesterday'], ['week', 'This week'], ['lastweek', 'Last week'],
  ['month', 'This month'], ['lastmonth', 'Last month'], ['last30', 'Last 30 days'], ['year', 'This year'], ['lastyear', 'Last year'], ['custom', 'Custom dates…'],
];
function periodRange(key, custom){
  const today = ymd(new Date()), t = fromYmd(today);
  const monday = addDays(today, -((t.getDay() + 6) % 7));
  switch(key){
    case 'today': return [today, today];
    case 'yesterday': { const y = addDays(today, -1); return [y, y]; }
    case 'week': return [monday, today];
    case 'lastweek': return [addDays(monday, -7), addDays(monday, -1)];
    case 'month': return [monthStart(today), today];
    case 'lastmonth': { const s = monthStart(today, -1); return [s, monthEnd(s)]; }
    case 'last30': return [addDays(today, -29), today];
    case 'year': return [t.getFullYear() + '-01-01', today];
    case 'lastyear': return [(t.getFullYear() - 1) + '-01-01', (t.getFullYear() - 1) + '-12-31'];
    default: {
      const a = custom && custom[0] || today, b = custom && custom[1] || today;
      return a <= b ? [a, b] : [b, a];
    }
  }
}
function compareRange(mode, key, [f, t], custom){
  if(mode === 'none') return null;
  if(mode === 'custom'){ const a = custom && custom[0], b = custom && custom[1]; return a && b ? (a <= b ? [a, b] : [b, a]) : null; }
  if(mode === 'yoy') return [shiftYear(f, -1), shiftYear(t, -1)];
  const n = spanDays(f, t);
  if(key === 'month' || key === 'lastmonth'){ const ps = monthStart(f, -1); return [ps, addDays(ps, Math.min(n, monthDays(ps)) - 1)]; }
  if(key === 'year' || key === 'lastyear') return [shiftYear(f, -1), shiftYear(t, -1)];
  return [addDays(f, -n), addDays(f, -1)];
}

let companyState = (() => { try { return { period: 'month', compare: 'prev', metric: 'profit', customFrom: '', customTo: '', cmpFrom: '', cmpTo: '', ...JSON.parse(localStorage.getItem('bw-company') || '{}') }; } catch(e){ return { period: 'month', compare: 'prev', metric: 'profit', customFrom: '', customTo: '', cmpFrom: '', cmpTo: '' }; } })();

async function loadStatsRows(since){
  let all = [], from = 0;
  for(;;){
    const { data, error } = await sb.from('daily_stats').select('booth_id, day, sessions, prints').gte('day', since).order('day').order('booth_id').range(from, from + 999);
    if(error) throw error;
    all = all.concat(data);
    if(data.length < 1000) break;
    from += 1000;
  }
  return all;
}

// Sales, costs and profit for a date range. Prices and costs are each booth's current settings.
function computeRange(rows, booths, [f, t], bucket, refunds){
  const today = ymd(new Date());
  const end = t > today ? today : t;
  const byKey = new Map(rows.map(r => [r.booth_id + '|' + r.day, r]));
  const per = {}, buckets = new Map();
  const zero = () => ({ sessions: 0, prints: 0, sales: 0, printCost: 0, fees: 0, running: 0, costs: 0, refunds: 0, refundCount: 0, profit: 0 });
  const add = (o, x) => { for(const k in x) o[k] += x[k]; };
  let missing = false;
  for(const b of booths){
    const m = (b.config && b.config.money) || {};
    const price = Number(m.price) || 0, cpp = Number(m.cost_per_print) || 0, monthly = Number(m.monthly_cost) || 0, fee = Number(m.card_fee_pct) || 0;
    if(!price) missing = true;
    const startDay = b.created_at ? ymd(new Date(b.created_at)) : '0000-00-00';
    per[b.id] = zero();
    for(let d = f; d <= end; d = addDays(d, 1)){
      const r = byKey.get(b.id + '|' + d);
      const sessions = r ? r.sessions : 0, prints = r ? r.prints : 0;
      const sales = sessions * price, printCost = prints * cpp, fees = sales * fee / 100;
      const running = (d >= startDay || r) ? monthly / monthDays(d) : 0;
      const x = { sessions, prints, sales, printCost, fees, running, costs: printCost + fees + running, profit: sales - (printCost + fees + running) };
      add(per[b.id], x);
      const key = bucket === 'month' ? d.slice(0, 7) : d;
      if(!buckets.has(key)) buckets.set(key, { key, day: d, ...zero() });
      add(buckets.get(key), x);
    }
  }
  // make sure days with no data still appear (a booth list that is empty gives no buckets)
  for(let d = f; d <= end; d = addDays(d, 1)){
    const key = bucket === 'month' ? d.slice(0, 7) : d;
    if(!buckets.has(key)) buckets.set(key, { key, day: d, ...zero() });
  }
  // Refunds you have recorded on Support reports, counted on the day the customer used the booth
  for(const r of (refunds || [])){
    const d = ymd(new Date(r.used_at));
    if(!per[r.booth_id] || d < f || d > end) continue;
    const amt = Number(r.refund_amount) || 0;
    const key = bucket === 'month' ? d.slice(0, 7) : d;
    const bk = buckets.get(key);
    for(const o of [per[r.booth_id], bk]){ if(o){ o.refunds += amt; o.refundCount += 1; o.profit -= amt; } }
  }
  const totals = zero();
  Object.values(per).forEach(p => add(totals, p));
  return { per, totals, buckets: [...buckets.values()].sort((a, b) => a.key < b.key ? -1 : 1), missing };
}

const METRICS = { sales: 'Sales', costs: 'Costs', refunds: 'Refunds', profit: 'Profit', sessions: 'Sessions', prints: 'Prints' };
const isMoneyMetric = m => ['sales', 'costs', 'refunds', 'profit'].includes(m);
const fmtMetric = (m, v) => isMoneyMetric(m) ? money(v) : String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

function deltaText(metric, cur, prev, label){
  if(prev == null) return '';
  const diff = cur - prev;
  const pct = prev !== 0 ? Math.round(100 * diff / Math.abs(prev)) : null;
  const arrow = diff > 0 ? '▲' : (diff < 0 ? '▼' : '=');
  const amount = isMoneyMetric(metric) ? money(Math.abs(diff)) : fmtMetric(metric, Math.abs(diff));
  return `<div class="delta"><b>${arrow} ${diff === 0 ? 'no change' : amount}${pct != null && diff !== 0 ? ` (${pct > 0 ? '+' : ''}${pct}%)` : ''}</b> vs ${esc(label)}</div>`;
}

async function renderCompanyPage(){

  const cur = periodRange(S.period, [S.customFrom, S.customTo]);
  const cmp = compareRange(S.compare, S.period, cur, [S.cmpFrom, S.cmpTo]);

  }).join('');
  const dTotal = TB ? T.profit - TB.profit : null;

  body.innerHTML = `
    <div class="company-controls">
      <label>Period<select id="c-period">${PERIODS.map(([k, n]) => `<option value="${k}" ${S.period === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      ${S.period === 'custom' ? `<label>From<input type="date" id="c-from" value="${esc(S.customFrom || cur[0])}"/></label><label>To<input type="date" id="c-to" value="${esc(S.customTo || cur[1])}"/></label>` : ''}
      <label>Compare with<select id="c-compare">

        <option value="yoy" ${S.compare === 'yoy' ? 'selected' : ''}>Same time last year</option>
        <option value="custom" ${S.compare === 'custom' ? 'selected' : ''}>Pick dates…</option></select></label>

    </div>
    <div class="page-sub" style="margin:-6px 0 14px"><b>${esc(fmtRange(cur))}</b>${cmp ? ` compared with <b>${esc(cmpLabel)}</b>` : ''}</div>
    ${buildCount ? `<div class="banner">${buildCount} booth${buildCount > 1 ? 's are' : ' is'} in build mode and left out of these figures.</div>` : ''}
    ${price0.length ? `<div class="banner">${price0.length === booths.length ? 'No price per session is set yet' : esc(price0.map(b => b.name).join(', ')) + ' has no price per session'}, so sales and profit will read as £0 there. <a href="#/settings">Set prices and costs</a>.</div>` : ''}
    <div class="summary">
      ${tile('sales')}
      ${tile('costs', '', T.costs ? `prints ${money0(T.printCost)} · fees ${money0(T.fees)} · running ${money0(T.running)}` : '')}
      ${tile('refunds', '', T.refundCount ? `${T.refundCount} refund${T.refundCount > 1 ? 's' : ''}, taken off profit` : 'none recorded')}
      ${tile('profit', 'hero', T.sessions ? `${money(perSession)} per session` : '')}

        <div style="display:flex;gap:8px;flex-wrap:wrap"><div class="seg" role="group" aria-label="Measure">${Object.entries(METRICS).map(([k, n]) => `<button data-metric="${k}" class="${S.metric === k ? 'on' : ''}">${n}</button>`).join('')}</div>
        <div class="seg" role="group" aria-label="View"><button data-view="chart" class="${showTable ? '' : 'on'}">Chart</button><button data-view="table" class="${showTable ? 'on' : ''}">Table</button></div></div></div>
      <div id="chart-main"></div>

    <section class="panel">

        <tbody>${perRows}</tbody>

      <div id="chart-year"></div>
    </section>
    <p class="page-sub" style="margin-top:14px">Sales and costs use each booth's current price and costs for every date shown. Running costs are spread evenly across the days of each month. Refunds come from the Support tab and are counted on the day the customer used the booth.</p>`;

  const $ = id => document.getElementById(id);
  const rerender = () => { saveCompanyState(); drawCompany(); };
  $('c-period').onchange = e => { S.period = e.target.value; if(S.period === 'custom' && !S.customFrom){ S.customFrom = cur[0]; S.customTo = cur[1]; } rerender(); };

    cmp: YP.buckets.map(b => b.profit), cmpLabels: YP.buckets.map(b => fmtMonth(b.day)), cmpName: 'The 12 months before',
